name: Android native

# Emulator jobs only run for pull requests that touch the mobile shell. fe/**
# changes still reach them on push to main because the APK bundles the fe build.
on:
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-native.yml', 'rust-toolchain.toml']
  push:
    branches: [main]
    paths: ['mobile/**', 'fe/**', '.github/workflows/mobile-native.yml', 'rust-toolchain.toml']

permissions:
  contents: read

env:
  NPM_CONFIG_AUDIT: 'false'

concurrency:
  group: android-native-${{ github.ref }}
  # Native mutation runs must restore production source before ending.
  cancel-in-progress: false

jobs:
  native:
    name: mobile native (API 35)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
      RUSTC_WRAPPER: ''
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            fe/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: mobile/p2p-native/go.mod
          cache-dependency-path: mobile/p2p-native/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            mobile/src-tauri -> target
          shared-key: mobile-native
      - name: Prepare native toolchains
        run: |
          rustup show active-toolchain
          rustup target add x86_64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;29.0.14206865'
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          npm --prefix mobile ci
          npm --prefix fe ci
      - name: Build the real backend
        run: |
          env -u NEIGE_CODEX_BIN cargo build --locked --release -p calm-server --bin calm-server
      - name: Start the isolated native test backend
        run: |
          node mobile/tests/native/backend.mjs "$PWD/target/release/calm-server" "$PWD/mobile/src-tauri/gen/android/app/src/instrumented/res/raw/neige_instrumentation_ca.pem" "$RUNNER_TEMP/neige-native" > "$RUNNER_TEMP/neige-native.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/neige-native.pid"
          for attempt in $(seq 1 60); do
            if [ -f "$RUNNER_TEMP/neige-native/runtime.json" ]; then exit 0; fi
            kill -0 "$(cat "$RUNNER_TEMP/neige-native.pid")" || { cat "$RUNNER_TEMP/neige-native.log"; exit 1; }
            sleep 1
          done
          cat "$RUNNER_TEMP/neige-native.log"
          exit 1
      - name: Start loopback-only HTTP test peers
        run: |
          python3 mobile/tests/native/ip-fixture.py > "$RUNNER_TEMP/ip-fixture.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/ip-fixture.pid"
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5413/api/version > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Build normal APK with test CA present and prove it is excluded
        run: |
          test -f mobile/src-tauri/gen/android/app/src/instrumented/res/raw/neige_instrumentation_ca.pem
          env -u NEIGE_CODEX_BIN npm --prefix mobile run tauri -- android build --debug --apk --target x86_64
          npm --prefix mobile run verify:apk -- src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
      # The normal APK above is verified before producing the separate native
      # test library. Only the instrumented source set packages its CA loader.
      - name: Build instrumentation-only native fixture trust
        env:
          GOMAXPROCS: '2'
        run: mobile/scripts/build-p2p-native.sh x86_64 instrumented
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # One emulator session: the instrumented variant against the real backend
      # (with the authority-fence mutation), then the debug variant's direct
      # connection, navigation and remembered-session checks against the peers.
      - name: Run native loading, authority and direct connection tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: |
            node mobile/tests/native/run.mjs "$RUNNER_TEMP/neige-native/runtime.json" --mutation
            mobile/tests/native/run-launcher-smoke.sh
      - name: Stop the test backend and peers
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/neige-native.pid" ]; then kill "$(cat "$RUNNER_TEMP/neige-native.pid")" || true; fi
          if [ -f "$RUNNER_TEMP/ip-fixture.pid" ]; then kill "$(cat "$RUNNER_TEMP/ip-fixture.pid")" || true; fi
      - name: Check source restoration
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-native-api-35
          path: |
            mobile/artifacts/native/
            mobile/artifacts/resume-*.txt
            mobile/src-tauri/gen/android/app/build/outputs/androidTest-results/
            mobile/src-tauri/gen/android/app/build/reports/androidTests/
          retention-days: 7
          if-no-files-found: ignore

  release:
    name: mobile release smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '4'
      RUSTC_WRAPPER: ''
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: mobile/p2p-native/go.mod
          cache-dependency-path: mobile/p2p-native/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/src-tauri -> target
          shared-key: mobile-release
          cache-on-failure: true
      - name: Verify credential-free release diagnostics
        run: python3 -m unittest discover -s mobile/tests/native -p test_release_smoke.py
      - name: Verify Go transport boundaries
        working-directory: mobile/p2p-native
        run: go test -p 4 -count=1 ./...
      - name: Build the minified release APK with userspace networking
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;29.0.14206865'
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          export NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          rustup target add x86_64-linux-android
          npm --prefix mobile ci
          npm --prefix fe ci
          env -u NEIGE_CODEX_BIN npm --prefix mobile run tauri -- android build --apk --target x86_64
      - name: Start loopback-only HTTP test peers
        run: |
          python3 mobile/tests/native/ip-fixture.py > "$RUNNER_TEMP/ip-fixture.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/ip-fixture.pid"
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5413/api/version > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Drive the release APK through adb
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: python3 mobile/tests/native/run-release-smoke.py
      - name: Stop test peers
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ip-fixture.pid" ]; then kill "$(cat "$RUNNER_TEMP/ip-fixture.pid")" || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-release-smoke-result
          path: mobile/artifacts/release-smoke/
          retention-days: 3
          if-no-files-found: ignore
