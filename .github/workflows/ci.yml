name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Full mutation evidence at 03:17 Asia/Shanghai, away from the normal merge window.
    - cron: "17 19 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'mutation-full' || github.ref }}
  # New commits supersede PR/push evidence. A scheduled/manual full sweep is the durable backstop
  # and must not be cancelled by a later main push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

# Every job in this workflow only needs to read the checkout. Keep the token
# least-privileged, especially for the persistent self-hosted runner used by
# trusted pushes to this repository's main branch.
permissions:
  contents: read

env:
  # `npm ci` audits by default; that advisory request is not a gate and a retired audit endpoint can stall installs.
  NPM_CONFIG_AUDIT: "false"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: short
  # Set globally, not per-job: the shared rust-cache key hashes env, so a per-job value would split the cache.
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
jobs:
  changes:
    name: classify changes
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      rust_changed: ${{ steps.classify.outputs.rust_changed }}
      fe_changed: ${{ steps.classify.outputs.fe_changed }}
      openapi_changed: ${{ steps.classify.outputs.openapi_changed }}
      fe_e2e_changed: ${{ steps.classify.outputs.fe_e2e_changed }}
      stack_changed: ${{ steps.classify.outputs.stack_changed }}
      mutation_changed: ${{ steps.classify.outputs.mutation_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: classify affected CI surfaces
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.after || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          scripts/ci/classify-code-changes-selftest.sh
          rust_changed=true
          fe_changed=true
          openapi_changed=true
          fe_e2e_changed=true
          stack_changed=true
          mutation_changed=true
          if [ -n "${BASE_SHA:-}" ] \
             && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
             && git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            if [ "$EVENT_NAME" = "pull_request" ]; then
              diff_range="$BASE_SHA...$HEAD_SHA"
            else
              diff_range="$BASE_SHA..$HEAD_SHA"
            fi
            classify() {
              git diff --name-only -z "$diff_range" -- \
                | scripts/ci/classify-code-changes.sh "$@"
            }
            rust_changed="$(classify rust)"
            fe_changed="$(classify fe)"
            openapi_changed="$(classify openapi)"
            fe_e2e_changed="$(classify fe-e2e)"
            stack_changed="$(classify stack)"
            mutation_changed="$(classify mutation)"
          fi
          for output_name in rust_changed fe_changed \
            openapi_changed fe_e2e_changed stack_changed mutation_changed; do
            output_value="${!output_name}"
            echo "$output_name=$output_value"
            echo "$output_name=$output_value" >> "$GITHUB_OUTPUT"
          done

  # The stable required context always runs the cheap cross-tree ratchets; Rust steps are scoped to Rust-relevant changes.
  lint:
    name: lint (fmt + ratchets + clippy)
    needs: changes
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    env:
      RUN_RUST_CHECKS: ${{ needs.changes.result != 'success' || needs.changes.outputs.rust_changed == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The frozen-vector rationale check below audits every commit in the event range.
          fetch-depth: 0
          persist-credentials: false

      - name: local Rust gate safety selftest
        if: env.RUN_RUST_CHECKS == 'true'
        run: scripts/ci/local-rust-gates-selftest.sh

      # Version comes from rust-toolchain.toml; the zero-argument form needs rustup >= 1.28.
      - name: install pinned Rust toolchain (rust-toolchain.toml)
        if: env.RUN_RUST_CHECKS == 'true'
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@v2
        if: env.RUN_RUST_CHECKS == 'true'
        with:
          # Not the shared `workspace` key: rust-cache saves only the first finisher, and clippy's rmeta-only artifacts would starve the test job.
          shared-key: lint

      - name: cargo fmt --all --check
        if: env.RUN_RUST_CHECKS == 'true'
        run: cargo fmt --all --check

      - name: frozen-vector gate discriminates branch-creation pushes (#1294)
        if: env.RUN_RUST_CHECKS == 'true'
        run: scripts/ci/frozen-vector-gate-selftest.sh

      - name: vectors dir changes require FROZEN-VECTOR-CHANGE rationale
        if: env.RUN_RUST_CHECKS == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: scripts/ci/frozen-vector-gate.sh

      - name: single migrations/ dir gate (#679 PR2)
        if: env.RUN_RUST_CHECKS == 'true'
        run: |
          count=$(find . -maxdepth 4 -type d -name migrations -not -path './external/*' -not -path './target/*' | wc -l)
          [ "$count" -eq 1 ] && echo "OK: 1 migrations/ directory" || { echo "::error::expected 1 migrations/ directory, found $count"; exit 1; }

      - name: harness raw status UPDATE gate (#679 PR3a)
        if: env.RUN_RUST_CHECKS == 'true'
        run: |
          set -euo pipefail
          paths=(
            crates/calm-server/src/harness
            # Deliberately unquoted: a no-match literal fails the path check below.
            crates/calm-server/src/operation/planner_harness_*.rs
          )
          for path in "${paths[@]}"; do
            [ -e "$path" ] || { echo "::error::required harness scan path does not exist: $path"; exit 1; }
          done
          set +e
          output="$(grep -rniE "update[[:space:]]+runtimes" "${paths[@]}" 2>&1)"
          rc=$?
          set -e
          case "$rc" in
            0)
              printf '%s\n' "$output"
              hits="$(printf '%s\n' "$output" | wc -l)"
              echo "::error::raw UPDATE runtimes survives in harness paths ($hits)"
              exit 1
              ;;
            1) echo "OK: no raw runtimes UPDATE in harness paths" ;;
            *)
              # No fixture pins this inline infrastructure-error branch; fail closed as defense in depth.
              printf '%s\n' "$output"
              echo "::error::raw UPDATE runtimes harness scan failed with exit $rc"
              exit 1
              ;;
          esac

      - name: install ripgrep for ratchets
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: verify self-hosted ratchet dependencies
        if: runner.environment == 'self-hosted'
        run: command -v rg

      - name: runtimes ratchet selftest
        if: env.RUN_RUST_CHECKS == 'true'
        run: scripts/ci/ratchets/selftest.sh

      - name: PR9b-iv runtimes retirement ratchet (#758)
        if: env.RUN_RUST_CHECKS == 'true'
        run: scripts/ci/ratchets/runtimes_retirement.sh

      - name: dropped runtimes table reintroduction ratchet (#679 PR10)
        if: env.RUN_RUST_CHECKS == 'true'
        run: scripts/ci/ratchets/dropped_runtimes_table.sh

      - name: report-write boundary selftest (#1318)
        if: env.RUN_RUST_CHECKS == 'true'
        run: scripts/ci/ratchets/report_write_boundary_selftest.sh

      - name: report-write boundary gate (#1318)
        if: env.RUN_RUST_CHECKS == 'true'
        run: scripts/ci/ratchets/report_write_boundary.sh

      - name: append-seam boundary selftest (#1252 S3′)
        if: env.RUN_RUST_CHECKS == 'true'
        run: scripts/ci/ratchets/append_seam_boundary_selftest.sh

      - name: append-seam boundary gate (#1252 S3′)
        if: env.RUN_RUST_CHECKS == 'true'
        run: scripts/ci/ratchets/append_seam_boundary.sh

      - name: no parallel operation-event entrance (#679 PR4)
        if: env.RUN_RUST_CHECKS == 'true'
        run: |
          set -euo pipefail
          path=crates/
          [ -e "$path" ] || { echo "::error::required operation-event scan path does not exist: $path"; exit 1; }
          set +e
          output="$(grep -rnE "event_append_for_operation_tx|events_append_for_operation_tx" "$path" 2>&1)"
          rc=$?
          set -e
          case "$rc" in
            0)
              printf '%s\n' "$output"
              echo "::error::parallel operation-event entrance event_append_for_operation_tx/events_append_for_operation_tx survives"
              exit 1
              ;;
            1) echo "OK: no parallel operation-event entrance" ;;
            *)
              # No fixture pins this inline infrastructure-error branch; fail closed as defense in depth.
              printf '%s\n' "$output"
              echo "::error::operation-event entrance scan failed with exit $rc"
              exit 1
              ;;
          esac

      - name: token authority audit gate (#679 PR7b-i)
        if: env.RUN_RUST_CHECKS == 'true'
        run: |
          set -euo pipefail
          paths=(
            crates/calm-server/src/mcp_server/handshake.rs
            crates/calm-server/src/mcp_server/transport.rs
          )
          for path in "${paths[@]}"; do
            [ -e "$path" ] || { echo "::error::required token authority scan path does not exist: $path"; exit 1; }
          done
          grep -q "session_get_by_active_token_hash" crates/calm-server/src/mcp_server/handshake.rs \
            || { echo "::error::handshake must authenticate through active worker_sessions"; exit 1; }
          set +e
          output="$(grep -n "card_mcp_token_lookup_by_hash" crates/calm-server/src/mcp_server/handshake.rs 2>&1)"
          rc=$?
          set -e
          case "$rc" in
            0)
              printf '%s\n' "$output"
              echo "::error::handshake must not authenticate through card_mcp_token_lookup_by_hash/card_mcp_tokens"
              exit 1
              ;;
            1) ;;
            *)
              # No fixture pins this inline infrastructure-error branch; fail closed as defense in depth.
              printf '%s\n' "$output"
              echo "::error::card_mcp_token_lookup_by_hash handshake scan failed with exit $rc"
              exit 1
              ;;
          esac
          set +e
          output="$(grep -nE "\.card_get\(|\.card_role_get\(" crates/calm-server/src/mcp_server/transport.rs 2>&1)"
          rc=$?
          set -e
          case "$rc" in
            0)
              printf '%s\n' "$output"
              echo "::error::transport auth path must not resolve per-call identity through card_get/card_role_get"
              exit 1
              ;;
            1) ;;
            *)
              # No fixture pins this inline infrastructure-error branch; fail closed as defense in depth.
              printf '%s\n' "$output"
              echo "::error::card_get/card_role_get transport scan failed with exit $rc"
              exit 1
              ;;
          esac
          echo "OK: MCP token authority is session-bound and transport per-call auth is session-derived"

      # Backstop for the cargo-feature gate on `AppState::raw_repo`; tests under `tests/*.rs` are legitimate consumers and are not scanned.
      - name: sanity — no raw_repo escape in production
        if: env.RUN_RUST_CHECKS == 'true'
        run: |
          set -euo pipefail
          paths=(
            crates/calm-server/src/routes/
            crates/calm-server/src/plugin_host/
            crates/calm-server/src/terminal_sweeper.rs
            crates/calm-server/src/replay.rs
          )
          for path in "${paths[@]}"; do
            [ -e "$path" ] || { echo "::error::required raw_repo scan path does not exist: $path"; exit 1; }
          done
          set +e
          output="$(grep -rn "raw_repo" "${paths[@]}" 2>&1)"
          rc=$?
          set -e
          case "$rc" in
            0)
              printf '%s\n' "$output"
              echo "::error::raw_repo() used in production module — must go through write_with_event"
              exit 1
              ;;
            1) echo "OK: no raw_repo escape in production" ;;
            *)
              # No fixture pins this inline infrastructure-error branch; fail closed as defense in depth.
              printf '%s\n' "$output"
              echo "::error::raw_repo production scan failed with exit $rc"
              exit 1
              ;;
          esac

      - name: pgid escape gate (#1013 T11)
        if: env.RUN_RUST_CHECKS == 'true'
        # The probe must fail with E0616 on Pgid's field specifically; "it failed" alone is a fake gate.
        # This feature means calm-proc-supervisor can never be built with `--all-features`.
        run: |
          set -uo pipefail
          out="$(cargo check -p calm-proc-supervisor --features pgid-escape-probe 2>&1)" && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error::pgid-escape-probe compiled successfully — the Pgid tuple field is readable outside pgid_lease again"
            exit 1
          fi
          if ! printf '%s' "$out" | grep -qF 'error[E0616]: field `0` of struct `Pgid` is private'; then
            echo "::error::pgid-escape-probe failed, but not with E0616 on Pgid's field — the probe is broken, not the invariant. (One real-invariant case also lands here: if the number was flattened back into the enum variants, p.0 applies to a bare pid_t and rustc emits E0609. Check the variants before believing this message.)"
            exit 1
          fi
          if ! printf '%s' "$out" | grep -qF 'crates/calm-proc-supervisor/src/lib.rs'; then
            echo "::error::the E0616 did not point at crates/calm-proc-supervisor/src/lib.rs — it is not the probe's expression that failed"
            exit 1
          fi
          echo "OK: probe fails with E0616 on Pgid's private field, in calm-proc-supervisor/src/lib.rs"

      - name: append-seam escape probe (#1252 S3′ PR-B)
        if: env.RUN_RUST_CHECKS == 'true'
        # One `cargo check` per probe feature: rustc aborts after type checking, so the later-pass E0451 privacy check never runs when probes share a feature.
        # calm-truth can therefore never be built with `--all-features`.
        run: |
          set -uo pipefail
          fail=0
          check_probe() {
            local feature="$1" want="$2"
            local out rc
            # `CARGO_TERM_COLOR=never` is load-bearing: the workflow forces colour at the env level, and the escape codes rustc
            # then emits land between `]` and `:` so the substring test below stops matching. Local runs cannot reproduce it.
            out="$(CARGO_TERM_COLOR=never cargo check -p calm-truth --features "$feature" 2>&1)" && rc=0 || rc=$?
            if [ "$rc" -eq 0 ]; then
              printf '%s\n' "$out"
              echo "::error::$feature compiled successfully — that bypass of the append seam is legal Rust again"
              fail=1
              return
            fi
            # bash's own substring test, no subprocess: a `printf | grep` in an assertion path here produced a false RED about once in forty runs.
            case "$out" in
              *"$want"*) ;;
              *)
                printf '%s\n' "$out"
                echo "::error::$feature failed, but not with: $want — the probe is broken, not the invariant. Read the diagnostic above before believing this message."
                fail=1
                return
                ;;
            esac
            case "$out" in
              *"crates/calm-truth/src/db/sqlite/events.rs"*) ;;
              *)
                printf '%s\n' "$out"
                echo "::error::$feature failed with the right code but not at events.rs — it is not the probe's expression that failed"
                fail=1
                return
                ;;
            esac
            echo "OK: $feature — $want"
          }
          check_probe append-seam-escape-probe-retarget \
            'error[E0616]: field `event` of struct `Authorized` is private'
          check_probe append-seam-escape-probe-forge \
            'error[E0451]: fields `actor`, `scope` and `event` of struct `Authorized` are private'
          check_probe append-seam-escape-probe-functional-update \
            'error[E0451]: fields `actor`, `scope` and `event` of struct `Authorized` are private'
          check_probe append-seam-escape-probe-ungated-append \
            'error[E0061]: this function takes 3 arguments but 5 arguments were supplied'
          exit "$fail"

      - name: pgid accessor ratchet (#1013 T11 companion)
        if: env.RUN_RUST_CHECKS == 'true'
        # Text-scan drift detector, not a proof: the E0616 probe only sees `p.0`, so this catches accessor/derive shapes inside `mod pgid_lease`.
        run: |
          set -euo pipefail
          src=crates/calm-proc-supervisor/src/lib.rs
          region="$(awk '/^mod pgid_lease \{$/,/^\}$/' "$src" | grep -v '^[[:space:]]*//' || true)"
          if [ -z "$region" ]; then
            echo "::error::could not locate 'mod pgid_lease { .. }' in $src — this ratchet is scanning nothing"
            exit 1
          fi
          # Whitespace-normalized single line: multiline signatures and multiline
          # `impl` headers must not be able to hide from the scans below.
          flat="$(printf '%s\n' "$region" | tr '\n' ' ' | tr -s '[:space:]' ' ')"
          impl_block="$(printf '%s\n' "$region" | awk '/^    impl Pgid \{$/,/^    \}$/')"
          if [ -z "$impl_block" ]; then
            echo "::error::could not locate 'impl Pgid { .. }' — the ratchet is scanning nothing"
            exit 1
          fi
          # Exactly one method on Pgid, and it is the module-private `raw`.
          n_fns="$(printf '%s\n' "$impl_block" | grep -c 'fn ' || true)"
          if [ "$n_fns" != "1" ]; then
            echo "::error::impl Pgid has $n_fns methods, expected exactly 1 (fn raw). A second method is an accessor escape the E0616 probe cannot see."
            printf '%s\n' "$impl_block"
            exit 1
          fi
          if ! printf '%s\n' "$impl_block" | grep -qF 'fn raw(&self) -> libc::pid_t {'; then
            echo "::error::impl Pgid's single method is not the expected module-private 'fn raw(&self) -> libc::pid_t'"
            printf '%s\n' "$impl_block"
            exit 1
          fi
          if printf '%s\n' "$impl_block" | grep -qE '\bpub(\(|\s)'; then
            echo "::error::impl Pgid contains a pub/pub(super) method — the number is readable outside pgid_lease"
            printf '%s\n' "$impl_block"
            exit 1
          fi
          # A free `pub(super) fn` returning `pid_t`, or one on `impl GroupSignalTarget`, hands the number out while leaving `p.0` private and `impl Pgid` untouched.
          if printf '%s\n' "$flat" | grep -oE 'pub\(super\)[[:space:]]+fn[^;{]*->[^;{]*pid_t'; then
            echo "::error::a pub(super) fn in mod pgid_lease returns a pid_t — the number is readable outside the module (the E0616 probe only sees p.0)"
            exit 1
          fi
          # A Display/Debug that prints the pgid is an accessor in text, and `impl From<Pgid> for pid_t` is one with the conversion spelled out; both sides of `for` are checked.
          if printf '%s\n' "$flat" | grep -oE 'impl[^!{;]*[[:space:]]for[[:space:]]+Pgid[^[:alnum:]_]'; then
            echo "::error::a trait is implemented for Pgid — Debug/Display/Deref all leak the number"
            exit 1
          fi
          if printf '%s\n' "$flat" | grep -oE 'impl[^!{;]*Pgid[^!{;]*[[:space:]]for[[:space:]]'; then
            echo "::error::a trait is implemented with Pgid on the impl-type side (e.g. From<Pgid> for pid_t) — that is an accessor"
            exit 1
          fi
          if printf '%s\n' "$region" | grep -q 'derive'; then
            echo "::error::a derive appeared inside mod pgid_lease — Pgid must have no derives (see the struct's doc comment)"
            printf '%s\n' "$region" | grep -n 'derive'
            exit 1
          fi
          echo "OK: none of the accessor/derive shapes this ratchet knows about are present (this is drift detection, not a completeness proof)"

      - name: web compat version lockstep gate (#1209 PR-2)
        run: ./scripts/gate-web-compat-version-lockstep.sh

      - name: sync event version lockstep gate (#1316 S4b)
        run: ./scripts/gate-sync-event-version-lockstep.sh

      - name: sync event version lockstep gate discriminates (#1316 S4b)
        run: ./scripts/gate-sync-event-version-lockstep.sh --selftest

      - name: template rename residual gate (#1209 PR-2, acceptance B10)
        run: ./scripts/gate-1209-template-rename-residual.sh

      - name: terminology ratchet (#1316 S0)
        run: ./scripts/gate-1316-terminology-ratchet.sh

      - name: terminology ratchet discriminates (#1316 S0)
        run: ./scripts/gate-1316-terminology-ratchet.sh --selftest

      - name: prose ratchet (#1635 S6)
        run: ./scripts/gate-prose-ratchet.sh

      - name: prose ratchet discriminates (#1635 S6)
        run: ./scripts/gate-prose-ratchet.sh --selftest

      - name: cargo clippy --workspace --all-targets -- -D warnings
        if: env.RUN_RUST_CHECKS == 'true'
        run: cargo clippy --workspace --all-targets --features calm-server/codex-e2e -- -D warnings

  rust-shards:
    name: rust test shard ${{ matrix.shard }}/${{ github.event_name == 'pull_request' && '4' || '1' }}
    needs: changes
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'push') && (needs.changes.result != 'success' || needs.changes.outputs.rust_changed == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        # Trusted main pushes stay single-job: concurrent jobs must not share the persistent self-hosted target directory.
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '[1,2,3,4]' || '[1]') }}
    # This repository is public: fork PRs stay on isolated GitHub-hosted
    # runners. Only trusted pushes to the canonical repository use the local
    # machine. The repository check also keeps pushes in forks on hosted CI.
    runs-on: ${{ github.event_name == 'push' && github.repository == 'keanji-x/neige-calm' && 'neige-calm-main' || 'ubuntu-latest' }}
    env:
      CARGO_TARGET_DIR: ${{ github.event_name == 'push' && github.repository == 'keanji-x/neige-calm' && '/home/runner/target-neige-calm-main' || format('{0}/target', github.workspace) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: prepare self-hosted Rust environment
        if: runner.environment == 'self-hosted'
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # Persistent hosts can have /tmp fixtures owned by another user, and this runner does not empty RUNNER_TEMP between jobs,
          # so the job owns a private subdirectory and removes it itself in the "remove job-private TMPDIR" step.
          TMPDIR="$(mktemp -d "$RUNNER_TEMP/rust-XXXXXXXX")"
          echo "TMPDIR=$TMPDIR" >> "$GITHUB_ENV"

      - name: install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update

      # mold via ld takeover rather than RUSTFLAGS: RUSTFLAGS feeds the rust-cache key and would split the shared cache across jobs.
      # The action writes under /usr/local, so the unprivileged self-hosted runner uses the system linker.
      - uses: rui314/setup-mold@v1
        if: runner.environment == 'github-hosted'

      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          # Test artifacts are profile/feature-specific; GitHub cache keys are immutable, so sharing a key with faster jobs persists a partial cache forever.
          shared-key: rust-test
          key: ${{ hashFiles('**/*.rs') }}
          cache-workspace-crates: true

      # Two neige-app tailnet tests build the Go helper at test time; the self-hosted runner has no Go on PATH.
      - uses: actions/setup-go@v5
        with:
          go-version-file: tailnet/go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: tailnet/go.sum

      - uses: taiki-e/install-action@nextest

      - name: install isolated provider fixture dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3
          test "$RUNNER_ENVIRONMENT" = github-hosted
          policy=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -f "$policy" ]; then
            cat "$policy" > "$RUNNER_TEMP/isolated-provider-userns-policy"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: build cross-package isolated provider fixture executables
        run: |
          cargo build --locked -p calm-worker-runtime -p neige-mcp-stdio-shim \
            --bin calm-worker-boundary --bin neige-mcp-stdio-shim

      - name: cargo nextest run --workspace --locked
        # codex-e2e tests self-skip at runtime when no codex binary is discoverable. nextest runs no doctests and this repo
        # has none (every doc fence carries a non-rust tag); add a `cargo test --doc` step if that changes.
        run: |
          set -euo pipefail
          partition_args=()
          partition_total="${{ github.event_name == 'pull_request' && '4' || '1' }}"
          if [ "$partition_total" -gt 1 ]; then
            partition_args+=(--partition "count:${{ matrix.shard }}/$partition_total")
          fi
          scripts/run-ci-rust-nextest.sh \
            "${{ runner.environment }}" "${partition_args[@]}"

      - name: restore hosted isolated provider namespace policy
        if: always() && runner.environment == 'github-hosted'
        run: |
          policy_file="$RUNNER_TEMP/isolated-provider-userns-policy"
          if [ -f "$policy_file" ]; then
            original_policy=$(cat "$policy_file")
            sudo sysctl -w "kernel.apparmor_restrict_unprivileged_userns=$original_policy"
          fi

      # nextest's store dir is target/nextest under the workspace root, not under CARGO_TARGET_DIR.
      - name: upload nextest junit timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit-${{ matrix.shard }}-of-${{ github.event_name == 'pull_request' && '4' || '1' }}
          path: target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: ignore

      # The self-hosted runner does not empty RUNNER_TEMP between jobs; only a `$RUNNER_TEMP/rust-*` directory is ever removed.
      - name: remove job-private TMPDIR
        if: always() && runner.environment == 'self-hosted'
        run: |
          case "${TMPDIR:-}" in
            */..|*/../*) echo "refusing to remove TMPDIR='$TMPDIR' (contains ..)"; exit 1 ;;
            "$RUNNER_TEMP"/rust-*) rm -rf -- "$TMPDIR" ;;
            *) echo "refusing to remove TMPDIR='${TMPDIR:-}' (not under $RUNNER_TEMP/rust-)"; exit 1 ;;
          esac

  worker-boundary:
    name: worker process isolation
    needs: changes
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'push') && (needs.changes.result != 'success' || needs.changes.outputs.rust_changed == 'true') }}
    # Namespace tests execute only a fake provider on an ephemeral hosted runner.
    # Never change namespace policy on the shared production runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: install namespace test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3
      - name: permit namespace tests on the ephemeral hosted runner
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          policy=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -f "$policy" ]; then
            cat "$policy" > "$RUNNER_TEMP/worker-boundary-userns-policy"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: install pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: worker-boundary
      - uses: taiki-e/install-action@nextest
      - name: verify owned process boundaries
        run: |
          env -u NEIGE_CODEX_BIN RUSTC_WRAPPER= CARGO_BUILD_JOBS=6 \
            cargo nextest run --locked --profile ci -p calm-worker-runtime \
              --features test-support --test-threads 8 --no-fail-fast
          cargo clippy --locked -p calm-worker-runtime --all-targets \
            --features test-support -- -D warnings
      - name: restore hosted namespace policy
        if: always()
        run: |
          policy_file="$RUNNER_TEMP/worker-boundary-userns-policy"
          if [ -f "$policy_file" ]; then
            original_policy=$(cat "$policy_file")
            sudo sysctl -w "kernel.apparmor_restrict_unprivileged_userns=$original_policy"
          fi

  # Preserve the required status-check name while the worker job is a matrix.
  # This job performs no checkout and is the single branch-protection verdict.
  rust:
    name: rust (test)
    needs: [changes, rust-shards, worker-boundary]
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'push') && (needs.changes.result != 'success' || needs.changes.outputs.rust_changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: require every Rust test shard to pass
        env:
          SHARD_RESULT: ${{ needs.rust-shards.result }}
          BOUNDARY_RESULT: ${{ needs.worker-boundary.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "::error::Rust test shards finished with: $SHARD_RESULT"
            exit 1
          fi
          if [ "$BOUNDARY_RESULT" != "success" ]; then
            echo "::error::Worker process isolation finished with: $BOUNDARY_RESULT"
            exit 1
          fi

  # Branch protection requires this stable context. After retirement its
  # acceptance condition is absence of the legacy source, not building it.
  web-unit:
    name: web-unit (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify the legacy frontend is retired
        run: |
          if [ -e web ]; then
            echo "::error::The retired legacy web/ tree must not be reintroduced."
            exit 1
          fi

  fe-unit:
    permissions:
      contents: read
      pull-requests: read
    name: fe-unit (lint + build + test)
    needs: changes
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'push') && (needs.changes.result != 'success' || needs.changes.outputs.fe_changed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after || github.sha }}
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the readonly gate can diff against the PR base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Validate Node against package engines
        run: node -e "const semver=require('semver');const range=require('./package.json').engines.node;if(!semver.satisfies(process.version,range))process.exit(1)"

      - name: npm run lint
        env:
          OWNERSHIP_BASE_SHA: ${{ env.BASE_SHA }}
          OWNERSHIP_HEAD_SHA: ${{ env.HEAD_SHA }}
          OWNERSHIP_EVENT_NAME: ${{ github.event_name }}
          OWNERSHIP_PUSH_FORCED: ${{ github.event.forced || false }}
          GITHUB_TOKEN: ${{ github.event_name == 'push' && github.token || '' }}
        run: npm run lint

      - name: npm run build
        run: npm run build

      - name: npm run test
        run: npm run test

  fe-browser:
    name: fe-browser (vitest + chromium)
    needs: changes
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'push') && (needs.changes.result != 'success' || needs.changes.outputs.fe_changed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Install Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Production PWA installation check
        run: npx playwright test --config tools/pwa/playwright.config.ts

      - name: npm run test:browser
        run: npm run test:browser

  # The shard count follows the selected-entry count; this job runs the same selection code path as the shards (`run.mjs --plan`), so the plan cannot drift from what they run.
  fe-mutation-plan:
    name: fe-mutation-plan
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      MUTATION_TEST_SCOPE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'witness' }}
      RUN_MUTATION_PLAN: ${{ needs.changes.result != 'success' || needs.changes.outputs.mutation_changed == 'true' }}
    defaults:
      run:
        working-directory: fe
    outputs:
      shards: ${{ steps.plan.outputs.shards || steps.noop.outputs.shards }}
      matrix: ${{ steps.plan.outputs.matrix || steps.noop.outputs.matrix }}
      total: ${{ steps.plan.outputs.total || steps.noop.outputs.total }}
      selected: ${{ steps.plan.outputs.selected || steps.noop.outputs.selected }}
      test_scope: ${{ steps.plan.outputs.test_scope || steps.noop.outputs.test_scope }}
    steps:
      - uses: actions/checkout@v4
        if: env.RUN_MUTATION_PLAN == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: env.RUN_MUTATION_PLAN == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: npm ci
        if: env.RUN_MUTATION_PLAN == 'true'
        run: npm ci

      - name: Select no mutation evidence for unrelated changes
        id: noop
        if: env.RUN_MUTATION_PLAN != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          echo 'shards=[]' >> "$GITHUB_OUTPUT"
          echo 'matrix=[]' >> "$GITHUB_OUTPUT"
          echo 'total=1' >> "$GITHUB_OUTPUT"
          echo 'selected=0' >> "$GITHUB_OUTPUT"
          echo 'test_scope=witness' >> "$GITHUB_OUTPUT"

      # Harness fixtures run once here, before any fan-out.
      - name: Plan mutation shards
        id: plan
        if: env.RUN_MUTATION_PLAN == 'true'
        run: |
          set -euo pipefail
          npm run test:mutation:fixtures
          args=(--test-scope "$MUTATION_TEST_SCOPE")
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "push" ]; then
            if [ -n "${BASE_SHA:-}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              args+=(--base "$BASE_SHA")
            else
              echo "::warning::mutation base is unavailable; selecting the full manifest"
            fi
          fi
          plan=$(npm run --silent test:mutation:plan -- "${args[@]}")
          echo "plan=$plan"
          # jq parses the WHOLE captured stdout, so any extra line is a parse error rather than a silently wrong plan.
          # Each value is its own assignment so `set -e` fires on a jq failure (inside `echo "x=$(...)"` the status is discarded).
          shards=$(printf '%s' "$plan" | jq -c '.shards')
          matrix=$(printf '%s' "$plan" | jq -c '.matrix')
          total=$(printf '%s' "$plan" | jq -r '.total')
          selected=$(printf '%s' "$plan" | jq -r '.selected')
          clamped=$(printf '%s' "$plan" | jq -r '.clamped')
          test_scope=$(printf '%s' "$plan" | jq -r '.test_scope')
          # `selected` is validated alongside `total`: it is arithmetic input below, and under
          # `set -eu` a non-numeric value aborts the step anyway — a malformed plan SHOULD fail here.
          case "$total" in ''|*[!0-9]*) total='' ;; esac
          case "$selected" in ''|*[!0-9]*) selected='' ;; esac
          if [ -z "$shards" ] || [ -z "$matrix" ] || [ -z "$total" ] || [ -z "$selected" ] \
             || [ "$total" = "0" ] || [ "${shards#\[}" = "$shards" ] || [ "${matrix#\[}" = "$matrix" ] \
             || { [ "$test_scope" != "full" ] && [ "$test_scope" != "witness" ]; }; then
            echo "mutation plan did not produce a usable shard matrix; raw plan: $plan" >&2
            exit 1
          fi
          # The shard list must be EXACTLY 1..total: `{"total":99999,"shards":[1]}` would run one shard of `--shard 1/99999` and the aggregate gate would go green.
          if ! printf '%s' "$plan" | jq -e '
            (.shards | length) == .total
            and .shards == [range(1; .total + 1)]
            and (.matrix | length) == .total
            and [.matrix[].shard] == .shards
            and all(.matrix[]; (.browser | type) == "boolean")
          ' >/dev/null; then
            echo "mutation plan shard list/matrix is not exactly 1..total; raw plan: $plan" >&2
            exit 1
          fi
          # The warning never fails the step. Past the cap a full run drifts towards the 25min shard timeout, which would read as flake.
          if [ "$clamped" = "true" ]; then
            per_shard=$(( (selected + total - 1) / total ))
            echo "::warning::fe-mutation: $selected selected entries exceed the $total-shard cap; ~$per_shard entries per shard (cap keeps wall clock from being flat — consider raising maxShards in fe/tools/mutation/runner.ts)"
          fi
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
          echo "test_scope=$test_scope" >> "$GITHUB_OUTPUT"

  fe-mutation-shard:
    name: fe-mutation shard ${{ matrix.shard }}/${{ needs.fe-mutation-plan.outputs.total }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: fe-mutation-plan
    # `always()` is required: `changes` is skipped on schedule/dispatch, and GitHub's implicit success() would suppress the whole matrix.
    if: ${{ always() && needs.fe-mutation-plan.result == 'success' && needs.fe-mutation-plan.outputs.selected != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include: ${{ fromJSON(needs.fe-mutation-plan.outputs.matrix) }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: npm ci
        run: npm ci

      - name: cache playwright browsers
        if: matrix.browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('fe/package-lock.json') }}

      - name: Install Chromium with system dependencies
        if: matrix.browser
        run: npx playwright install --with-deps chromium

      - name: Run mutation evidence
        run: |
          set -euo pipefail
          args=(
            --test-scope "${{ needs.fe-mutation-plan.outputs.test_scope }}"
            --shard "${{ matrix.shard }}/${{ needs.fe-mutation-plan.outputs.total }}"
            --report "/tmp/mutation-report-${{ matrix.shard }}.json"
          )
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "push" ]; then
            if [ -n "${BASE_SHA:-}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              args+=(--base "$BASE_SHA")
            fi
          fi
          npm run test:mutation:run -- "${args[@]}"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.shard }}
          path: /tmp/mutation-report-${{ matrix.shard }}.json
          if-no-files-found: warn

  # The required check: branch protection pins this one stable context while the shard count floats with the manifest.
  fe-mutation:
    name: fe-mutation (tracked evidence)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [fe-mutation-plan, fe-mutation-shard]
    if: always()
    steps:
      - name: Require plan and every shard to have succeeded
        env:
          PLAN_RESULT: ${{ needs.fe-mutation-plan.result }}
          SHARD_RESULT: ${{ needs.fe-mutation-shard.result }}
          SELECTED: ${{ needs.fe-mutation-plan.outputs.selected }}
          TEST_SCOPE: ${{ needs.fe-mutation-plan.outputs.test_scope }}
        run: |
          echo "fe-mutation-plan: $PLAN_RESULT"
          echo "fe-mutation-shard: $SHARD_RESULT"
          echo "fe-mutation selected=$SELECTED scope=$TEST_SCOPE"
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "fe-mutation evidence plan failed"
            exit 1
          fi
          if [ "$SELECTED" = "0" ] && [ "$SHARD_RESULT" = "skipped" ]; then
            echo "fe-mutation: no affected evidence entries"
            exit 0
          fi
          if [ "$SELECTED" = "0" ] || [ "$SHARD_RESULT" != "success" ]; then
            echo "fe-mutation evidence gate failed"
            exit 1
          fi

  fe-e2e:
    name: fe e2e (playwright + docker stack)
    needs: changes
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'push') && (needs.changes.result != 'success' || needs.changes.outputs.fe_e2e_changed == 'true') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
    steps:
      - uses: actions/checkout@v4
      - name: install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fe/package-lock.json
      - name: npm ci
        working-directory: fe
        run: npm ci
      # `osc-probe-child` (a calm-server `[[bin]]`) is mounted in as `codex`; without it conversation creation fails in the daemon preflight before any mint.
      - name: cargo build --release (compose binaries)
        run: cargo build --release -p calm-server -p calm-codex-bridge -p neige-mcp-stdio-shim -p calm-proc-supervisor --bin calm-server --bin neige-codex-bridge --bin neige-mcp-stdio-shim --bin calm-proc-supervisor --bin osc-probe-child --locked
      - name: write CI .env overrides
        run: |
          cat > .env <<'EOF'
          CALM_CODEX_HOST_BIN=${{ github.workspace }}/target/release/osc-probe-child
          # The probe is a complete fake app-server for this suite and never
          # defers tools; `/bin/true` only supplies the companion mount that
          # production Codex packages provide beside the real binary.
          CALM_CODEX_CODE_MODE_HOST_BIN=/bin/true
          CALM_EXTRA_MOUNT=/tmp
          CALM_WEB_DIST=/tmp
          CALM_FE_DIST=/tmp
          CALM_PORT=4041
          CALM_DEV_AUTOLOGIN=true
          CALM_PUBLISH_ADDR=127.0.0.1
          HTTP_PROXY=
          HTTPS_PROXY=
          NO_PROXY=*
          http_proxy=
          https_proxy=
          no_proxy=*
          EOF
      - name: docker compose up
        run: make up
      - name: wait for stack
        run: |
          for i in {1..30}; do
            curl -sf http://127.0.0.1:4041/api/version > /dev/null && exit 0
            sleep 2
          done
          echo "::error::Stack failed to come up within 60s"
          docker compose ps
          docker compose logs
          exit 1
      - name: cache playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('fe/package-lock.json') }}
      - name: install playwright chromium
        working-directory: fe
        run: npx playwright install --with-deps chromium
      - name: npm run e2e
        working-directory: fe
        env:
          CI: "true"
          FE_API_PROXY_TARGET: http://127.0.0.1:4041
        run: npm run e2e
      - name: upload playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fe-playwright-report
          path: |
            fe/playwright-report/
            fe/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: dump docker logs on failure
        if: failure()
        run: docker compose logs --no-color || true
      - name: docker compose down
        if: always()
        run: make stop

  stack-e2e-tier-1:
    name: stack e2e (tier 1)
    needs: changes
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'push') && (needs.changes.result != 'success' || needs.changes.outputs.stack_changed == 'true') }}
    # ubuntu-22.04 keeps the host-built release binaries ABI-compatible with the bookworm-slim runtime image.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    # opt-level 1 nearly halves the release build; must stay identical across jobs sharing the `workspace` cache key.
    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
    steps:
      - uses: actions/checkout@v4

      - name: install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update

      - uses: rui314/setup-mold@v1

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: tailnet/go.mod
          cache-dependency-path: tailnet/go.sum

      - name: build private Tailnet helper
        run: tailnet/build.sh

      # Match Makefile's `build` cargo rule so `make dev` inside e2e/run.sh
      # finds every release binary it expects instead of compiling cold.
      - name: cargo build --release (make dev binaries)
        run: cargo build --manifest-path "$PWD/Cargo.toml" --release -p calm-server -p calm-codex-bridge -p neige-app -p neige-mcp-stdio-shim -p calm-proc-supervisor -p neige-cli --bin calm-server --bin neige-codex-bridge --bin neige-app --bin neige-mcp-stdio-shim --bin calm-proc-supervisor --bin neige

      - name: npm ci + build (next frontend bundle for nginx)
        working-directory: fe
        run: |
          npm ci
          npm run build

      # Stub the codex CLI mount so docker compose has an existing host path
      # for tier-1 cases that do not exercise live Codex work.
      - name: write CI .env overrides
        run: |
          cat > .env <<'EOF'
          CALM_CODEX_HOST_BIN=/bin/true
          CALM_CODEX_CODE_MODE_HOST_BIN=/bin/true
          CALM_EXTRA_MOUNT=/tmp
          CALM_DEV_AUTOLOGIN=true
          CALM_PUBLISH_ADDR=127.0.0.1
          HTTP_PROXY=
          HTTPS_PROXY=
          NO_PROXY=*
          http_proxy=
          https_proxy=
          no_proxy=*
          EOF

      - name: stack e2e tier 1
        run: ./e2e/run.sh --tier 1

      - name: mobile QR pairing closed loop
        run: |
          npm --prefix mobile ci
          (cd mobile && npx playwright install --with-deps chromium)
          npm --prefix mobile run test:pairing -- "$PWD/target/release/calm-server" "$PWD/fe/web/dist"

      - name: upload stack e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stack-e2e-tier-1-artifacts
          path: e2e-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  openapi-drift:
    name: openapi drift (cargo emit-openapi == checked-in spec)
    needs: changes
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'push') && (needs.changes.result != 'success' || needs.changes.outputs.openapi_changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update

      - uses: rui314/setup-mold@v1

      - uses: Swatinem/rust-cache@v2
        with:
          # Share the cache with the release jobs — same workspace and lockfile.
          shared-key: workspace

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fe/package-lock.json

      # Printed immediately before the cargo build so the run log shows the headroom the linker actually sees.
      - name: df -h (pre-gen:api headroom check)
        run: df -h /

      - name: regenerate OpenAPI spec + TS types
        working-directory: fe
        run: npm run gen:api

      - name: fail if committed fe spec or types are stale
        run: |
          git diff --exit-code -- fe/core/api/generated/
