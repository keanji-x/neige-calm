name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: short
  # #903 — dev profile debuginfo drops 1 → line-tables-only; test profile rises
  # back to line-tables-only from #913's [profile.test] debug=0, restoring
  # file:line in panic backtraces (RUST_BACKTRACE=short) while variable-level
  # DWARF stays cut — CI has no debugger consumers.
  # The TEST line mirrors the Cargo.toml [profile.test] rider (same value, kept
  # in sync); the DEV line is CI-only on top of the manifest's dev debug=1, and
  # the manifest's [profile.*.package."*"] debug=0 dep override outranks both.
  # Both DEV and TEST are set explicitly (test inherits dev; double-write
  # avoids inheritance ambiguity). Release profiles (debug=false) are
  # unaffected. Set globally, not per-job, so the shared rust-cache key (env
  # hash) doesn't split across jobs; the env change itself rotates all cache
  # keys once (one cold-compile round, then warm).
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_PROFILE_TEST_DEBUG: "line-tables-only"

jobs:
  # #903 — fmt + grep ratchets + clippy split off the critical path: none of
  # them consume the test build, so they run as a parallel job instead of
  # serializing ~2.5min in front of the test step.
  lint:
    name: lint (fmt + ratchets + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # #1289 — the toolchain version lives in rust-toolchain.toml (single
      # source of truth shared with local gates); rustup honors it as a
      # directory override, so no version is named here. The zero-argument
      # form needs rustup >= 1.28 (where it was introduced); hosted runner
      # images ship 1.29.x, and a pre-1.28 rustup fails closed on missing args.
      - name: install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update

      # #903 — mold via ld takeover; see the rust job's step for rationale.
      # clippy is check-mode and links nothing, so mold is idle here — kept
      # purely for tool consistency across cargo jobs; safe to drop.
      - uses: rui314/setup-mold@v1

      - uses: Swatinem/rust-cache@v2
        with:
          # Deliberately NOT the shared `workspace` key: clippy (check-mode)
          # produces mostly rmeta artifacts, disjoint from the test job's
          # dependency rlibs. rust-cache skips saving when the primary key
          # already exists — with a shared key, whichever job finishes first
          # saves and the rest are discarded, so a faster lint job would
          # persist an rmeta-only cache and the test job would cold-compile
          # its rlib deps for minutes on the next round. A separate key costs
          # one extra cache entry (within the GH 10GB quota) and keeps both
          # jobs warm.
          shared-key: lint

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: single migrations/ dir gate (#679 PR2)
        run: |
          count=$(find . -maxdepth 4 -type d -name migrations -not -path './external/*' -not -path './target/*' | wc -l)
          [ "$count" -eq 1 ] && echo "OK: 1 migrations/ directory" || { echo "::error::expected 1 migrations/ directory, found $count"; exit 1; }

      - name: harness raw status UPDATE gate (#679 PR3a)
        run: |
          set -euo pipefail
          paths=(
            crates/calm-server/src/harness
            # Deliberately unquoted: a no-match literal fails the path check below.
            crates/calm-server/src/operation/spec_harness_*.rs
          )
          for path in "${paths[@]}"; do
            [ -e "$path" ] || { echo "::error::required harness scan path does not exist: $path"; exit 1; }
          done
          set +e
          output="$(grep -rniE "update[[:space:]]+runtimes" "${paths[@]}" 2>&1)"
          rc=$?
          set -e
          case "$rc" in
            0)
              printf '%s\n' "$output"
              hits="$(printf '%s\n' "$output" | wc -l)"
              echo "::error::raw UPDATE runtimes survives in harness paths ($hits)"
              exit 1
              ;;
            1) echo "OK: no raw runtimes UPDATE in harness paths" ;;
            *)
              # No fixture pins this inline infrastructure-error branch; fail closed as defense in depth.
              printf '%s\n' "$output"
              echo "::error::raw UPDATE runtimes harness scan failed with exit $rc"
              exit 1
              ;;
          esac

      - name: install ripgrep for ratchets
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: runtimes ratchet selftest
        run: scripts/ci/ratchets/selftest.sh

      - name: PR9b-iv runtimes retirement ratchet (#758)
        run: scripts/ci/ratchets/runtimes_retirement.sh

      - name: dropped runtimes table reintroduction ratchet (#679 PR10)
        run: scripts/ci/ratchets/dropped_runtimes_table.sh

      # #1300 — the enumeration of report-write call sites, so a new one has to
      # be declared and a reviewer sees which author it passes. A drift
      # detector, not a semantic gate; the script states its four blind spots.
      - name: persist_report census selftest (#1300)
        run: scripts/ci/ratchets/persist_report_call_sites_selftest.sh

      - name: persist_report call-site census (#1300)
        run: scripts/ci/ratchets/persist_report_call_sites.sh

      - name: no parallel operation-event entrance (#679 PR4)
        run: |
          set -euo pipefail
          path=crates/
          [ -e "$path" ] || { echo "::error::required operation-event scan path does not exist: $path"; exit 1; }
          set +e
          output="$(grep -rnE "event_append_for_operation_tx|events_append_for_operation_tx" "$path" 2>&1)"
          rc=$?
          set -e
          case "$rc" in
            0)
              printf '%s\n' "$output"
              echo "::error::parallel operation-event entrance event_append_for_operation_tx/events_append_for_operation_tx survives"
              exit 1
              ;;
            1) echo "OK: no parallel operation-event entrance" ;;
            *)
              # No fixture pins this inline infrastructure-error branch; fail closed as defense in depth.
              printf '%s\n' "$output"
              echo "::error::operation-event entrance scan failed with exit $rc"
              exit 1
              ;;
          esac

      - name: token authority audit gate (#679 PR7b-i)
        run: |
          set -euo pipefail
          paths=(
            crates/calm-server/src/mcp_server/handshake.rs
            crates/calm-server/src/mcp_server/transport.rs
          )
          for path in "${paths[@]}"; do
            [ -e "$path" ] || { echo "::error::required token authority scan path does not exist: $path"; exit 1; }
          done
          grep -q "session_get_by_active_token_hash" crates/calm-server/src/mcp_server/handshake.rs \
            || { echo "::error::handshake must authenticate through active worker_sessions"; exit 1; }
          set +e
          output="$(grep -n "card_mcp_token_lookup_by_hash" crates/calm-server/src/mcp_server/handshake.rs 2>&1)"
          rc=$?
          set -e
          case "$rc" in
            0)
              printf '%s\n' "$output"
              echo "::error::handshake must not authenticate through card_mcp_token_lookup_by_hash/card_mcp_tokens"
              exit 1
              ;;
            1) ;;
            *)
              # No fixture pins this inline infrastructure-error branch; fail closed as defense in depth.
              printf '%s\n' "$output"
              echo "::error::card_mcp_token_lookup_by_hash handshake scan failed with exit $rc"
              exit 1
              ;;
          esac
          set +e
          output="$(grep -nE "\.card_get\(|\.card_role_get\(" crates/calm-server/src/mcp_server/transport.rs 2>&1)"
          rc=$?
          set -e
          case "$rc" in
            0)
              printf '%s\n' "$output"
              echo "::error::transport auth path must not resolve per-call identity through card_get/card_role_get"
              exit 1
              ;;
            1) ;;
            *)
              # No fixture pins this inline infrastructure-error branch; fail closed as defense in depth.
              printf '%s\n' "$output"
              echo "::error::card_get/card_role_get transport scan failed with exit $rc"
              exit 1
              ;;
          esac
          echo "OK: MCP token authority is session-bound and transport per-call auth is session-derived"

      # Soft backstop alongside the cargo-feature gate on
      # `AppState::raw_repo` (see `state.rs` and design doc §1.4.1).
      # The compile gate already blocks production builds from reaching
      # raw sync-domain writes; if a contributor turns on
      # `--features fixtures` for a production module they could
      # re-expose it. This grep catches that case at CI time. Tests
      # under `tests/*.rs` are the legitimate consumers and are not
      # scanned.
      - name: sanity — no raw_repo escape in production
        run: |
          set -euo pipefail
          paths=(
            crates/calm-server/src/routes/
            crates/calm-server/src/plugin_host/
            crates/calm-server/src/card_fsm.rs
            crates/calm-server/src/terminal_sweeper.rs
            crates/calm-server/src/replay.rs
          )
          for path in "${paths[@]}"; do
            [ -e "$path" ] || { echo "::error::required raw_repo scan path does not exist: $path"; exit 1; }
          done
          set +e
          output="$(grep -rn "raw_repo" "${paths[@]}" 2>&1)"
          rc=$?
          set -e
          case "$rc" in
            0)
              printf '%s\n' "$output"
              echo "::error::raw_repo() used in production module — must go through write_with_event"
              exit 1
              ;;
            1) echo "OK: no raw_repo escape in production" ;;
            *)
              # No fixture pins this inline infrastructure-error branch; fail closed as defense in depth.
              printf '%s\n' "$output"
              echo "::error::raw_repo production scan failed with exit $rc"
              exit 1
              ;;
          esac

      - name: pgid escape gate (#1013 T11)
        # The `pgid-escape-probe` feature compiles a module whose only job is to
        # read `pgid_lease::Pgid`'s private field from outside the module. The
        # build MUST fail with E0616. Asserting only "it failed" would be a fake
        # gate — any typo makes a build fail — so both the error code AND the
        # specific diagnostic (field `0` of struct `Pgid` is private, in
        # calm-proc-supervisor/src/lib.rs) are asserted.
        #
        # What this step proves, exactly — ONE thing: the `Pgid` tuple field is
        # not readable outside `pgid_lease`. It proves nothing else. The probe
        # only reads `p.0`, so an added `pub(super) fn raw2()` or an added
        # `#[derive(Debug)]` leaves `p.0` private and this step stays green.
        # The next step (a grep ratchet) catches *some* of those shapes; it is
        # defense-in-depth against accidental drift, NOT a proof — see its own
        # comment. The primary guarantee here is the type system, not either
        # gate: reviewers wrote and compiled seven distinct escape attempts, and
        # only `unsafe` transmutes, the acknowledged destructure/re-wrap seam
        # (pgid_lease regulation 5), and writing a fresh `libc::kill` succeeded.
        #
        # NOTE: this crate can never be built with `--all-features` (that turns
        # this feature on). That is by design; see crates/calm-proc-supervisor/Cargo.toml.
        # The other direction (default build green, probe absent) is covered by
        # the clippy step below, which builds this crate without the feature.
        run: |
          set -uo pipefail
          out="$(cargo check -p calm-proc-supervisor --features pgid-escape-probe 2>&1)" && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error::pgid-escape-probe compiled successfully — the Pgid tuple field is readable outside pgid_lease again"
            exit 1
          fi
          if ! printf '%s' "$out" | grep -qF 'error[E0616]: field `0` of struct `Pgid` is private'; then
            echo "::error::pgid-escape-probe failed, but not with E0616 on Pgid's field — the probe is broken, not the invariant. (One real-invariant case also lands here: if the number was flattened back into the enum variants, p.0 applies to a bare pid_t and rustc emits E0609. Check the variants before believing this message.)"
            exit 1
          fi
          if ! printf '%s' "$out" | grep -qF 'crates/calm-proc-supervisor/src/lib.rs'; then
            echo "::error::the E0616 did not point at crates/calm-proc-supervisor/src/lib.rs — it is not the probe's expression that failed"
            exit 1
          fi
          echo "OK: probe fails with E0616 on Pgid's private field, in calm-proc-supervisor/src/lib.rs"

      - name: pgid accessor ratchet (#1013 T11 companion)
        # DEFENSE IN DEPTH, NOT A PROOF. Read this before trusting it.
        #
        # The compile-fail probe above pins exactly one thing: `Pgid`'s tuple
        # field is not readable outside `pgid_lease`. It cannot see an added
        # accessor or derive (it only reads `p.0`). This grep catches the
        # accessor/derive SHAPES listed below, inside `mod pgid_lease`'s own
        # text. It is a text scan, so it can never be complete: a determined
        # author can still route the number out (e.g. through a type that is not
        # named `Pgid` here, or through code outside this module). The claim
        # "the accessor and derive cases are covered by the ratchet" was written
        # twice and defeated twice — do not restore it.
        #
        # The primary guarantee is the type system. Two review channels wrote
        # and compiled seven distinct escapes against this design; only `unsafe`
        # transmutes, the acknowledged destructure/re-wrap seam (regulation 5),
        # and writing a fresh `libc::kill` succeeded. This step exists to make
        # accidental drift loud, and each pattern below is there because a
        # reviewer defeated the previous version of this step with it:
        #   * a second method on `impl Pgid`, or a `pub`/`pub(super)` one;
        #   * ANY `pub(super) fn` in the module returning a `pid_t` — including
        #     a free function, or a method on `GroupSignalTarget`, neither of
        #     which lives in the `impl Pgid` block;
        #   * a trait impl with `Pgid` on EITHER side of `for`
        #     (`impl Display for Pgid` and `impl From<Pgid> for pid_t` both);
        #   * a `derive` anywhere in the module.
        # Whitespace is normalized to one line before the signature/trait scans
        # so a multiline `impl\n Display\nfor Pgid` cannot evade a line-by-line
        # regex (it did). `[^!{;]` keeps each match inside one impl header;
        # `[^!]`-style exclusion of `!` keeps negative impls out.
        #
        # Scoped to `mod pgid_lease`'s own text so it says nothing about the
        # rest of the crate. Whole-line `//` comments are stripped first: the
        # module's prose talks *about* `pub(super)` and accessors, and matching
        # that text would make this a self-tripping gate.
        run: |
          set -euo pipefail
          src=crates/calm-proc-supervisor/src/lib.rs
          region="$(awk '/^mod pgid_lease \{$/,/^\}$/' "$src" | grep -v '^[[:space:]]*//' || true)"
          if [ -z "$region" ]; then
            echo "::error::could not locate 'mod pgid_lease { .. }' in $src — this ratchet is scanning nothing"
            exit 1
          fi
          # Whitespace-normalized single line: multiline signatures and multiline
          # `impl` headers must not be able to hide from the scans below.
          flat="$(printf '%s\n' "$region" | tr '\n' ' ' | tr -s '[:space:]' ' ')"
          impl_block="$(printf '%s\n' "$region" | awk '/^    impl Pgid \{$/,/^    \}$/')"
          if [ -z "$impl_block" ]; then
            echo "::error::could not locate 'impl Pgid { .. }' — the ratchet is scanning nothing"
            exit 1
          fi
          # Exactly one method on Pgid, and it is the module-private `raw`.
          n_fns="$(printf '%s\n' "$impl_block" | grep -c 'fn ' || true)"
          if [ "$n_fns" != "1" ]; then
            echo "::error::impl Pgid has $n_fns methods, expected exactly 1 (fn raw). A second method is an accessor escape the E0616 probe cannot see."
            printf '%s\n' "$impl_block"
            exit 1
          fi
          if ! printf '%s\n' "$impl_block" | grep -qF 'fn raw(&self) -> libc::pid_t {'; then
            echo "::error::impl Pgid's single method is not the expected module-private 'fn raw(&self) -> libc::pid_t'"
            printf '%s\n' "$impl_block"
            exit 1
          fi
          if printf '%s\n' "$impl_block" | grep -qE '\bpub(\(|\s)'; then
            echo "::error::impl Pgid contains a pub/pub(super) method — the number is readable outside pgid_lease"
            printf '%s\n' "$impl_block"
            exit 1
          fi
          # The `impl Pgid` block is not the only place an accessor can live: a
          # free `pub(super) fn raw2(p: &Pgid) -> pid_t` in the module, or a
          # `pub(super) fn raw_pgid(&self) -> pid_t` on `impl GroupSignalTarget`,
          # both hand the number to the parent module while leaving `p.0`
          # private and the `impl Pgid` block untouched. Both defeated the
          # previous version of this step with CI green.
          if printf '%s\n' "$flat" | grep -oE 'pub\(super\)[[:space:]]+fn[^;{]*->[^;{]*pid_t'; then
            echo "::error::a pub(super) fn in mod pgid_lease returns a pid_t — the number is readable outside the module (the E0616 probe only sees p.0)"
            exit 1
          fi
          # No trait impls involving Pgid and no derives anywhere in the module:
          # a Display/Debug that prints a decimal pgid is an accessor in text,
          # and `impl From<Pgid> for libc::pid_t` is one with the conversion
          # spelled out. Both sides of `for` are checked — the old `for Pgid`
          # pattern missed the `From<Pgid>` direction, where Pgid is the source.
          if printf '%s\n' "$flat" | grep -oE 'impl[^!{;]*[[:space:]]for[[:space:]]+Pgid[^[:alnum:]_]'; then
            echo "::error::a trait is implemented for Pgid — Debug/Display/Deref all leak the number"
            exit 1
          fi
          if printf '%s\n' "$flat" | grep -oE 'impl[^!{;]*Pgid[^!{;]*[[:space:]]for[[:space:]]'; then
            echo "::error::a trait is implemented with Pgid on the impl-type side (e.g. From<Pgid> for pid_t) — that is an accessor"
            exit 1
          fi
          if printf '%s\n' "$region" | grep -q 'derive'; then
            echo "::error::a derive appeared inside mod pgid_lease — Pgid must have no derives (see the struct's doc comment)"
            printf '%s\n' "$region" | grep -n 'derive'
            exit 1
          fi
          echo "OK: none of the accessor/derive shapes this ratchet knows about are present (this is drift detection, not a completeness proof)"

      - name: web compat version lockstep gate (#1209 PR-2)
        run: ./scripts/gate-web-compat-version-lockstep.sh

      - name: template rename residual gate (#1209 PR-2, acceptance B10)
        run: ./scripts/gate-1209-template-rename-residual.sh

      - name: terminology ratchet (#1316 S0)
        run: ./scripts/gate-1316-terminology-ratchet.sh

      - name: terminology ratchet discriminates (#1316 S0)
        run: ./scripts/gate-1316-terminology-ratchet.sh --selftest

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets --features calm-server/codex-e2e -- -D warnings

  rust:
    name: rust (test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # #903 — dropped the #634-era `free disk space` (jlumbroso) step: ubuntu-latest
      # then shipped ~14G free (link-stage SIGBUS/ENOSPC); as of 2026-07 runners boot
      # with ~89G free (145G disk, run 29140215747), and post-#913 (test bins 153→35)
      # + #918 (debuginfo) target/ peaks ~5G, rust-cache ~321MB — the 2m47s was waste.

      # #1289 — the toolchain version lives in rust-toolchain.toml (single
      # source of truth shared with local gates); rustup honors it as a
      # directory override, so no version is named here. The zero-argument
      # form needs rustup >= 1.28 (where it was introduced); hosted runner
      # images ship 1.29.x, and a pre-1.28 rustup fails closed on missing args.
      - name: install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update

      # #903 — link with mold. Default takeover mode: the action installs mold
      # and symlinks /usr/local/bin/ld to it, so cc/rustc pick it up via PATH.
      # Deliberately NOT via `RUSTFLAGS=-C link-arg=-fuse-ld=mold`: RUSTFLAGS
      # feeds both cargo's fingerprint and rust-cache's env-hashed key, so a
      # per-job RUSTFLAGS delta would split the shared `workspace` cache key
      # across jobs and invalidate every cached artifact. The ld symlink is
      # transparent to cargo fingerprints — cached dependency rlibs still hit;
      # only the final link swaps tools. Added to every cargo-running job for
      # tool consistency.
      - uses: rui314/setup-mold@v1

      - uses: Swatinem/rust-cache@v2
        with:
          # Shared key so the openapi-drift job (which also builds the
          # workspace via `cargo run --bin emit-openapi`) reuses this cache.
          shared-key: workspace

      # #903 — cargo-nextest (prebuilt binary, ~5s). Profiles in
      # .config/nextest.toml; CI uses --profile ci below.
      - uses: taiki-e/install-action@nextest

      - name: cargo nextest run --workspace --locked
        # #903 — nextest replaces `cargo test`: cross-binary test parallelism
        # (the old runner executed the ~74 test binaries — post-#913 suite
        # consolidation — serially). The build
        # phase is equivalent to `cargo test --no-run`, so everything below
        # still holds:
        # - Feature enabled for compile-check coverage; codex-e2e tests
        #   self-skip at runtime when no codex binary is discoverable (#868
        #   resolver: unset NEIGE_CODEX_BIN → eprintln + early return, counted
        #   as pass) — the default in GHA runners; unchanged under nextest.
        # - No separate `cargo build --workspace` step: the test build covers
        #   all bins (CARGO_BIN_EXE_*) plus the replay bin
        #   (required-features=fixtures, via calm-server's dev-dep self-loop —
        #   which also means fixtures is always ON here). Compile coverage of
        #   the not(fixtures) production cfg branches is carried by the
        #   chromium-e2e / stack-e2e release jobs (no fixtures, global
        #   RUSTFLAGS=-D warnings) on every PR.
        # - nextest does not run doctests, which loses nothing here: this repo
        #   has 0 doctests — every doc fence carries a non-rust language tag
        #   (json/text/sh/jsonc), see #903 design doc §0.1. If rust doctests
        #   are ever introduced, add a `cargo test --doc` step alongside.
        run: cargo nextest run --workspace --locked --features calm-server/codex-e2e --profile ci

      # #679 PR0-D — migration-replay gate, made explicit so a failure is
      # attributable at a glance. Re-runs the snapshot replay harness: every
      # per-version stage→seed→replay stop must converge on the fresh-DB
      # schema. This step MUST be invoked at workspace level, exactly like the
      # main nextest step above, so it stays fully Fresh (no recompile) —
      # nextest's build phase is the same `cargo test --no-run` fingerprint,
      # so the artifacts are shared verbatim. Two ingredients, both
      # load-bearing:
      #   1. Features aligned with the main test step: codex-e2e is an empty
      #      feature (calm-provider's side is `[]`; it only gates `#![cfg]` in
      #      tests/*.rs), so passing it here is purely build-fingerprint
      #      alignment — without it, the feature flip re-compiled the
      #      calm-provider→calm-server chain (~63s) on every run.
      #   2. `--workspace` (NOT `-p calm-server`): any -p narrowing shrinks
      #      cargo's feature-unification domain from the workspace to a single
      #      package, so features that other workspace members enable on shared
      #      deps (sqlx, rustls, …) disappear, flipping dependency fingerprints
      #      and re-compiling ~53s of rustls→sqlx→calm-truth→calm-server. Do
      #      not "simplify" this back to -p. The `-E` filterset (binary
      #      migration_suite ∩ the migration_replay_harness:: module) selects
      #      only the replay harness.
      # Deliberately NOT --profile ci: the ci profile writes its junit report
      # to a fixed path (target/nextest/ci/junit.xml), so this small re-run
      # would overwrite the full-suite timing report uploaded below. The
      # default profile emits no junit; its default-filter only excludes
      # export_bindings_* tests, which don't live in this binary.
      # The external-snapshot half self-skips while NEIGE_SNAPSHOT_DB is unset
      # in CI; point it at a sanitized prod snapshot to extend the gate to
      # real data.
      - name: migration replay gate (#679 PR0-D)
        run: |
          cargo nextest run --workspace --locked --features calm-server/codex-e2e -E 'binary(migration_suite) & test(/^migration_replay_harness::/)'

      # #903 — per-test timing (junit.xml, written by the ci nextest profile),
      # the input for the Slice C timing analysis.
      - name: upload nextest junit timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit
          path: target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: ignore

  frozen-vectors:
    name: frozen security vectors freeze gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the commit-range walk below can diff against the
          # PR base / push predecessor.
          fetch-depth: 0

      # Issue #679 PR0-A — the gate-denial vector corpus under
      # crates/calm-server/tests/vectors/ is FROZEN characterization data:
      # it pins the role-gate decision matrix so a future gate rewrite
      # (#679 PR7) must pass the same files unmodified instead of rewriting
      # its own tests. Any commit that touches the dir must carry a
      # `FROZEN-VECTOR-CHANGE:` rationale in its message — same spirit as
      # the raw_repo grep gate above, but keyed on commit messages so the
      # change is a conscious, auditable decision.
      - name: vectors dir changes require FROZEN-VECTOR-CHANGE rationale
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          VEC_DIR='crates/calm-server/tests/vectors/'
          # Resolve a usable base: PR base sha or push `before`; fall back to
          # the first parent when unavailable (branch creation pushes report
          # `before` as 40 zeros).
          if [ -z "${BASE_SHA:-}" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA=$(git rev-parse HEAD~1)
          fi
          if git diff --quiet "$BASE_SHA"...HEAD -- "$VEC_DIR"; then
            echo "OK: frozen vectors untouched"
            exit 0
          fi
          # Vectors changed — every commit in range whose diff touches the
          # dir must carry the rationale marker in its full message.
          bad=0
          for sha in $(git log --format=%H "$BASE_SHA"..HEAD -- "$VEC_DIR"); do
            if ! git log -1 --format=%B "$sha" | grep -q 'FROZEN-VECTOR-CHANGE:'; then
              echo "::error::commit $sha touches $VEC_DIR without a 'FROZEN-VECTOR-CHANGE:' rationale in its message"
              git log -1 --format='  %h %s' "$sha"
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            exit 1
          fi
          echo "OK: all vector-touching commits carry FROZEN-VECTOR-CHANGE:"

  # #903 — the `web (build + test + a11y)` job split into a parallel pair
  # (this `web-unit` + `a11y` below) to kill the serial bottleneck: vitest
  # (~64s) + the replay build (~47s) + a11y (~149s) used to run back-to-back
  # in one job. This half is pure JS — the tsc/vite build + vitest — and
  # carries NO rust dependency, so it skips the rust-toolchain / mold /
  # rust-cache setup that only the `a11y` half needs.
  web-unit:
    name: web-unit (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # TODO(#2): drop --legacy-peer-deps once the TypeScript downgrade lands
      # on main. The current pin (`typescript: ~6.0.2`) is ahead of what
      # several @types/* packages accept, so a strict `npm ci` rejects the
      # tree on peer-dependency grounds. --legacy-peer-deps matches the
      # behavior developers use locally today.
      - name: npm ci
        run: npm ci --legacy-peer-deps

      # `npm run build` = tsc -b (type-check gate) + vite build (production
      # bundle gate). Pure JS; no rust artifacts involved.
      - name: npm run build
        run: npm run build

      - name: npm run test
        run: npm run test

  fe-unit:
    name: fe-unit (lint + build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.after || github.sha }}
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the readonly gate can diff against the PR base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Validate Node against package engines
        run: node -e "const semver=require('semver');const range=require('./package.json').engines.node;if(!semver.satisfies(process.version,range))process.exit(1)"

      - name: npm run lint
        env:
          OWNERSHIP_BASE_SHA: ${{ env.BASE_SHA }}
          OWNERSHIP_HEAD_SHA: ${{ env.HEAD_SHA }}
          OWNERSHIP_EVENT_NAME: ${{ github.event_name }}
          OWNERSHIP_PUSH_FORCED: ${{ github.event.forced || false }}
        run: npm run lint

      - name: npm run build
        run: npm run build

      - name: npm run test
        run: npm run test

  fe-browser:
    name: fe-browser (vitest + chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Install Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      # Two Vitest projects, one job: `browser` and `browser-coarse`. The second
      # exists because `pointer: coarse` can only be set on a Playwright
      # *context*, and CDP touch emulation is a one-way door that poisons the
      # shared page for every file after it. Both are in the `test:browser`
      # script, so this step covers them; splitting them into two jobs would
      # buy a second `npx playwright install` and nothing else.
      - name: npm run test:browser
        run: npm run test:browser

  # #1119 — the shard count follows the selected-entry count instead of being
  # frozen at 6. This job runs the SAME selection code path as the shards
  # (`run.mjs --plan`), so the plan can never drift from what the shards run.
  fe-mutation-plan:
    name: fe-mutation-plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    defaults:
      run:
        working-directory: fe
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      total: ${{ steps.plan.outputs.total }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: npm ci
        run: npm ci

      # Chromium is deliberately NOT installed here: --plan runs no vitest.
      # `test:mutation:plan` also deliberately does NOT chain
      # `test:mutation:fixtures` — the fixture e2e stays on the shard jobs.
      - name: Plan mutation shards
        id: plan
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            plan=$(npm run --silent test:mutation:plan -- --base "$BASE_SHA")
          else
            plan=$(npm run --silent test:mutation:plan)
          fi
          echo "plan=$plan"
          # jq parses the WHOLE captured stdout, so any extra line (prefix OR suffix) is a parse
          # error rather than a silently wrong plan. Each value is its own assignment so `set -e`
          # actually fires on a jq failure — inside `echo "x=$(...)"` the status was discarded and
          # the run only died much later at fromJSON('') in the shard matrix, off the required check.
          shards=$(printf '%s' "$plan" | jq -c '.shards')
          total=$(printf '%s' "$plan" | jq -r '.total')
          selected=$(printf '%s' "$plan" | jq -r '.selected')
          clamped=$(printf '%s' "$plan" | jq -r '.clamped')
          # `selected` is validated alongside `total`: it is arithmetic input below, and under
          # `set -eu` a non-numeric value aborts the step anyway — a malformed plan SHOULD fail here.
          case "$total" in ''|*[!0-9]*) total='' ;; esac
          case "$selected" in ''|*[!0-9]*) selected='' ;; esac
          if [ -z "$shards" ] || [ -z "$total" ] || [ -z "$selected" ] || [ "$total" = "0" ] || [ "${shards#\[}" = "$shards" ]; then
            echo "mutation plan did not produce a usable shard matrix; raw plan: $plan" >&2
            exit 1
          fi
          # The shard list must be EXACTLY 1..total. `[` plus a digit-total is not enough:
          # {"total":99999,"shards":[1]} passed both, and the single shard job then ran
          # `--shard 1/99999` — about one of 65 entries — and the aggregate gate went green.
          # plan-purity.mjs asserts the same identity but runs in the SHARD job, too late to stop this.
          if ! printf '%s' "$plan" | jq -e '(.shards | length) == .total and .shards == [range(1; .total + 1)]' >/dev/null; then
            echo "mutation plan shard list is not exactly 1..total; raw plan: $plan" >&2
            exit 1
          fi
          # The warning below never fails the step; a malformed plan always does, above.
          # Past the cap the shards stop being ~4 entries each and a full run drifts towards the
          # 25min shard timeout (fe-mutation-shard timeout-minutes), which would read as flake.
          if [ "$clamped" = "true" ]; then
            per_shard=$(( (selected + total - 1) / total ))
            echo "::warning::fe-mutation: $selected selected entries exceed the $total-shard cap; ~$per_shard entries per shard (cap keeps wall clock from being flat — consider raising maxShards in fe/tools/mutation/runner.ts)"
          fi
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"

  fe-mutation-shard:
    name: fe-mutation shard ${{ matrix.shard }}/${{ needs.fe-mutation-plan.outputs.total }}
    runs-on: ubuntu-latest
    # 15 → 25 (kept from main's #1091 measurement; the headroom stays even
    # though #1119 makes hitting it far less likely).
    # This job is inherently expensive: tools/mutation/run.mjs re-runs the
    # ENTIRE vitest suite once per mutation entry (it shells out to a bare
    # `npx vitest run`; the manifest's `selection_paths` is metadata and does
    # not narrow the run), so a shard's cost tracks total suite size, not the
    # size of the PR under test.
    # Measured on the old fixed 6-way matrix, shard 3/6: origin/main runs took
    # 12m58s, 13m06s, 14m17s and 14m50s, and one run hit 15m16s and was
    # CANCELLED by the old 15m ceiling — the worst shard carried 11 entries.
    # #1119 caps a shard at ~4 entries (fe/tools/mutation/runner.ts
    # entriesPerShard) until the manifest passes 128 selected entries, after
    # which the plan job emits a ::warning:: naming the real entries-per-shard.
    # 25m is the backstop for that clamped regime.
    timeout-minutes: 25
    needs: fe-mutation-plan
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.fe-mutation-plan.outputs.shards) }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Install Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run mutation evidence selected by PR target intersection
        if: github.event_name == 'pull_request'
        run: npm run test:mutation -- --base "$BASE_SHA" --shard ${{ matrix.shard }}/${{ needs.fe-mutation-plan.outputs.total }} --report /tmp/mutation-report-${{ matrix.shard }}.json

      - name: Run all mutation evidence on main
        if: github.event_name == 'push'
        run: npm run test:mutation -- --shard ${{ matrix.shard }}/${{ needs.fe-mutation-plan.outputs.total }} --report /tmp/mutation-report-${{ matrix.shard }}.json

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.shard }}
          path: /tmp/mutation-report-${{ matrix.shard }}.json
          if-no-files-found: warn

  # #1119 — THE required check. It exists so branch protection can pin ONE
  # stable context name while the shard count floats with the manifest.
  # Fail-closed: anything that is not exactly `success` (including skipped
  # and cancelled) fails this job.
  fe-mutation:
    name: fe-mutation (tracked evidence)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [fe-mutation-plan, fe-mutation-shard]
    if: always()
    steps:
      - name: Require plan and every shard to have succeeded
        env:
          PLAN_RESULT: ${{ needs.fe-mutation-plan.result }}
          SHARD_RESULT: ${{ needs.fe-mutation-shard.result }}
        run: |
          echo "fe-mutation-plan: $PLAN_RESULT"
          echo "fe-mutation-shard: $SHARD_RESULT"
          if [ "$PLAN_RESULT" != "success" ] || [ "$SHARD_RESULT" != "success" ]; then
            echo "fe-mutation evidence gate failed"
            exit 1
          fi

  # #1297 — the `a11y (replay + playwright)` and `chromium e2e` jobs were
  # removed here. Both drove the unmaintained `web/` app, and both broke on
  # a change that is correct: their shared fixture
  # (`web/e2e/helpers/reset.ts` `seedWaveViewMode`) seeds view state by
  # POSTing a `plugin_id: kernel` overlay through `/api/overlays`, which is
  # exactly the forge #1297 closes. `web/` is no longer maintained and is not
  # a compatibility target, so the gates were dropped rather than the fix
  # weakened. `web-unit` and `stack e2e (tier 1)` still cover what remains of
  # `web/`; the maintained frontend is gated by `fe-*`.

  fe-e2e:
    name: fe e2e (playwright + docker stack)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
    steps:
      - uses: actions/checkout@v4
      # #1289 — version comes from rust-toolchain.toml; none is named here.
      - name: install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fe/package-lock.json
      - name: npm ci
        working-directory: fe
        run: npm ci
      # `osc-probe-child` joins the compose binaries here (#1189 S6): mounted
      # in as `codex`, it is the app-server stand-in the Rust suites already
      # trust (tests/fixtures/osc-probe-child/appserver.rs). It is a `[[bin]]`
      # of calm-server, so it builds from the same invocation and shares the
      # cache. Without it `POST /api/waves/{id}/conversations` fails in the
      # daemon preflight, *before* the card/session/token mint — and an e2e
      # that only ever sees that 500 cannot tell a correct mint from a broken
      # one.
      - name: cargo build --release (compose binaries)
        run: cargo build --release -p calm-server -p calm-codex-bridge -p neige-mcp-stdio-shim -p calm-proc-supervisor --bin calm-server --bin neige-codex-bridge --bin neige-mcp-stdio-shim --bin calm-proc-supervisor --bin osc-probe-child --locked
      - name: write CI .env overrides
        run: |
          cat > .env <<'EOF'
          CALM_CODEX_HOST_BIN=${{ github.workspace }}/target/release/osc-probe-child
          CALM_EXTRA_MOUNT=/tmp
          CALM_WEB_DIST=/tmp
          CALM_PORT=4041
          CALM_DEV_AUTOLOGIN=true
          HTTP_PROXY=
          HTTPS_PROXY=
          NO_PROXY=*
          http_proxy=
          https_proxy=
          no_proxy=*
          EOF
      - name: docker compose up
        run: make up
      - name: wait for stack
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:4041/api/version > /dev/null && exit 0
            sleep 2
          done
          echo "::error::Stack failed to come up within 60s"
          docker compose ps
          docker compose logs
          exit 1
      - name: cache playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('fe/package-lock.json') }}
      - name: install playwright chromium
        working-directory: fe
        run: npx playwright install --with-deps chromium
      - name: npm run e2e
        working-directory: fe
        env:
          CI: "true"
          FE_API_PROXY_TARGET: http://127.0.0.1:4041
        run: npm run e2e
      - name: upload playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fe-playwright-report
          path: |
            fe/playwright-report/
            fe/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: dump docker logs on failure
        if: failure()
        run: docker compose logs --no-color || true
      - name: docker compose down
        if: always()
        run: make stop

  stack-e2e-tier-1:
    name: stack e2e (tier 1)
    # Match the chromium stack job's runner pin so the host-built release
    # binaries remain ABI-compatible with the bookworm-slim runtime image.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    # #903 — e2e verifies behavior, not performance: opt-level 1 nearly halves
    # the dominant release build. Must stay identical to chromium-e2e's value
    # or the shared rust-cache key's dep fingerprints split; see the rationale
    # and revert note on that job.
    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
    steps:
      - uses: actions/checkout@v4

      # #1289 — version comes from rust-toolchain.toml; none is named here.
      - name: install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update

      # #903 — mold via ld takeover; see the rust job's step for rationale.
      # Same ubuntu-22.04 / release-link notes as the chromium e2e job.
      - uses: rui314/setup-mold@v1

      # Same cache key as the chromium e2e job: debug/release targets differ,
      # but the shared registry + git index still avoid a cold dependency run.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # See note above on --legacy-peer-deps in the `web-unit` job.
      - name: npm ci
        working-directory: web
        run: npm ci --legacy-peer-deps

      # Match Makefile's `build` cargo rule so `make dev` inside e2e/run.sh
      # finds every release binary it expects instead of compiling cold.
      - name: cargo build --release (make dev binaries)
        run: cargo build --manifest-path "$PWD/Cargo.toml" --release -p calm-server -p calm-codex-bridge -p neige-app -p neige-mcp-stdio-shim -p calm-proc-supervisor -p neige-cli --bin calm-server --bin neige-codex-bridge --bin neige-app --bin neige-mcp-stdio-shim --bin calm-proc-supervisor --bin neige

      - name: npm run build (web bundle for nginx)
        working-directory: web
        run: npm run build

      # Stub the codex CLI mount so docker compose has an existing host path
      # for tier-1 cases that do not exercise live Codex work.
      - name: write CI .env overrides
        run: |
          cat > .env <<'EOF'
          CALM_CODEX_HOST_BIN=/bin/true
          CALM_EXTRA_MOUNT=/tmp
          CALM_DEV_AUTOLOGIN=true
          HTTP_PROXY=
          HTTPS_PROXY=
          NO_PROXY=*
          http_proxy=
          https_proxy=
          no_proxy=*
          EOF

      - name: stack e2e tier 1
        run: ./e2e/run.sh --tier 1

      - name: upload stack e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stack-e2e-tier-1-artifacts
          path: e2e-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  openapi-drift:
    name: openapi drift (cargo emit-openapi == checked-in spec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # #903 — dropped the #634-era `free disk space` (jlumbroso) step: ubuntu-latest
      # then shipped ~14G free (link-stage SIGBUS/ENOSPC); as of 2026-07 runners boot
      # with ~89G free (145G disk, run 29140215747), and post-#913 (test bins 153→35)
      # + #918 (debuginfo) target/ peaks ~5G, rust-cache ~321MB — the 2m47s was waste.
      # The `df -h` step below stays as a zero-cost headroom sentinel.

      # #1289 — version comes from rust-toolchain.toml; none is named here.
      - name: install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update

      # #903 — mold via ld takeover; see the rust job's step for rationale.
      - uses: rui314/setup-mold@v1

      - uses: Swatinem/rust-cache@v2
        with:
          # Share the cache with the `rust` job — same workspace, same lockfile.
          shared-key: workspace

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # See note above on --legacy-peer-deps.
      - name: npm ci
        working-directory: web
        run: npm ci --legacy-peer-deps

      # Acceptance criterion for #634: ≥5GB free at the link stage.
      # Printed immediately before the cargo build so the run log shows the
      # headroom the linker actually sees.
      - name: df -h (pre-gen:api headroom check)
        run: df -h /

      - name: regenerate OpenAPI spec + TS types
        working-directory: web
        run: npm run gen:api

      - name: regenerate fe OpenAPI spec
        run: cargo run --quiet --manifest-path Cargo.toml --bin emit-openapi > fe/core/api/generated/openapi.json

      - name: fail if committed web / fe spec or types are stale
        run: |
          git diff --exit-code -- web/src/api/openapi.json web/src/api/generated.ts web/src/api/generated-terminal.ts web/src/api/generated-events.ts web/src/editor/types/ fe/core/api/generated/wire.ts fe/core/api/generated/openapi.json
