name: Android client

on:
  pull_request:
    paths: ['mobile/**', 'fe/**', '.github/workflows/mobile.yml', 'rust-toolchain.toml']
  push:
    branches: [main]
    paths: ['mobile/**', 'fe/**', '.github/workflows/mobile.yml', 'rust-toolchain.toml']

permissions:
  contents: read

env:
  NPM_CONFIG_AUDIT: 'false'

concurrency:
  group: android-client-${{ github.ref }}
  # The policy mutation run must restore production source before ending.
  cancel-in-progress: false

# Emulator-backed checks live in mobile-native.yml and only run for mobile/**
# pull requests; this job is the one that still runs for every fe/** change
# because the APK bundles the fe build.
jobs:
  android:
    name: mobile (test + Android APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      CARGO_BUILD_JOBS: '4'
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            fe/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: mobile/p2p-native/go.mod
          cache-dependency-path: mobile/p2p-native/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked frontend tools
        run: |
          npm ci
          npm --prefix ../fe ci
      - name: Check generated default profile
        run: |
          npm run configure
          git diff --exit-code -- www/server-config.js src-tauri/gen/android/app/src/main/res/xml/network_security_config.xml
      - name: Test profile generation and connection page
        run: |
          npm test
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Prepare pinned Rust and Android tools
        run: |
          rustup show active-toolchain
          rustup target add aarch64-linux-android
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;29.0.14206865'
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Build and verify ARM64 APK
        run: |
          env -u NEIGE_CODEX_BIN npm run android:apk
          apk=src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
          npm run verify:apk -- "$apk"
          git diff --exit-code
      - name: Verify native origin policy and its authority fence
        run: node tests/native/policy-mutation.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: neige-calm-next-arm64-debug
          path: |
            mobile/src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
            mobile/artifacts/connection-dual-*.png
            mobile/artifacts/native-policy/
          if-no-files-found: error
          retention-days: 7
