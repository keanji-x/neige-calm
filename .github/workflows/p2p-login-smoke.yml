name: P2P login smoke
on:
  push:
    branches: [codex/mobile-p2p-prototype]
permissions:
  contents: read
jobs:
  login:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [before, after]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original implementation for regression witness
        if: matrix.variant == 'before'
        run: |
          for file in mobile/p2p-native/main.go mobile/p2p-native/bridge_android.c mobile/src-tauri/gen/android/app/src/main/java/io/neigecalm/next/NativeP2P.kt mobile/src-tauri/gen/android/app/src/main/java/io/neigecalm/next/ConnectionTrialActivity.kt; do
            git show 09a953a6c:$file > "$file"
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: mobile/p2p-native/go.mod
          cache-dependency-path: mobile/p2p-native/go.sum
      - name: Build actual userspace JNI library for emulator
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'ndk;29.0.14206865'
          cd mobile/p2p-native
          export GOOS=android GOARCH=amd64 CGO_ENABLED=1
          export CC="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang"
          mkdir -p ../src-tauri/gen/android/app/src/main/jniLibs/x86_64
          go build -p 4 -buildmode=c-shared -ldflags='-s -w' -o ../src-tauri/gen/android/app/src/main/jniLibs/x86_64/libneige_p2p.so .
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        id: actual-login
        continue-on-error: ${{ matrix.variant == 'before' }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: mobile/src-tauri/gen/android/gradlew -p mobile/p2p-smoke connectedDebugAndroidTest --no-daemon --max-workers=4
      - name: Require original failure and corrected browser launch
        if: always()
        run: |
          python3 - "${{ matrix.variant }}" <<'PY'
          import pathlib,sys,xml.etree.ElementTree as E
          files=list(pathlib.Path('mobile/p2p-smoke/build/outputs/androidTest-results').rglob('TEST-*.xml'))
          cases=[t for p in files for t in E.parse(p).getroot().iter('testcase') if t.attrib['name']=='actualLoginButtonOpensBrowserUsingRealNativeEnrollment']
          assert len(cases)==1, 'The real native test must execute'
          failure=cases[0].find('failure')
          if sys.argv[1]=='before':
              assert failure is not None and 'Browser did not open' in (failure.text or ''), 'Expected the original login failure'
          else:
              assert failure is None and cases[0].find('error') is None and cases[0].find('skipped') is None, 'Actual browser launch must pass'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2p-login-result-${{ matrix.variant }}
          path: mobile/p2p-smoke/build/outputs/androidTest-results/
          retention-days: 3
