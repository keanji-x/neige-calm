name: P2P login smoke
on:
  push:
    branches: [codex/mobile-p2p-prototype]
permissions:
  contents: read
jobs:
  launcher:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '4'
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: mobile/p2p-native/go.mod
          cache-dependency-path: mobile/p2p-native/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/src-tauri -> target
          shared-key: p2p-launcher
      - name: Build actual APK with userspace networking
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'ndk;29.0.14206865'
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          export NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          cd mobile/p2p-native
          export GOOS=android GOARCH=amd64 CGO_ENABLED=1
          export CC="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang"
          mkdir -p ../src-tauri/gen/android/app/src/main/jniLibs/x86_64
          go build -p 4 -buildmode=c-shared -ldflags='-s -w' -o ../src-tauri/gen/android/app/src/main/jniLibs/x86_64/libneige_p2p.so .
          unset GOOS GOARCH CGO_ENABLED CC
          cd ../..
          rustup target add x86_64-linux-android
          npm --prefix mobile ci
          npm --prefix fe ci
          env -u NEIGE_CODEX_BIN npm --prefix mobile run tauri -- android build --debug --apk --target x86_64
      - name: Start loopback-only HTTP test peers
        run: |
          python3 mobile/tests/native/ip-fixture.py > "$RUNNER_TEMP/ip-fixture.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/ip-fixture.pid"
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5413/api/version > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: mobile/tests/native/run-launcher-smoke.sh
      - name: Stop test peers
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ip-fixture.pid" ]; then kill "$(cat "$RUNNER_TEMP/ip-fixture.pid")" || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2p-launcher-result
          path: |
            mobile/src-tauri/gen/android/app/build/outputs/androidTest-results/
            mobile/artifacts/resume-*.txt
          retention-days: 3
