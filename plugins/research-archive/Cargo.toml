[package]
name = "research-archive"
version = "0.1.0"
edition = "2024"

# Point-in-time archive of Longbridge fundamentals (#2575). Its own package,
# never a side binary of calm-server. S1-1 is the persistence boundary: the
# compiled endpoint catalog and the append-only `archive.sqlite3` Store.
# S1-2a adds the typed config, the environment guard, the data-dir lock, the
# token storage with the `auth` CLI, and the Longbridge source. S1-2b adds
# the capture runner, the trading calendar, the alert command and the
# systemd unit templates. S1b adds the read-only status plugin.

[[bin]]
name = "research-archive"
path = "src/main.rs"

# The read-only Neige plugin (S1b): `manifest.json`'s entrypoint.
[[bin]]
name = "research-archive-plugin"
path = "src/plugin_main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
# New York local time for the capture window (DST included).
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
hex = "0.4"
libc = "0.2"
# The official SDK at a pinned tag. No features: `blocking` is not used.
longbridge = { git = "https://github.com/longbridge/openapi", tag = "v5.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# The workspace's sqlx (calm-server uses 0.8 with `sqlite`), so the graph keeps
# one bundled `libsqlite3-sys`. No macros, no migrate: the DDL is one frozen
# const applied by `Store::open`.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
# The SDK's date type, for `QuoteContext::trading_days`.
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
url = "2"

[dev-dependencies]
futures-util = "0.3"
prost = "0.14"
tokio-tungstenite = "0.27"
longbridge-proto = { git = "https://github.com/longbridge/openapi", tag = "v5.2.0" }
axum = "0.8"
# The report `table` block's validator, for the overlay the plugin pushes.
calm-types = { path = "../../crates/calm-types" }
# The kernel's manifest parser and tool-name minting, for `manifest.json`.
plugin = { path = "../../crates/plugin" }
regex = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
