[package]
name = "desktop"
version = "0.1.0"
edition = "2024"

# The agent desktop plugin (#2530): Chrome on the headless `compositor`, its
# windows streamed into Reports through `window-stream`, and the page driven
# through `chrome-control`. Its own package, never a side binary of
# calm-server, so smithay stays out of the server's builds. It speaks only the
# plugin protocol: stdio MCP plus the manifest's `http_socket`.

[[bin]]
name = "desktop"
path = "src/main.rs"

# Test fixture, not a product binary: a fake browser that answers a tiny CDP on
# fds 3/4 and maps one Wayland window, so the tests can drive the real
# `desktop` binary without Chrome.
[[bin]]
name = "desktop-fake-chrome"
path = "tests/fixtures/fake-chrome/main.rs"
test = false

[target.'cfg(target_os = "linux")'.dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrome-control = { path = "../../crates/chrome-control" }
compositor = { path = "../../crates/compositor" }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
libc = "0.2"
png = "0.18"
sandbox = { path = "../../crates/sandbox" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
window-stream = { path = "../../crates/window-stream" }
# The fake-chrome fixture's Wayland client (pure Rust, no libwayland-client).
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
jpeg-decoder = { version = "0.3", default-features = false }
plugin = { path = "../../crates/plugin" }
regex = "1"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tokio-tungstenite = "0.29"
