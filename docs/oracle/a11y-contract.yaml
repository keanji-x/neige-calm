- id: INV-A11Y-003
  kind: invariant
  family: area-semantics
  statement: >
    Sidebar 的 area 导航项必须是 `<button>`，其 accessible name 只能是 area 名本身；
    色块与计数是视觉装饰，不得进入 name
  why: >
    §2.1 明示：不希望屏幕阅读器把计数读成名字的一部分（读 "Atlas" 而不是 "Atlas 3"）；
    因此刻意不加 aria-label，让 `<span className="lbl">` 的可见文本成为 name
  source: web/src/shared/components/Sidebar.tsx:80-102
  authoritative_test: NONE
  owner_slice: app/shell/sidebar
  intentional_omission: false
  runtime_layer: app
  verification_owner: e2e
  test_tier: browser
  migration: pending

- id: INV-A11Y-037
  kind: invariant
  family: card-semantics
  statement: >
    Card 不得声明 role="region"
  why: >
    为每张 card 增加未命名 region 会降低屏幕阅读器的叙述质量；落地有标题的 landmark 前保持省略
  source: fe/web/src/systems/cards/README.md:26
  authoritative_test: NONE
  owner_slice: systems/cards/semantics
  intentional_omission: true
  runtime_layer: systems
  verification_owner: review-waiver
  test_tier: none
  migration: pending

