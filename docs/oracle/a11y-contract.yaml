  migration: pending

- id: INV-A11Y-097
  kind: invariant
  family: motion
  statement: >
    `web/src/` 中的 JS **不得**监听 `animationend` / `transitionend`
  why: >
    §7：契约是「动效仅供装饰」，逻辑不得挂在动效生命周期上。文档同时指出即使误加，
    0.01ms 折叠后事件仍会足够同步地触发——但这不是许可，是缓冲
  source: docs/a11y-contract.md:223
  authoritative_test: NONE
  owner_slice: styles/global
  intentional_omission: true
  runtime_layer: styles
  verification_owner: review-waiver
  test_tier: none
  migration: pending

- id: INV-A11Y-098
  kind: invariant
  family: motion
  statement: >
    若新增**功能性**动画（动效承载信息，例如旋转方向编码加载状态），必须在同一个 PR 里
    记录它的 reduced-motion 替代方案
  why: >
    §7 明示的唯一豁免通道；不记录则该动画在 reduced-motion 下静默失去含义
  source: docs/a11y-contract.md:225
  authoritative_test: NONE
