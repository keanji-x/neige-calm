# ---------------------------------------------------------------------------
# §1 — Why this contract exists
# ---------------------------------------------------------------------------

- id: INV-A11Y-001
  kind: invariant
  family: locator-discipline
  statement: >
    每个 UI 元素必须能通过稳定的 role + accessible-name 对被定位；role 必须匹配
    widget 实际的行为，而不是它的 CSS 外观
  why: >
    §1 明示：Neige 的设计目标是「可被 AI agent 驱动」，AT 与 AI agent 是同一条
    定位通道；accessible name 脆化会同时打断屏幕阅读器与外部 agent
  source: docs/a11y-contract.md:11-14
  authoritative_test: web/e2e/a11y-axe.spec.ts:229
  owner_slice: none/policy/a11y-doc
  intentional_omission: false
  runtime_layer: none
  verification_owner: e2e
  test_tier: browser
  migration: pending

- id: CAP-A11Y-002
  kind: capability
  family: event-trace
  statement: >
    测试必须能把 UI 断言与针对 `window.__neigeEvents__` 的 event-trace 断言配对，
    形成「点击 role/name X 之后，事件序列 Y 发生了」的联合契约
  why: >
    §1 称这是本文档存在的首要理由（Neige-specific angle）；单独的 UI 断言或单独的
    事件断言都弱于两者配对。Slice 5 (#66) 落地
  source: docs/a11y-contract.md:16
  authoritative_test: web/e2e/a11y-trace-smoke.spec.ts:47
  owner_slice: none/e2e/infra
  intentional_omission: false
  runtime_layer: none
  verification_owner: e2e
  test_tier: browser
  migration: pending

