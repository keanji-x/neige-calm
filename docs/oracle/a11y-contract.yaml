# ---------------------------------------------------------------------------
# §7 — Motion policy
# ---------------------------------------------------------------------------

- id: GATE-A11Y-094
  kind: gate
  family: motion
  statement: >
    `prefers-reduced-motion: reduce` 必须把**每一条** CSS animation/transition 折叠到
    0.01ms，且必须带 `!important`
  why: >
    Slice 4 (#65)：`!important` 是**必需的**——否则赢不过任何内联 `animation:` 简写。
    这是全局覆盖，新增 `animation:` 因此是免费的
  source: web/src/calm.css:2483-2492
  authoritative_test: NONE
  owner_slice: styles/global
  intentional_omission: false
  runtime_layer: styles
  verification_owner: css
  test_tier: static
  migration: pending

- id: INV-A11Y-095
  kind: invariant
  family: motion
  statement: >
    代码库中每一条动画/过渡都必须是装饰性的：不得有任何动效单独承载 load 状态或信息
  why: >
    §7 的根前提；GATE-A11Y-094 的全局折叠只有在这条成立时才安全
  source: docs/a11y-contract.md:219
  authoritative_test: NONE
  owner_slice: styles/global
  intentional_omission: false
  runtime_layer: styles
  verification_owner: review-waiver
  test_tier: none
  migration: pending

- id: INV-A11Y-096
  kind: invariant
  family: motion
  statement: >
    "Loading…" 指示必须用**文字**而非 spinner（例
    `<div className="synth">Loading grid…</div>`）
  why: >
    §7 明示 "Don't add a spinner where text would do"——spinner 在 reduced-motion 下会
    被折叠成静止，从而丢失它承载的信息
  source: web/src/pages/Wave.tsx:256
  authoritative_test: NONE
  owner_slice: features/wave/page
  intentional_omission: false
  runtime_layer: features
  verification_owner: unit
