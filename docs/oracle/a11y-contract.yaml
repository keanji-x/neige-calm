# ---------------------------------------------------------------------------
# §10 / §10a — Library policy & primitive layer
# ---------------------------------------------------------------------------

- id: INV-A11Y-109
  kind: invariant
  family: library-policy
  statement: >
    立场是**手写到痛为止**，不引入 headless UI 库。重新评估的触发条件有三：
    (1) 活跃维护的 disclosure widget 超过约 5 个（今天是 Dialog + AddPanel popover）；
    (2) 落地一个无法合理手写键盘语义的新控件类别（Combobox / 命令面板最可能）；
    (3) 两个以上手写控件的 focus-management 代码开始分叉
  why: >
    §10 的 Slice 7 判词：完整 WAI-ARIA 菜单契约只花了 ~290 LOC hook + ~30 LOC 集成，
    痛点边缘案例只有 1 个（React 19 StrictMode 暴露的 Dialog inert/focus effect 顺序 bug）。
    候选评估过 Radix（最可能）/ Headless UI / React Aria / Ark UI
  source: docs/a11y-contract.md:285-300
  authoritative_test: NONE
  owner_slice: none/policy/ui-doc
  intentional_omission: true
  runtime_layer: none
  verification_owner: review-waiver
  test_tier: none
  migration: pending

