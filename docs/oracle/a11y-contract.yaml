# §2.1 — Cove object semantics
# ---------------------------------------------------------------------------

- id: INV-A11Y-003
  kind: invariant
  family: cove-semantics
  statement: >
    Sidebar 的 cove 导航项必须是 `<button>`，其 accessible name 只能是 cove 名本身；
    色块与计数是视觉装饰，不得进入 name
  why: >
    §2.1 明示：不希望屏幕阅读器把计数读成名字的一部分（读 "Atlas" 而不是 "Atlas 3"）；
    因此刻意不加 aria-label，让 `<span className="lbl">` 的可见文本成为 name
  source: web/src/shared/components/Sidebar.tsx:80-102
  authoritative_test: NONE
  owner_slice: app/shell/sidebar
  intentional_omission: false
  runtime_layer: app
  verification_owner: e2e
  test_tier: browser
  migration: pending

- id: INV-A11Y-004
  kind: invariant
  family: rename-name-split
  statement: >
    CovePage 的标题 rename 按钮的 `aria-label` 必须只是 cove 名；「Rename」动词必须由
    `<h1>` **外部**的 `<span className="sr-only">` 通过 `aria-describedby` 承载
  why: >
    §2.1 + §5：sr-only span 若留在 `<h1>` 内会污染 heading 的 accessible-name 计算，
    heading-nav（屏幕阅读器 H 键）会念成 "Rename cove name: Atlas, heading level 1"。
    #56 followup 修复
  source: web/src/pages/Cove.tsx:286-313
  authoritative_test: NONE
  owner_slice: features/cove/page
  intentional_omission: false
  runtime_layer: features
  verification_owner: unit
  test_tier: jsdom
  migration: pending

- id: INV-A11Y-005
  kind: invariant
  family: cove-semantics
  statement: >
    CovePage 标题在可 rename 时必须是 `<h1>` 包裹一个真实 `<button>`；只读时是纯 `<h1>`。
    箭头导航进入可操作元素时必须落在内层 button 上
  why: >
    §2.1 与 §5 都指明内建 role 的 `<button>` 是首选范式（intrinsic role，无需手写按键处理）
  source: web/src/pages/Cove.tsx:286-313
  authoritative_test: NONE
  owner_slice: features/cove/page
  intentional_omission: false
  runtime_layer: features
  verification_owner: unit
  test_tier: jsdom
  migration: pending

