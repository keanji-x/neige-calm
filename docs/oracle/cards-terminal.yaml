  why: >
    RGL 的 resize 手柄在每个 mousemove 都触发 ResizeObserver；不合帧会导致终端
    持续重 fit 重绘，表现为内层 canvas 1-2px 抖动
  source: web/src/XtermView.tsx:922-943
  authoritative_test: NONE
  owner_slice: systems/terminal/xterm-geometry
  intentional_omission: false
  runtime_layer: systems
