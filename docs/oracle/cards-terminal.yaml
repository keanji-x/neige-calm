- id: INV-CARD-226
  kind: invariant
  family: builtins-boot
  statement: >
    partitionTrackCards 必须在过滤 planner / track-report 的同时保留 originalIndex， 并对 unknown slot 额外按原始 wire.kind ===
    'track-report' 防御性过滤
  why: >
    onRemoveCard 按 detail.cards[idx] 寻址，丢了原索引就会删错卡。 planner 的 kernel kind 是 'codex' + planner_harness，没有
    payload 就无法在 unknown 分支识别 —— 这是已知且接受的缺口
  source: fe/web/src/systems/cards/builtins/headless-filter.ts:1-43
  authoritative_test: fe/web/src/systems/cards/builtins/headless-filter.test.ts:22,46,57,65
