- id: INV-CARD-091
  kind: invariant
  family: card-lifecycle
  statement: >
    lifecycle store 的每个快照必须冻结（含嵌套 geometry），setVisible /
    setFocused / setGeometry 在值相等时必须直接 return 不通知
  why: >
    冻结阻止消费者篡改共享快照；相等短路避免 IntersectionObserver 抖动引发
    controller 回调风暴
  source: web/src/cards/lifecycle.ts:52-114
  authoritative_test: web/src/cards/lifecycle.test.ts:18
  owner_slice: systems/cards/lifecycle
  intentional_omission: false
  runtime_layer: systems
