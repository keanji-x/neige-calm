  verification_owner: unit
  test_tier: browser
  migration: pending

- id: CAP-CARD-014
  kind: capability
  family: xterm-geometry
  statement: >
    延迟挂载期间必须挂一个 ResizeObserver，一旦观察到非退化尺寸就 disconnect
    自己并 bump layoutRetryKey 触发重挂
  why: >
    卡片布局迟到（RGL 首帧、wave 切换）时必须能自愈，否则终端永远停在 Loading
  source: web/src/XtermView.tsx:344-365
  authoritative_test: web/src/XtermView.test.tsx:496
  owner_slice: systems/terminal/xterm-geometry
  intentional_omission: false
