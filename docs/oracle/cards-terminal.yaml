    重复注册同一 type 覆盖而非报错，警告每 key 只打一次
  why: >
    M3 之前三处 5-case switch 散落在 ui.tsx / WaveGrid.tsx / api/adapt.ts；
    收敛成一张分发表后插件才能在运行时 .set() 进来。warnOnce 防止未知 kind
