  migration: pending

- id: INV-CARD-018
  kind: invariant
  family: xterm-geometry
  statement: >
    ResizeObserver 的第一次（强制的）观察通知必须被丢弃，不得当作用户 resize 意图
  why: >
    挂载时的 fit 已经供给了 ClientHello.desired_size；而 ServerHello 可能已把本地
    xterm 恢复到更宽的权威 PTY 尺寸。把首次通知当意图会立刻把 PTY 收窄回去，
    重新制造 remount 数据丢失 bug
  source: web/src/XtermView.tsx:929-938
  authoritative_test: web/src/XtermView.test.tsx:628
  owner_slice: systems/terminal/xterm-geometry
  intentional_omission: true
