- id: CAP-CARD-016
  kind: capability
  family: xterm-geometry
  statement: >
    观察到与上次失败尺寸不同且非退化的尺寸时，必须重试挂载（重新构造 Terminal 与 WS）
  why: >
    失败尺寸缓存不能变成永久拒绝；变化即代表布局真的动了
  source: web/src/XtermView.tsx:348-360
