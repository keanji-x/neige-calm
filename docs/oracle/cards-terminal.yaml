- id: INV-CARD-017
  kind: invariant
  family: xterm-geometry
  statement: >
    term.cols 小于 MIN_COMMIT_COLS 或 term.rows 小于 MIN_COMMIT_ROWS 时必须 dispose，并返回 deferUntilUsableGeometry
  why: >
    瞬时无效尺寸不能成为共享 PTY 的提交尺寸
  source: fe/web/src/systems/terminal/xterm-view.tsx:100-101,370-383
