  owner_slice: systems/terminal/xterm-geometry
  intentional_omission: false
  runtime_layer: systems
  verification_owner: review-waiver
  test_tier: none
  migration: pending

- id: CAP-CARD-046
  kind: capability
  family: xterm-data
  statement: >
    SnapshotRequired 必须清空本地终端并等待随后下发的 RenderSnapshot
  why: >
    daemon 已决定恢复方式，客户端不能自行请求或重连制造第二条恢复路径
  source: fe/web/src/systems/terminal/xterm-view.tsx:576-581
