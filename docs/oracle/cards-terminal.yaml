  test_tier: browser
  migration: pending

- id: INV-CARD-015
  kind: invariant
  family: xterm-geometry
  statement: >
    延迟重试的 ResizeObserver 必须记住上次失败的像素尺寸（lastFailedMountSizeRef），
    观察到完全相同的尺寸时不得重试
  why: >
    否则同尺寸抖动会无限 mount→dispose→defer 循环
  source: web/src/XtermView.tsx:348-356,380,519-522
  authoritative_test: web/src/XtermView.test.tsx:527
  owner_slice: systems/terminal/xterm-geometry
  intentional_omission: false
