- id: INV-CARD-181
  kind: invariant
  family: card-kind-planner
  statement: |
    planner 卡片必须是无头的（component: () => null）、defaultSize 1x1、 create 为 kernel-minted-only
  why: |
    planner harness 不是用户可见面板，只是让 track 知道有这个 agent 存在； 有 UI 会在网格里占位
  source: fe/web/src/systems/cards/builtins/planner.ts:1-29
  authoritative_test: fe/web/src/systems/cards/builtins/planner.test.ts:39,45
  owner_slice: systems/cards/builtins
  intentional_omission: true
  runtime_layer: systems
  verification_owner: unit
  test_tier: jsdom
  migration: migrated
- id: INV-CARD-182
  kind: invariant
  family: card-kind-planner
  statement: |
    planner 的识别必须且只能靠 payload.planner_harness === true 这个判别符 （isPlannerHarnessPayload），不看其它字段
  why: |
    kernel kind 是 'codex'；判别符是唯一区分点。加别的条件会让部分 planner 卡漏判
  source: fe/web/src/systems/cards/builtins/planner.ts:1-29
  authoritative_test: fe/web/src/systems/cards/builtins/planner.test.ts:11,18,25,34
  owner_slice: systems/cards/builtins
  intentional_omission: false
  runtime_layer: systems
  verification_owner: unit
  test_tier: jsdom
  migration: migrated
- id: INV-CARD-201
