  test_tier: none
  migration: pending

- id: INV-CARD-048
  kind: invariant
  family: xterm-data
  statement: >
    JSON 线格以普通 number array 传输，写入 xterm 前转换成 Uint8Array
  why: >
    JSON 不能承载二进制，xterm.write 需要 Uint8Array
