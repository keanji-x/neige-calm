- id: INV-CARD-001
  kind: invariant
  family: xterm-connection
  statement: >
    refresh() 重建 WebSocket 后，旧 WebSocket 的 onclose / onmessage / onerror
    回调必须已被置 null，旧连接的迟到 close 不得改动 status，也不得再触发
    onRoleChange(null)
  why: >
    刷新后旧 socket 仍会 fire close(1006)；若回调仍挂着，父卡片的 role pill 会被
    清成 null、status 会退回 'closed'，而新连接明明已经 connected。测试断言
    stale close 后 roleChanges.at(-1) 仍是 'Owner' 且 statusSetCalls 为空
  source: web/src/XtermView.tsx:1012-1023
  authoritative_test: web/src/XtermView.test.tsx:437
  owner_slice: systems/terminal/xterm-view
  intentional_omission: false
  runtime_layer: systems
  verification_owner: unit
  test_tier: browser
  migration: pending

- id: CAP-CARD-002
  kind: capability
  family: xterm-connection
  statement: >
    XtermView 必须通过 useImperativeHandle 暴露 refresh()：调用后重建 WS +
    Terminal，且新 WS 的 url 与旧的一致（同一 terminal endpoint）
  why: >
    #306 删掉了 XtermView 内部的 Restart / Reconnect 覆盖层；card head 的刷新
    动作只能走这个 imperative handle，否则等于没有重连入口
  source: web/src/XtermView.tsx:259-274
  authoritative_test: web/src/XtermView.test.tsx:420
  owner_slice: systems/terminal/xterm-view
  intentional_omission: false
  runtime_layer: systems
  verification_owner: unit
  test_tier: browser
  migration: pending

- id: CAP-CARD-003
  kind: capability
  family: xterm-connection
  statement: >
    XtermView 必须通过同一 handle 暴露 getWheelTarget()，未挂载 / 已卸载时返回 null
  why: >
    滚轮路由用它拿到 xterm 滚动适配器；卸载后 rootRef.current 为 null，返回 null
    才能让 wheelRouter 退化成 sink 而不是崩溃
  source: web/src/XtermView.tsx:263-271
  authoritative_test: web/src/XtermView.test.tsx:407
  owner_slice: systems/terminal/xterm-view
  intentional_omission: false
