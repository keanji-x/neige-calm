  statement: >
    容器像素尺寸退化时，resize 路径必须在调用 fit() 之前直接 return —— 不得
    先 fit 再抑制提交
  why: >
    fit() 会原地改本地 xterm；即使抑制了 ResizeCommit，本地缓冲区也会停在 2x1，
    在下一次观察前用错误几何解释 RenderPatch 字节
  source: web/src/XtermView.tsx:944-958
