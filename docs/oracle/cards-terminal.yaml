- id: INV-CARD-013
  kind: invariant
  family: xterm-geometry
  statement: >
    容器 offsetWidth < 80px 或 offsetHeight < 24px 时，不得构造 Terminal、
    不得开 WebSocket；必须进入 geometryDeferred 状态并只渲染 “Loading terminal…”
  why: >
    xterm/FitAddon 在坍缩的卡片 body 上 bootstrap 会得到退化网格；四行以上的
    宿主表面是最低可用量
  source: web/src/XtermView.tsx:119-130,373-382
  authoritative_test: web/src/XtermView.test.tsx:479
  owner_slice: systems/terminal/xterm-geometry
  intentional_omission: false
