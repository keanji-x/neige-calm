  test_tier: browser
  migration: pending

- id: GATE-CARD-004
  kind: gate
  family: xterm-connection
  statement: >
    ClientHello.protocol_version 必须等于 4，且与 crates/calm-session
    PROTOCOL_VERSION 保持锁步
  why: >
    版本不匹配时守护进程回 ProtocolError(UnsupportedVersion)。3→4 是 #388 Phase 3c
    删除 chat-mode 线格变体导致 bincode discriminant 位移
  source: web/src/XtermView.tsx:108-117
  authoritative_test: web/src/XtermView.test.tsx:568
  owner_slice: systems/terminal/protocol
  intentional_omission: false
  runtime_layer: systems
  verification_owner: unit
  test_tier: browser
  migration: pending

- id: CAP-CARD-005
  kind: capability
  family: xterm-connection
  statement: >
    ClientHello 必须带 initial_scrollback='All'、resume_from=null、
    role_hint='Owner'、capabilities.render_encodings=['Vt']、supports_scrollback=true、
    supports_sixel=false、supports_images=false、kernel_originated_input=false
  why: >
    'All' 让 wave 导航导致的 remount 能拿回守护进程保留的 scrollback；浏览器是
    不可信入口，kernel_originated_input 必须声明 false（WS 桥接层也会强制剥掉）
  source: web/src/XtermView.tsx:603-636
  authoritative_test: web/src/XtermView.test.tsx:568
  owner_slice: systems/terminal/protocol
  intentional_omission: false
  runtime_layer: systems
  verification_owner: unit
  test_tier: browser
  migration: pending

- id: INV-CARD-006
  kind: invariant
  family: xterm-connection
  statement: >
    每个连接的 client_id 必须用 makeUuid()（基于 crypto.getRandomValues），
    不得直接调用 crypto.randomUUID()
  why: >
    randomUUID 只在 secure context 可用；LAN http://192.168.x.x:4040 场景会抛
    TypeError。守护进程的 OwnerRegistry 以 client_id 为键，拿不到就丢所有权
  source: web/src/XtermView.tsx:565-573
  authoritative_test: NONE
  owner_slice: systems/terminal/xterm-view
  intentional_omission: false
  runtime_layer: systems
  verification_owner: e2e
  test_tier: browser
  migration: pending

- id: INV-CARD-007
  kind: invariant
  family: xterm-connection
  statement: >
    客户端不得再维护任何 JS 层的连接活性定时器（旧的 40s onmessage 超时已删除）；
    活性检测完全由服务端 ping/pong 拥有
  why: >
    浏览器自动 pong 不经过 JS onmessage，空闲 codex 提示符 40 秒无输出会被误判
    成 1006 假死。服务端 10s ping / 30s pong_timeout 已覆盖真实失败模式
  source: web/src/XtermView.tsx:591-599
  authoritative_test: NONE
  owner_slice: systems/terminal/xterm-view
  intentional_omission: true
  runtime_layer: systems
  verification_owner: e2e
  test_tier: browser
  migration: pending

