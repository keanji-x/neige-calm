  statement: >
    notify 遍历监听者前必须先 Array.from 快照集合，允许监听者在迭代中退订
  why: >
    直接遍历 Set 时退订会跳过后续监听者
  source: web/src/cards/lifecycle.ts:85-88
  authoritative_test: web/src/cards/lifecycle.test.ts:67
  owner_slice: systems/cards/lifecycle
  intentional_omission: false
  runtime_layer: systems
