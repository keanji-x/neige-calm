  migration: pending

- id: INV-CARD-092
  kind: invariant
  family: card-lifecycle
  statement: >
    bumpRefresh 必须每次都通知（不做相等短路），refreshEpoch 每次 +1
  why: >
    刷新是命令而非状态；相等短路会让连续两次刷新只生效一次
  source: web/src/cards/lifecycle.ts:110-112
  authoritative_test: web/src/cards/lifecycle.test.ts:46
  owner_slice: systems/cards/lifecycle
  intentional_omission: false
  runtime_layer: systems
