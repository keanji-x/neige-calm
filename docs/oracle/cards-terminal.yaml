- id: INV-CARD-017
  kind: invariant
  family: xterm-geometry
  statement: >
    初次 fit() 后若 term.cols < 8 或 term.rows < 4，必须 dispose 掉刚建的 Terminal、
    移除 dump 钩子、记录失败尺寸，并回到延迟态；不得开 WebSocket
  why: >
    低于 8x4 不是可用 PTY 视口；把这种瞬时/失败的 fit 结果提交上去会污染共享模型
  source: web/src/XtermView.tsx:123-126,514-527
  authoritative_test: web/src/XtermView.test.tsx:515
  owner_slice: systems/terminal/xterm-geometry
  intentional_omission: false
  runtime_layer: systems
  verification_owner: unit
