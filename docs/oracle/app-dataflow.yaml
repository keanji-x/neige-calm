- id: INV-APP-040
  kind: invariant
  family: app-event-stream
  statement: >
    `eventVersion` 高于服务端声明的 `syncEventVersion` 的帧必须被记录并丢弃，
    且**绝不推进 replay cursor**。
  why: >
    issue #198 concern 2：这是来自未来协议的帧，当前前端没被编译成能懂它。不推进 cursor
    才能让日后兼容的前端用同一 cursor 重连时**再次收到**这一帧。
  source: web/src/api/events.ts:443-468
  authoritative_test: NONE
  owner_slice: systems/events-transport/stream
  intentional_omission: false
  runtime_layer: systems
  verification_owner: unit
  test_tier: jsdom
  migration: pending

- id: INV-APP-041
  kind: invariant
  family: app-event-stream
  statement: >
    与"未来协议帧"相反：对**格式错误（zod 解析失败）但版本在范围内**的帧，
    必须**先**推进 cursor 再解析，即坏帧照样推进游标。
  why: >
    这类帧是"对我们而言形状不对"，不是来自未来。若不推进，单个坏帧会把 cursor 永久钉住，
    每次重连都重播同一段。两条规则的差异是刻意设计，注释里专门做了对比说明。
  source: web/src/api/events.ts:470-481
  authoritative_test: NONE
  owner_slice: systems/events-transport/stream
  intentional_omission: true
  runtime_layer: systems
  verification_owner: unit
  test_tier: jsdom
  migration: pending

- id: INV-APP-042
  kind: invariant
  family: app-event-stream
  statement: >
    `_replay_complete` 帧的 `_id` 若**小于**当前持有的 cursor，必须按"服务端日志已回退"
    处理：清 cursor、触发 snapshotRequired 监听、并主动 bounce socket。
  why: >
    issue #290：该 `_id` 是服务端 `MAX(events.id)` 的真实 tip。它比本地 cursor 小说明
    日志被重置（dev `/dev/reset` 会清 sqlite_sequence，事件从 id=1 重新开始），
    本地 cursor 指向的行已经不存在了。
  source: web/src/api/events.ts:377-424
  authoritative_test: NONE
  owner_slice: systems/events-transport/stream
  intentional_omission: false
  runtime_layer: systems
  verification_owner: unit
  test_tier: jsdom
  migration: pending

- id: INV-APP-043
  kind: invariant
  family: app-event-stream
  statement: >
    服务端重置检测只在**新 socket 的** `_replay_complete` 上生效；WS 保持打开期间发生的
    重置刻意不检测（无就地信号）。
  why: >
    注释明写这是已知 limitation：不 bounce 就没有 `_replay_complete`。测试若调
    `resetReplayServer()` 而不刷新页面 / 不断开 WS，会看到陈旧状态直到 socket 轮换。
    这是"故意不做"，重写时容易被误当成 bug 去"补全"。
  source: web/src/api/events.ts:386-393
  authoritative_test: NONE
  owner_slice: systems/events-transport/stream
