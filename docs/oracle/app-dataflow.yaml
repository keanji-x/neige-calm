- id: CAP-APP-037
  kind: capability
  family: app-invalidation-policy
  statement: >
    `track.report_edited` 必须同时失效该 track 的 track-files、全局 `track-report` 前缀、全局
    `['track-backlinks']`，以及（#1253 PR2）`['today-launchpad']` 与该 track 的
    `['track', id]`。
  why: >
    报告编辑可能删除另一个任务通过 `refs` 引用的 block，因此 task verdict 与反链都可能
    跨 track 改变；两者只能整片失效，不能按被编辑 track 收窄。
    后两个键是 Today 文档的刷新链：`['track', id]` 是文档本身被读出的键，
    `['today-launchpad']` 是空态判据被读出的键；缺任一个，点了「写今日进度」页面就
    不动。`PolicyMap` 只对 event kind 穷举、不对 query key 穷举，所以删掉任一行都不会
    有 golden 变红 —— 只有 authoritative_test 里那份逐字键表拦得住。
  source: fe/core/events/invalidation-plan.ts:316-319
  authoritative_test: fe/core/events/invalidation-plan.contract.test.ts:24-36
  owner_slice: app/events-glue/invalidation
  intentional_omission: false
  runtime_layer: app
  verification_owner: unit
  test_tier: static
  migration: migrated

- id: INV-APP-046
  kind: invariant
  family: app-event-stream
  statement: |
    retryDelay 指数退避从 500ms 起、每次翻倍、上限 8000ms；socket.onopen 成功后必须把 retryDelay 重置回 500ms。
  why: |
    不重置会让一次长断线后的后续抖动都以 8s 起步，恢复变慢。
  source: fe/web/src/systems/events/websocket-driver.ts:1-151 ; fe/web/src/app/composition.ts:1-55
  authoritative_test: fe/web/src/systems/events/websocket-driver.contract.test.ts:1
  owner_slice: systems/events-transport/stream
  intentional_omission: false
  runtime_layer: systems
  verification_owner: unit
  test_tier: jsdom
  migration: migrated
- id: INV-APP-047
  kind: invariant
  family: app-event-stream
  statement: |
    WS 升级从未完成（close 事件之前没有 open）时必须探测 whoami（通过注入的 probeUnauthorized）； live socket 被服务端断开则**不**探测，只继续退避重连。
  why: >
    issue #189：axum 中间件把未认证的 upgrade 变成普通 HTTP 401，浏览器表现为 "close 而无先前 open"。只有这一种形态才可能是 401 cookie 失效，需要走
    unauthorized 流程； 活连接掉线是网络问题，探测只会制造噪声。
  source: fe/web/src/systems/events/websocket-driver.ts:1-151 ; fe/web/src/app/composition.ts:1-55
  authoritative_test: fe/web/src/systems/events/websocket-driver.contract.test.ts:1
  owner_slice: systems/events-transport/stream
  intentional_omission: false
  runtime_layer: systems
  verification_owner: unit
  test_tier: jsdom
  migration: migrated
- id: INV-APP-048
  kind: invariant
  family: app-event-stream
  statement: >
    fe 的 whoami 探测必须有 driver 实例级、per-epoch in-flight 闩锁；composition factory 每次只构造一个 event driver，因此同一事件流内的重复
    close 不得堆叠探测。
  why: |
    新架构不提供共享模块状态；由单 driver composition 前提与实例闩锁共同防止探测风暴。
  source: fe/web/src/systems/events/websocket-driver.ts:1-151 ; fe/web/src/app/composition.ts:1-55
  authoritative_test: fe/web/src/systems/events/websocket-driver.contract.test.ts:1 + fe/web/src/app/composition.test.tsx:1
  owner_slice: systems/events-transport/stream
  intentional_omission: false
  runtime_layer: systems
  verification_owner: unit
  test_tier: jsdom
  migration: migrated
- id: INV-APP-060
  kind: invariant
  family: app-session-auth
  statement: |
    `retryUnless401` 必须被导出，供需要自定义 staleTime 等选项的调用点组合复用同一策略。
