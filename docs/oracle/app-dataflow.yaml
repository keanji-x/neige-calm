# Active oracle entries; retired source references are archived in docs/archive/legacy-web-oracle/.
- id: INV-APP-001
  kind: invariant
  family: app-provider-stack
  statement: |
    EventBridge 必须挂载在 ServerCompatGate 的**内部**（而不是与 children 平级）， 兼容判定落定前不得存在任何 EventBridge 实例。
  why: >
    Bridge 一挂载就在 useEffect 里开 /api/events WebSocket 并把每一帧灌进 Query cache；在 compat 检查跑完之前开
    socket，等于让一个不兼容的前端去解析它读不懂的 kernel 帧。issue #198 concern 1 明写此约束。
  source: fe/web/src/app/providers/public.tsx:1-101 ; fe/core/keys/storage.ts:1-31
  authoritative_test: fe/web/src/app/providers/public.contract.test.tsx:1 + fe/web/src/app/providers/public.test.tsx:1
  owner_slice: app/providers
  intentional_omission: false
  runtime_layer: app
  verification_owner: unit
  test_tier: jsdom
  migration: migrated
- id: INV-APP-002
  kind: invariant
  family: app-provider-stack
  statement: |
    /api/version 仍在飞行中（query.data === undefined）时，children 必须照常渲染， 但 renderEventBridge 必须保持未调用。
  why: >
    冷启动窗口里要让路由树从持久化 cache 立刻上色（不能被 version 查询阻塞）， 同时又绝不能在 compat 裁决落地前尝试 WS 连接。两个诉求同时成立的唯一形状就是 "children 渲染 +
    bridge 不挂"。
  source: fe/web/src/app/providers/public.tsx:1-101 ; fe/core/keys/storage.ts:1-31
  authoritative_test: fe/web/src/app/providers/public.contract.test.tsx:1 + fe/web/src/app/providers/public.test.tsx:1
  owner_slice: app/providers
  intentional_omission: false
  runtime_layer: app
  verification_owner: unit
  test_tier: jsdom
  migration: migrated
- id: CAP-APP-010
  kind: capability
  family: app-cache-bust
  statement: >
    当服务端上报的 `dbInstanceId` 与 localStorage 中上次记录的值不同时，必须清空 React Query 内存 cache、删除 IndexedDB(IDB_DB_NAME)、移除 WS
    cursor，写入新 id， 然后 `runtime.reload()`。
  why: >
    dbInstanceId 是服务端每次进程启动新铸的 UUID v4（不落库）。值变了说明底层 sqlite 被重建（`make dev RESET_DB=1`、迁移分支切换），持久化的 cache 与
    cursor 里全是 已不存在的行 id。
  source: fe/web/src/app/providers/public.tsx:1-101 ; fe/core/keys/storage.ts:1-31
  authoritative_test: fe/web/src/app/providers/public.contract.test.tsx:1 + fe/web/src/app/providers/public.test.tsx:1
  owner_slice: app/providers
  intentional_omission: false
  runtime_layer: app
  verification_owner: unit
  test_tier: jsdom
  migration: migrated
- id: INV-APP-011
  kind: invariant
  family: app-cache-bust
  statement: |
    缓存爆破必须**静默**执行 —— 不得弹确认框、不得询问用户。
  why: |
    没有任何客户端自有状态会丢（一切都在服务端），确认框是纯摩擦。代码注释明写 "silently, because there's no client-owned state to lose"。
  source: fe/web/src/app/providers/public.tsx:1-101 ; fe/core/keys/storage.ts:1-31
  authoritative_test: fe/web/src/app/providers/public.contract.test.tsx:1 + fe/web/src/app/providers/public.test.tsx:1
