- id: INV-APP-013
  kind: invariant
  family: app-cache-bust
  statement: |
    首次访问（runtime.storage 无历史 id）必须只通过 safeWrite 写入当前 id 并继续渲染，不得触发任何清理或 reload。
  why: |
    没有 previous 值就没有"变化"可言；把首访当成爆破会让每个新用户第一次打开就白屏刷新一次。
