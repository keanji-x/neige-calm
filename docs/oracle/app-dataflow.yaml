- id: INV-APP-118
  kind: invariant
  family: app-activity-indicators
  statement: >
    指示器状态只从内核的 `kernel/track/activity` overlay 推导（`activityStateOf` /
    `trackActivityState` / `isWorking` / `needsUserAttention` / `hasFailed`），不得从 lifecycle、
    `anyCardNeedsInput`、会话状态或任务 token 自行推导 attention / failed / working；
    声明例外：打开抽屉那一行的本地 in-flight spinner 与 `phase==='wedged'` 的本地 `failed`（设计 §5.3）。
    `unread` 只来自按数据库身份（`DATABASE_ID_KEY`）作用域的回执与 `activityAt` / `lastTurnCompletedAt`
    的比较：首次进入作用域以服务端时钟写一次 baseline，`null` 作用域下 `isUnread` 永不为真；
    `.attention` 涂 `--warn`、`.failed` 涂 `--error`，两者色相必须可分。
  why: >
    #1722：rail 里「股票持仓表」`data-nc-activity=working` 而其 planner 已 idle 三天——FE 用 `isRunning(lifecycle)`
    当「在动」、用 lifecycle ∨ `anyCardNeedsInput` 当「等你」，与内核从持久行算出的结论不一致；判定收敛到内核一处
    （`track_activity.rs`），FE 只解码 overlay。第二套推导必然再度分叉。
  source: fe/core/domain/activity.ts:40-48; fe/core/domain/track.ts:779-806;
