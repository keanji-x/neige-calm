- id: INV-APP-059
  kind: invariant
  family: app-session-auth
  statement: >
    React Query 的默认 retry 策略 `retryUnless401` 必须对 401 **完全不重试**，
    其他失败（500 / 网络错误）只重试一次。
  why: >
    issue #189：401 表示会话 cookie 已消失（过期、服务端重启、兄弟标签页登出）。
    重试只会拖慢 SessionProvider 的 onUnauthorized 清理 → LoginPage 跳转
    （`api/calm.ts` 的 request() 已经发过信号了），期间还堆一个注定失败的第二请求。
  source: web/src/app/providers.tsx:50-64,89
  authoritative_test: fe/web/src/app/providers/public.contract.test.tsx:1 + fe/web/src/app/providers/public.test.tsx:1
  owner_slice: app/providers
  intentional_omission: false
  runtime_layer: app
  verification_owner: unit
  test_tier: jsdom
  migration: migrated

