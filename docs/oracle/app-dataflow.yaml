# 3. dbInstanceId 缓存爆破  (family: app-cache-bust)
# ===========================================================================

- id: CAP-APP-010
  kind: capability
  family: app-cache-bust
  statement: >
    当服务端上报的 `dbInstanceId` 与 localStorage 中上次记录的值不同时，必须清空
    React Query 内存 cache、删除 IndexedDB(IDB_DB_NAME)、移除 WS cursor，写入新 id，
    然后 `window.location.reload()`。
  why: >
    dbInstanceId 是服务端每次进程启动新铸的 UUID v4（不落库）。值变了说明底层 sqlite
    被重建（`make dev RESET_DB=1`、迁移分支切换），持久化的 cache 与 cursor 里全是
    已不存在的行 id。
  source: web/src/app/providers.tsx:177-203
  authoritative_test: fe/web/src/app/providers/public.contract.test.tsx:1 + fe/web/src/app/providers/public.test.tsx:1
  owner_slice: app/providers
  intentional_omission: false
  runtime_layer: app
  verification_owner: unit
  test_tier: jsdom
  migration: migrated

- id: INV-APP-011
  kind: invariant
  family: app-cache-bust
  statement: >
    缓存爆破必须**静默**执行 —— 不得弹确认框、不得询问用户。
  why: >
    没有任何客户端自有状态会丢（一切都在服务端），确认框是纯摩擦。代码注释明写
    "silently, because there's no client-owned state to lose"。
  source: web/src/app/providers.tsx:145-149
  authoritative_test: fe/web/src/app/providers/public.contract.test.tsx:1 + fe/web/src/app/providers/public.test.tsx:1
