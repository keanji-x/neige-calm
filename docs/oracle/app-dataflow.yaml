    实测有时 refetch 成功但 Sidebar 不刷新。write-through 让观察者
    （Sidebar 的 useCovesQuery）在下一次渲染就看到新名字，不依赖 HTTP。
    朴素的 `setQueryData([updated])` 会静默丢掉其他 cove，所以"保留其他行"必须一起锁。
