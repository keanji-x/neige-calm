- id: INV-APP-081
  kind: invariant
  family: app-trace-buffer
  statement: >
    `__neigeClearEvents__` 必须**原地**清空数组（`buf.length = 0`），不得换新引用；
    `ensureTraceBuffer` 必须幂等复用已有 buffer。
  why: >
    Playwright helper 跨 `page.evaluate` 调用持有同一个数组引用；换引用会让它继续读旧数组。
