- id: INV-APP-108
  kind: invariant
  family: app-event-stream
  statement: >
    fe WebSocket driver 的 start/stop、socket 回调、timer 与 probe 续体必须受 epoch 隔离；
    socket handler 的自身状态写入必须在第一次 sink 调用前完成；只有 replay-complete 的 connected sink 后仍有 frame
    投递，因此该路径必须在 sink 返回后重核 epoch，message 的末次 frame sink 与 close 的末次 state sink 后结构上无续体；
    构造异常不得向上逃逸。
  why: >
    StrictMode 与同步 sink 重入会让旧续体和新连接交错；缺少任一边界都会产生双 socket 或跨 epoch 字段污染。
