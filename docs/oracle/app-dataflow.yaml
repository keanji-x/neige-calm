# ===========================================================================
# 5. EventBridge 生命周期  (family: app-event-bridge)
# ===========================================================================

- id: INV-APP-019
  kind: invariant
  family: app-event-bridge
  statement: >
    EventBridge 的 effect 必须严格按 `setSyncEventVersion(v)` → `subscribe(['*'])` →
    `start()` 顺序调用，三者顺序 load-bearing。
  why: >
    setSyncEventVersion 必须先于 subscribe，服务端推来的第一帧（通常是 replay 窗口）
    才已经被 eventVersion 天花板守住（#198 concern 2）；start 必须最后，
    才保证 gate 装好之前 socket 根本没开（#215）。
  source: web/src/app/eventBridge.tsx:172-189
  authoritative_test: web/src/app/eventBridge.test.tsx:165
  owner_slice: app/events-glue/event-bridge
  intentional_omission: false
  runtime_layer: app
  verification_owner: null
  test_tier: jsdom
  migration: skipped
  skip_reason: >
    新架构用 typestate 取代：`UnconfiguredEventStream.configure({syncEventVersion, topics})`
    返回 `ConfiguredEventStream`，只有后者有 `start()`；subscribe 折进 configure。
    三段顺序在类型层不可倒置，不再需要运行期约定。见 _fe-architecture.md §4.7.1。
    ⚠️ INV-APP-020/021 不随之消失（typestate 管不了「只有一处调 start」与「configure 本身不得连接」）。

- id: INV-APP-020
  kind: invariant
  family: app-event-bridge
  statement: >
    EventBridge 必须是共享事件流单例唯一的 `start()` 调用方；其他消费者
    （useConnectionState、codex hook listener）只注册 handler，不得触发连接。
  why: >
    issue #198 followup / PR #215：以前 `sharedEventStream()` 会自动 start，
    ServerCompatGate 提前渲染的 children 一调它就在 compat 裁决前开了 socket。
    改成惰性单例后，"不兼容前端永不打开 /api/events" 才从"实践上成立"变成"构造上成立"。
    【新架构】typestate **不覆盖此条**：同一 Unconfigured 实例可被多次 configure，
    也可能产生多个持有 start() 的 handle。仍需 ownership 约束 + architecture test。
  source: web/src/app/eventBridge.tsx:180-189; web/src/api/events.ts:604-634
  authoritative_test: web/src/app/eventBridge.test.tsx:165
  owner_slice: systems/events-transport/stream
  intentional_omission: false
  runtime_layer: systems
  verification_owner: unit
  test_tier: jsdom
  migration: pending

- id: INV-APP-021
  kind: invariant
  family: app-event-bridge
  statement: >
    `sharedEventStream()` 在显式 `start()` 之前必须完全惰性 —— 构造单例不得自动连接。
  why: >
    同上（#215）。注释明写"we DO NOT auto-call start() here"，并给出测试逃生口：
    需要已连接流的测试自行 `new EventStream(url)` 再 `start()`。
    【新架构】`configure()` 本身**不得**建立连接，构造/获取共享实例也不得连接。
    这是接口的副作用约束，必须写进 §6 冻结面，typestate 不表达副作用。
  source: web/src/api/events.ts:606-634
  authoritative_test: web/src/app/useConnectionState.test.tsx:87
  owner_slice: systems/events-transport/stream
  intentional_omission: false
  runtime_layer: systems
  verification_owner: unit
  test_tier: jsdom
  migration: pending

