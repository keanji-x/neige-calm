    `?trace=1`。
  why: >
    只有内联短路才能让 Vite/terser 把整个右侧（含 `ensureTraceBuffer` / `pushTraceEvent`
    的调用）折成死代码，生产 bundle 才真的不含 buffer 代码。注释明确要求：
    重构成单函数调用前必须用 `grep __neigeEvents__ web/dist/assets/*.js` 复验。
  source: web/src/app/eventBridge.tsx:56-65,105-116,191-198
