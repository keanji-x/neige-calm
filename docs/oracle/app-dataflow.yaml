- id: INV-APP-017
  kind: invariant
  family: app-storage-keys
  statement: >
    WS 同步游标的 localStorage key 字面量 `calm:sync:cursor` 在三处硬编码
    （api/events.ts、providers.tsx、SessionProvider.tsx），三者的值必须始终一致。
  why: >
    代码注释明写"duplicate it here (rather than import) so the cache-bust path
    doesn't pull the WS module into the providers' import graph … The value MUST
    stay in sync with events.ts"。三处任意一处漂移 = 清理路径删不掉真正的 cursor，
    登出/爆破后仍会用旧游标去 replay。
    【新架构备注】这是应当被消除的重复：新架构应把 key 收敛到单一常量模块，
    让 import graph 约束通过分层而非复制来满足。
