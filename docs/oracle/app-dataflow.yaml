- id: CAP-APP-025
  kind: capability
  family: app-event-bridge
  statement: >
    收到 `_snapshot_required` 控制帧时必须执行 `queryClient.clear()`。
  why: >
    该帧表示服务端已无法按当前 cursor 服务（超出保留期）。清空持久化 cache 让下次挂载
    冷启动、从 REST 重新拉取。EventStream 在该监听跑之前已抹掉 lastEventId。
