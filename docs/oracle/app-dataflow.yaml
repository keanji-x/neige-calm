    （字段：id / eventVersion / ev / data / ts），环大小上限 200，超出丢最旧。
  why: >
    Playwright 靠它断言"产生这个 UI 状态的事件序列"。200 远大于任何单个场景的发射量，
    又足够有界，避免被遗忘的 dev 标签页把内存撑大。
