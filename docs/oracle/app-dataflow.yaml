  statement: >
    cove / wave 路由的 loader 必须**非阻塞**地 prime 缓存（`void ... .catch(() => {})`），
    不得 await，路由必须立即 commit。
  why: >
    选择反馈（URL commit + 侧栏高亮）要即时；页面组件自己负责短暂的页内 loading 态。
    `.catch` 是为了让 404/5xx/离线不变成 unhandled rejection —— 错误仍记录在 query 上
    供组件呈现。
