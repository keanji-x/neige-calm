  migration: pending

- id: INV-APP-044
  kind: invariant
  family: app-event-stream
  statement: >
    `connected` 状态必须由 `_replay_complete` 控制帧驱动，**不得**由 WS `'open'` 事件驱动。
  why: >
    open 只代表握手成功；从 open 到 replay 播完这段时间服务端还在补历史事件，此时报
    "you're live" 是骗用户。注释与 ConnectionState 文档都把这条列为权威信号。
  source: web/src/api/events.ts:139-146,320-328,425-431
