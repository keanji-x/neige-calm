  migration: migrated
- id: CAP-APP-074
  kind: capability
  family: app-theme
  statement: >
    `mode === 'system'` 时必须订阅 `matchMedia('(prefers-color-scheme: dark)')` 的 change 并跟随 OS；切成显式 'light'/'dark'
    时必须拆掉该订阅，OS 变化不得再影响 `resolved`。
  why: |
