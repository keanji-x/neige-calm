- id: INV-APP-007
  kind: invariant
  family: app-compat-gate
  statement: >
    兼容检查只在挂载时跑一次 —— 不得设置 refetchInterval 轮询；
    且 `staleTime: 0` + `gcTime: 0`，新挂载绝不复用缓存的 version 结果。
  why: >
    这个查询的全部意义是"本次挂载的快照"；缓存值对新挂载没有意义，轮询也不在设计内
    （单次 mount 检查，见 providers.tsx 头部注释）。
