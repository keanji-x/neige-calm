- id: INV-APP-030
  kind: invariant
  family: app-invalidation-policy
  statement: >
    `area.updated` 必须把事件 payload **同步 write-through** 写进 `['areas']` cache，
    必须保留列表中其他未受影响的行，并且低 `updatedAt` 的 payload 不得覆盖更高版本。
  why: >
    生产 sidebar 陈旧 bug 的回归锁（issue #288）：仅 invalidate 依赖一次 refetch 往返，
    实测有时 refetch 成功但 Sidebar 不刷新。write-through 让观察者
    （Sidebar 的 useAreasQuery）在下一次渲染就看到新名字，不依赖 HTTP。
    朴素的 `setQueryData([updated])` 会静默丢掉其他 area；事件与 HTTP 的到达顺序也不稳定，
    所以"保留其他行"和"保留更高版本"必须一起锁。
  source: fe/core/domain/area.ts:60-70; fe/web/src/app/events/query-invalidation-adapter.ts:98-108
  authoritative_test: fe/web/src/app/events/query-invalidation-adapter.test.ts:151-210
  owner_slice: app/events-glue/invalidation
  intentional_omission: false
  runtime_layer: app
  verification_owner: unit
  test_tier: jsdom
  migration: migrated

- id: INV-APP-031
  kind: invariant
  family: app-invalidation-policy
  statement: >
    `replace-existing-area` write-through 命中未初始化的 `['areas']` cache，或已初始化列表中
    不存在的 area 时，都必须是 no-op —— **不得凭事件造出 phantom area**。
  why: >
    issue #288 防御分支：客户端从未 fetch 过（或已被 GC）的 area，事件 payload 不是
    完整真相来源；凭它塞一行进列表会画出一个幻影。正确路径是等旁路的 invalidate 触发
    refetch 把真相拉回来。
  source: fe/web/src/app/events/query-invalidation-adapter.ts:113-123
  authoritative_test: fe/web/src/app/events/query-invalidation-adapter.test.ts:225-253
  owner_slice: app/events-glue/invalidation
  intentional_omission: true
  runtime_layer: app
  verification_owner: unit
  test_tier: jsdom
  migration: migrated

- id: CAP-APP-032
  kind: capability
  family: app-invalidation-policy
  statement: >
    `track.updated` / `track.lifecycle_changed` 都必须失效所属 area 的 track 列表、该 track
    的 detail、该 track 的 track-files 与全局 `['tracks-range']`；只有 `track.updated`
    额外广播失效 `['track-report']`，因为它承载 task budget / admission policy 变化。
  why: >
    track 的四个可见投影分别由这四个 key 驱动（侧栏列表 / 详情页 / 报告文件树 / 日历区间视图），
    少一个就出现某一处静默陈旧。lifecycle 事件本身不证明 task policy 改变；把 report
    刷新限定到 `track.updated` 可避免独立 lifecycle 消息触发昂贵的整份报告重算。
  source: fe/core/events/invalidation-plan.ts:202-220
  authoritative_test: fe/core/events/invalidation-plan.test.ts:61-83
  owner_slice: app/events-glue/invalidation
  intentional_omission: false
  runtime_layer: app
  verification_owner: unit
  test_tier: static
  migration: migrated

- id: CAP-APP-033
  kind: capability
  family: app-invalidation-policy
  statement: >
    `track.deleted` 必须失效 area 的 track 列表 + track overlay 快照 + `['tracks-range']`，
    广播失效 `['track-report']` 前缀，并且必须 **removeQueries** 掉该 track 的 detail
    与 `['track-report', id]`（而不是仅 invalidate）。
  why: >
    已删除的 track detail 再 refetch 只会拿到 404；直接从 cache 移除才不会让陈旧详情
    继续作为 placeholder 上色。删除 tree member 也会改变剩余成员的 B/N budget share，
    所以仍存活的 task verdict 查询必须重新读取服务端重投影结果；删除目标自己的 report
    endpoint 已经是 404，必须先从 cache 移除，不能被 prefix refetch 命中。
  source: fe/core/events/invalidation-plan.ts:211-218; fe/web/src/app/events/query-invalidation-adapter.ts:91-104
  authoritative_test: fe/web/src/app/events/query-invalidation-adapter.test.ts:300
  owner_slice: app/events-glue/invalidation
  intentional_omission: false
  runtime_layer: app
  verification_owner: unit
  test_tier: jsdom
  migration: migrated

- id: CAP-APP-103
  kind: capability
  family: app-invalidation-policy
  statement: >
    携带 `agent_message` 的 standalone `plan.updated` 必须按事件中的 track id 失效
    `['track-report', trackId]`；投影伴随事件不得重复失效。
  why: >
    `calm.plan.cancel` 将 pending task 改为 canceled 时只发送 `plan.updated`；pending 状态不轮询，
    缺少该失效会让 TASKS 面板永久保留旧状态和旧 pending reason，直到整页重载。
  source: fe/core/events/invalidation-plan.ts:356-358
  authoritative_test: fe/web/src/app/events/event-bridge.contract.test.tsx:243-249
  owner_slice: app/events-glue/invalidation
  intentional_omission: false
  runtime_layer: app
  verification_owner: unit
  test_tier: jsdom
  migration: migrated

- id: INV-APP-034
  kind: invariant
  family: app-invalidation-policy
  statement: >
    card overlay（`overlay.set` / `overlay.deleted` 且 entity_kind === 'card'）必须通过
    扫描已加载的 `['track', *]` cache 反查拥有该 card 的 track；查不到时必须静默跳过，
    不得报错也不得广播失效。
  why: >
    kernel 用 entity_kind + entity_id 寻址 overlay，光看事件 payload 无从知道该失效哪个 track。
    没有 track 被加载时，用户根本看不到那个 track 的 card overlay 变化，等下次 track detail
    refetch 捡起来即可 —— 这是被明确判定为无害的降级。
  source: fe/web/src/app/events/track-lookup.ts:7-17; fe/core/events/invalidation-plan.ts:320-339
  authoritative_test: fe/web/src/app/events/track-lookup.test.ts:7-17
  owner_slice: app/events-glue/invalidation
  intentional_omission: true
  runtime_layer: app
  verification_owner: unit
  test_tier: jsdom
  migration: migrated

- id: INV-APP-035
  kind: invariant
  family: app-invalidation-policy
  statement: >
    track 文件与报告派生事件的降级链必须是：优先用 payload 的 `track_id` →
    否则用 `card_id` 反查所属 track → 都没有则同时失效**全部** `['track-files']`
    与 `['track-report']` 前缀。
  why: >
    runs/* 与 cards/* 的 hook 视图都从 kernel 投影的 track 文件派生；反查失败时宁可
    宽失效也不能静默不失效（否则报告侧栏永远看不到新产物）。
  source: fe/core/events/invalidation-plan.ts:46-73
  authoritative_test: fe/core/events/invalidation-plan.test.ts:67; fe/core/events/invalidation-plan.contract.test.ts:36
