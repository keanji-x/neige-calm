  verification_owner: unit
  test_tier: jsdom
  migration: migrated
- id: INV-APP-012
  kind: invariant
  family: app-cache-bust
  statement: |
    dbInstanceId 相同时，必须保留 Query cache、WS cursor（`calm:sync:cursor`）和 IDB blob —— 三者一个都不能动。
  why: |
    对称防"爆破过度"回归：匹配路径上误删 cursor 会丢掉自启动以来的全部事件， 误删 cache/IDB 会白掉首屏。
