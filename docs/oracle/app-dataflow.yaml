  statement: >
    QueryClient 必须是模块作用域的单例，persistOptions 也必须在模块作用域构建一次。
  why: >
    QueryClient 要在重渲染间保持稳定并能被 router loader 直接 import 使用
    （router.tsx 的 loader 直接 `import { queryClient }`）；persistOptions 若每次
    AppProviders 重渲染都重建，会反复重开 IndexedDB 连接。
  source: web/src/app/providers.tsx:84-97
  authoritative_test: NONE
