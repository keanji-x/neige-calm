- id: INV-APP-073
  kind: invariant
  family: app-theme
  statement: |
    storage(`calm.theme`) 的读与写都必须 try/catch；读到非法值必须回落 `'system'`。
  why: |
    跨域 iframe / private mode 下 localStorage 会抛。写失败时状态更新仍然生效， 只是不跨 reload 存活 —— 这是刻意的降级取舍。
