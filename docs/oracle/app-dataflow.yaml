    只有显式 `close()` 才置 `disconnected`。
  why: >
    重试期间保持 connected 会让 UI 指示器显示"已连接"而实际已陈旧；把
    "首连中"和"重连中"折叠成同一个用户可见状态是刻意的（UX 上二者无差别）。
