- id: INV-APP-107
  kind: invariant
  family: app-event-stream
  statement: >
    fe cursor store 在 adopt 前必须 fail-closed；持久值必须绑定匹配的 dbInstanceId 且 cursor 为非负安全整数；
    clear() 必须取消 pending flush、清空持久值但保留 adopt 状态，实例切换裁决前不得挂载 EventBridge；
    storage 读写是 best-effort，异常不得逃逸且内存值继续保持权威。
  why: >
    这些约束共同阻止跨数据库 cursor 重放、旧 idle 续体复活 cursor，以及实例切换首帧先建连。
