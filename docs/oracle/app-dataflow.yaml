# ===========================================================================
# 1. Provider stack ordering  (family: app-provider-stack)
# ===========================================================================

- id: INV-APP-001
  kind: invariant
  family: app-provider-stack
  statement: >
    EventBridge 必须挂载在 ServerCompatGate 的**内部**（而不是与 children 平级），
    兼容判定落定前不得存在任何 EventBridge 实例。
  why: >
    Bridge 一挂载就在 useEffect 里开 /api/events WebSocket 并把每一帧灌进 Query
    cache；在 compat 检查跑完之前开 socket，等于让一个不兼容的前端去解析它读不懂的
    kernel 帧。issue #198 concern 1 明写此约束。
  source: web/src/app/providers.tsx:110-122,231-236
  authoritative_test: fe/web/src/app/providers/public.contract.test.tsx:1 + fe/web/src/app/providers/public.test.tsx:1
  owner_slice: app/providers
  intentional_omission: false
  runtime_layer: app
  verification_owner: unit
  test_tier: jsdom
  migration: migrated

- id: INV-APP-002
  kind: invariant
  family: app-provider-stack
  statement: >
    /api/version 仍在飞行中（q.data === undefined）时，children 必须照常渲染，
    但 EventBridge 必须保持未挂载。
  why: >
    冷启动窗口里要让路由树从持久化 cache 立刻上色（不能被 version 查询阻塞），
    同时又绝不能在 compat 裁决落地前尝试 WS 连接。两个诉求同时成立的唯一形状就是
    "children 渲染 + bridge 不挂"。
  source: web/src/app/providers.tsx:218-236
  authoritative_test: fe/web/src/app/providers/public.contract.test.tsx:1 + fe/web/src/app/providers/public.test.tsx:1
  owner_slice: app/providers
  intentional_omission: false
  runtime_layer: app
  verification_owner: unit
  test_tier: jsdom
  migration: migrated

- id: INV-APP-003
  kind: invariant
  family: app-provider-stack
  statement: >
    ThemeProvider 必须位于 AppProviders 之内、RouterProvider（children）之外，
    即整个路由树之上只有唯一一个 theme provider。
  why: >
    路由内渲染的 plugin iframe 卡片会调 useTheme()；只有当 provider 高于整棵路由树，
    一次主题翻转才能被所有路由同时观测到。issue #22。
  source: web/src/app/providers.tsx:103-122
  authoritative_test: NONE
  owner_slice: app/providers
  intentional_omission: false
  runtime_layer: app
  verification_owner: unit
  test_tier: jsdom
  migration: pending

- id: INV-APP-004
