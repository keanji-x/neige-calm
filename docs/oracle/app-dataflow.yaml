- id: CAP-APP-064
  kind: capability
  family: app-session-auth
  statement: >
    收到全局 unauthorized 信号时必须依次：清空 QueryClient、移除 `calm:sync:cursor`、
    删除 IndexedDB(IDB_DB_NAME)，然后把会话态翻回 `unauthed`（LoginPage）。
  why: >
    上一会话的 `since` 游标若留着，下一个用户立刻登录就会把旧事件重播进新会话；
    游标本来就是单用户的，丢弃才正确。IDB 同理 —— 死行 id 不得上色。
  source: fe/web/src/app/auth/session-gate.tsx:22-30,61-69 ; fe/web/src/app/auth/production-app.tsx:55-69 ; fe/web/src/app/events/browser-cursor-store.ts:1,83-89 ; fe/core/keys/storage.ts:12-14
