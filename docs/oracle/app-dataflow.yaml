    dbInstanceId 检查在该情况下同样 no-op。
  why: >
    宁可让各查询自己的错误横幅暴露连通性问题，也不要因为一次瞬时 /api/version 失败
    把整个应用锁死；缺数据意味着没有可比对的东西，比对必须跳过。
