    补一次 focus，并在微任务里重新校验 ref 未被替换且 `document.contains(el)`。
  why: >
    源码注释：菜单以 initialIndex=0 打开时 focus effect 先于 ref 附着触发；不延后
    则元素尚未进入布局，Chrome 静默拒绝 focus。重校验是防止 schedule 与 flush
    之间元素已卸载/替换。
