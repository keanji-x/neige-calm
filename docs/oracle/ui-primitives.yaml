# Active oracle entries; retired source references are archived in docs/archive/legacy-web-oracle/.
- id: INV-UI-DIALOG-002
  kind: invariant
  family: dialog-effect-order
  statement: >
    Menu 激活条目时必须先同步恢复 trigger 焦点，再调用 onSelect
  why: >
    onSelect 可能立即挂载 Dialog；反序会让 Dialog 记住即将卸载的 menuitem，关闭时无法恢复焦点
  source: fe/web/src/ui/menu/public.tsx:30-35
  authoritative_test: fe/web/src/ui/menu/public.test.tsx:28-39
  owner_slice: ui/menu
  intentional_omission: false
  runtime_layer: ui
  verification_owner: unit
  test_tier: jsdom
  migration: migrated

- id: INV-UI-MENU-035
  kind: invariant
  family: menu-focus
  statement: >
    外部点击关闭 Menu 时不得把焦点抢回 trigger
  why: >
    用户已经主动点击其它目标，恢复 trigger 会覆盖该焦点意图
  source: fe/web/src/ui/menu/public.tsx:42-49
  authoritative_test: NONE
  owner_slice: ui/menu
  intentional_omission: true
  runtime_layer: ui
  verification_owner: review-waiver
  test_tier: none
  migration: pending

- id: INV-UI-MENU-039
  kind: invariant
  family: menu-focus
  statement: >
    鼠标悬停跟随使用 onMouseMove，不使用 onMouseEnter
  why: >
    菜单可能在静止指针下挂载，mouseenter 会覆盖键盘初始焦点
  source: fe/web/src/ui/menu/public.tsx:60-65
  authoritative_test: NONE
  owner_slice: ui/menu
  intentional_omission: true
  runtime_layer: ui
  verification_owner: review-waiver
  test_tier: none
  migration: pending

- id: INV-UI-MENU-040
  kind: invariant
  family: menu-items
  statement: >
    disabled menuitem 保持可聚焦和可读，但激活必须无效
  why: >
    键盘用户仍需发现不可用选项，aria-disabled 不能退化成可执行状态
  source: fe/web/src/ui/menu/public.tsx:31-35,60-65
  authoritative_test: NONE
  owner_slice: ui/menu
  intentional_omission: true
  runtime_layer: ui
  verification_owner: review-waiver
  test_tier: none
  migration: pending

- id: INV-UI-MENU-046
  kind: invariant
  family: menu-structure
  statement: >
    外部点击检测使用 mousedown，并把 trigger 与 popover 视为同一内部边界
  why: >
    click 太晚，会先改变焦点；遗漏 trigger 会把 toggle 误判为外部关闭
  source: fe/web/src/ui/menu/public.tsx:42-49
  authoritative_test: NONE
  owner_slice: ui/menu
  intentional_omission: false
  runtime_layer: ui
  verification_owner: review-waiver
  test_tier: none
  migration: pending

- id: INV-UI-CONFIRM-121
  kind: invariant
  family: confirm-label-layout
  statement: >
    ConfirmDialog shows exactly one of its ready and busy labels. Switching state keeps
    the visible text on the same line relative to the button and preserves button width.
  why: >
    CR-7 reserves space for the wider label without showing both labels or moving the
    action text to a second row. Rendered visibility and geometry replace the source pin.
  source: fe/web/src/styles/dialog.css:104-124; fe/web/src/ui/dialog/public.tsx:226-252
  authoritative_test: fe/web/src/ui/dialog/dismissal.browser.test.tsx:43-75
  owner_slice: ui/confirm-dialog
  intentional_omission: false
  runtime_layer: ui
  verification_owner: unit
  test_tier: browser
  migration: migrated

- id: INV-APP-MISSING-122
  kind: invariant
  family: missing-route-focus
  statement: >
    When a Dialog opener has been removed, closing the Dialog restores focus to the
    rendered missing PendingRoute heading.
  why: >
    The missing page must supply a usable fallback to the production Dialog focus
    restoration path. This component contract does not claim that a real 404 renders
    PendingRoute: the router currently renders ErrorBox for fetch errors.
  source: fe/web/src/app/router/pending-route.tsx:7-18; fe/web/src/ui/dialog/public.tsx:177-184
  authoritative_test: fe/web/src/app/router/pending-route.test.tsx:10-24
  owner_slice: app/router
  intentional_omission: false
  runtime_layer: app
  verification_owner: unit
  test_tier: jsdom
  migration: migrated

- id: INV-UI-TITLE-123
  kind: invariant
  family: title-layout
  statement: >
    The track header truncates a long EditableTitle in its available inline space
    while the input notice remains below the header actions.
  why: >
    The composed header browser test observes the single-line title behaviour. It
    catches removing nowrap without pinning stylesheet spelling; ellipsis paint
    remains a visual concern rather than a source assertion.
  source: fe/web/src/ui/editable-title/editable-title.module.css:2-17; fe/web/src/ui/editable-title/public.tsx:37-40; fe/web/src/features/track/page/public.tsx:426-431
  authoritative_test: fe/web/src/features/track/page/header-status.browser.test.tsx:392-416
  owner_slice: ui/editable-title
