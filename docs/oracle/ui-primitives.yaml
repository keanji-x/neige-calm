- id: INV-UI-DIALOG-011
  kind: invariant
  family: dialog-focus
  statement: >
    `isFocusable` 必须用 `el.closest('[inert]')` 排除处于 inert 子树内的元素，
    而不仅检查元素自身。
  why: >
    inert 是继承性的：祖先带 inert 则后代全部不可 tab；只查自身会把背景元素误判为
    可聚焦。源码注释："`inert` (on the element or any ancestor) makes it untabbable."
  source: web/src/ui/Dialog/Dialog.tsx:120-121
