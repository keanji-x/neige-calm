- id: INV-UI-DIALOG-004
  kind: invariant
  family: dialog-focus
  statement: >
    focus trap 必须在每次 Tab keydown 时重新查询 panel 内的 focusables，
    不得缓存快照。
  why: >
    panel 内容会动态变化（child view push 换掉整个 body），缓存的列表会立刻过期；
    源码注释："Querying focusables fresh on every Tab keypress keeps us correct
    across dynamic content"，并因此 child view 不需要自带 focus 管理。
  source: web/src/ui/Dialog/Dialog.tsx:31-34,300-308,331-336
  authoritative_test: NONE
  owner_slice: ui/dialog
  intentional_omission: false
  runtime_layer: ui
  verification_owner: e2e
  test_tier: browser
  migration: pending

- id: INV-UI-DIALOG-005
  kind: invariant
  family: dialog-focus
  statement: >
    inert 清理必须逐元素精确还原开启前记录的 `prior` 值（hadInert /
    hadAriaHidden），不得无脑 removeAttribute。
  why: >
    背景兄弟节点可能在 Dialog 打开【之前】就已带 inert 或 aria-hidden（嵌套模态、
    上层框架托管）；无脑移除会把别人的状态擦掉。源码注释："Remember each sibling's
    prior state so we can restore exactly."
  source: web/src/ui/Dialog/Dialog.tsx:208-224
  authoritative_test: web/src/ui/Dialog/Dialog.test.tsx:126
  owner_slice: ui/dialog
  intentional_omission: false
