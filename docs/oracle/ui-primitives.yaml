# Active oracle entries; retired source references are archived in docs/archive/legacy-web-oracle/.
- id: INV-UI-DIALOG-002
  kind: invariant
  family: dialog-effect-order
  statement: >
    Menu 激活条目时必须先同步恢复 trigger 焦点，再调用 onSelect
  why: >
    onSelect 可能立即挂载 Dialog；反序会让 Dialog 记住即将卸载的 menuitem，关闭时无法恢复焦点
  source: fe/web/src/ui/menu/public.tsx:18-23
  authoritative_test: fe/web/src/ui/menu/public.test.tsx:28-38
  owner_slice: ui/menu
  intentional_omission: false
  runtime_layer: ui
  verification_owner: unit
  test_tier: jsdom
  migration: migrated

- id: INV-UI-MENU-035
  kind: invariant
  family: menu-focus
  statement: >
    外部点击关闭 Menu 时不得把焦点抢回 trigger
  why: >
    用户已经主动点击其它目标，恢复 trigger 会覆盖该焦点意图
  source: fe/web/src/ui/menu/public.tsx:30-37
  authoritative_test: NONE
  owner_slice: ui/menu
  intentional_omission: true
  runtime_layer: ui
  verification_owner: review-waiver
  test_tier: none
  migration: pending

- id: INV-UI-MENU-039
  kind: invariant
  family: menu-focus
  statement: >
    鼠标悬停跟随使用 onMouseMove，不使用 onMouseEnter
  why: >
    菜单可能在静止指针下挂载，mouseenter 会覆盖键盘初始焦点
  source: fe/web/src/ui/menu/public.tsx:46
  authoritative_test: NONE
  owner_slice: ui/menu
  intentional_omission: true
  runtime_layer: ui
  verification_owner: review-waiver
  test_tier: none
  migration: pending

- id: INV-UI-MENU-040
  kind: invariant
  family: menu-items
  statement: >
    disabled menuitem 保持可聚焦和可读，但激活必须无效
  why: >
    键盘用户仍需发现不可用选项，aria-disabled 不能退化成可执行状态
  source: fe/web/src/ui/menu/public.tsx:21,46-47
  authoritative_test: NONE
  owner_slice: ui/menu
  intentional_omission: true
  runtime_layer: ui
  verification_owner: review-waiver
  test_tier: none
  migration: pending

- id: INV-UI-MENU-046
  kind: invariant
  family: menu-structure
  statement: >
    外部点击检测使用 mousedown，并把 trigger 与 popover 视为同一内部边界
  why: >
    click 太晚，会先改变焦点；遗漏 trigger 会把 toggle 误判为外部关闭
  source: fe/web/src/ui/menu/public.tsx:30-39
  authoritative_test: NONE
  owner_slice: ui/menu
  intentional_omission: false
  runtime_layer: ui
  verification_owner: review-waiver
