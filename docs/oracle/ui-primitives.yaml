# ===========================================================================
# Dialog — effect ordering (the class most likely to be lost in a rewrite)
# ===========================================================================

- id: INV-UI-DIALOG-001
  kind: invariant
  family: dialog-effect-order
  statement: >
    Dialog 的 background-inert effect 必须声明在 focus-restore effect 之前；
    两者的声明顺序本身就是契约，不得因为"看起来无关"而重排。
  why: >
    React 在同一次 render pass 上按【声明顺序】跑 effect cleanup（不是逆序）。
    顺序反了则 focus restore 先跑，restore 目标（例如与 portal root 同级的
    AddPanel trigger）此时祖先仍带 inert，浏览器会静默忽略 focus() 调用，焦点
    掉到 <body>。源码注释："Slice 7 surfaced this"（PR #73 / issue #75）。
  source: web/src/ui/Dialog/Dialog.tsx:183-193,229-235
  authoritative_test: web/src/ui/Dialog/Dialog.test.tsx:230
  owner_slice: ui/dialog
  intentional_omission: false
  runtime_layer: ui
  verification_owner: unit
  test_tier: browser
  migration: pending

- id: INV-UI-DIALOG-002
  kind: invariant
  family: dialog-effect-order
  statement: >
    Menu 激活 menuitem 时必须【先同步把焦点还给 trigger，再调用 onSelect】；
    这两步必须在同一个同步 tick 内、按此顺序发生。
  why: >
    若 onSelect 打开一个 Dialog，Dialog 挂载时的 "snapshot previously-focused
    element" effect 必须看到 trigger 是 document.activeElement；任何延迟路径
    （queueMicrotask 等）会让 Dialog 快照到即将卸载的 menuitem，关闭时 restore
    指向已脱离 DOM 的节点而静默 noop，焦点落到 <body>。源码标注 LOAD-BEARING。
  source: web/src/ui/Menu/Menu.tsx:39-59,122-140
  authoritative_test: web/src/ui/Menu/Menu.contract.test.tsx:122
  owner_slice: ui/menu
  intentional_omission: false
  runtime_layer: ui
  verification_owner: unit
  test_tier: browser
  migration: pending

- id: INV-UI-DIALOG-003
  kind: invariant
  family: dialog-effect-order
  statement: >
    Dialog 的 Esc/scroll-lock effect 与 initial-focus/restore effect 必须保持
    拆分，focus effect 的依赖不得包含 `view`。
  why: >
    focus effect 若随 view 变化重跑，用户每次 pushView 都会被抢走焦点。源码注释
    明确："We split this from the Esc effect so the dependencies stay minimal —
    re-running this on every `view` change would yank focus around"。
  source: web/src/ui/Dialog/Dialog.tsx:226-235,281
  authoritative_test: NONE
  owner_slice: ui/dialog
  intentional_omission: false
  runtime_layer: ui
  verification_owner: e2e
  test_tier: browser
  migration: pending

