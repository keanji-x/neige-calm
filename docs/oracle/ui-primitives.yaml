    `role="menuitem"` 必须是 lint 错误。
  why: >
    README Rules 承诺（#60 slice 1）并由自定义规则 `neige-calm/no-raw-primitive-role`
    落地：app 代码必须组合 primitive，让 primitive 独占 role + focus + 键盘契约，
    而不是自己在 div/ul/button 上手糊 ARIA。动态 `role={expr}` 刻意不拦。
  source: web/src/ui/README.md:71-75
