# ===========================================================================
# ConfirmDialog
# ===========================================================================

- id: INV-UI-CONFIRM-064
  kind: invariant
  family: confirm-safety
  statement: >
    ConfirmDialog 打开时默认焦点必须落在 Cancel 按钮上，绝不得落在 Confirm。
  why: >
    源码/README："A user who reflexively hits Enter on the dialog appearing MUST
    NOT trigger the destructive action." 这正是 ConfirmDialog 相对
    `window.confirm()` 的核心价值。
  source: web/src/ui/ConfirmDialog/ConfirmDialog.tsx:6-9,87-96
  authoritative_test: web/src/ui/ConfirmDialog/ConfirmDialog.contract.test.tsx:54
  owner_slice: ui/confirm-dialog
  intentional_omission: false
  runtime_layer: ui
  verification_owner: unit
  test_tier: browser
  migration: pending

- id: INV-UI-CONFIRM-065
  kind: invariant
  family: confirm-safety
  statement: >
    在不 Tab 的前提下连按多次 Enter 必须永远无法触达 `onConfirm`。
  why: >
    契约测试 F 显式连按三次 Enter 断言 onConfirm 从未被调用；这是"手滑连击"
    这一真实破坏场景的兜底。
  source: web/src/ui/ConfirmDialog/ConfirmDialog.tsx:6-9,114-121
  authoritative_test: web/src/ui/ConfirmDialog/ConfirmDialog.contract.test.tsx:220
  owner_slice: ui/confirm-dialog
  intentional_omission: false
  runtime_layer: ui
  verification_owner: unit
  test_tier: jsdom
  migration: pending

- id: INV-UI-CONFIRM-066
  kind: invariant
  family: confirm-safety
  statement: >
    Esc、overlay 点击、header × 与 Cancel 按钮四条 dismiss 路径必须全部路由到
    同一个 `onCancel`；调用方只有一个 dismissal 回调。
  why: >
    源码注释："every non-confirm exit (Esc, overlay click, Cancel button,
    header X) calls onCancel. Call sites get one dismissal callback, not two."
    分叉会让某条路径漏掉清理逻辑。
  source: web/src/ui/ConfirmDialog/ConfirmDialog.tsx:11-16,59-61,91-97,114-121
  authoritative_test: web/src/ui/ConfirmDialog/ConfirmDialog.contract.test.tsx:72,96
  owner_slice: ui/confirm-dialog
  intentional_omission: false
  runtime_layer: ui
  verification_owner: unit
  test_tier: jsdom
  migration: pending

- id: INV-UI-CONFIRM-067
  kind: invariant
  family: confirm-safety
  statement: >
    `confirmDisabled` 只能禁用 Confirm；Cancel 在 pending 期间必须保持可用。
  why: >
    源码注释："Cancel stays enabled — the Cancel-safe default contract continues
    to hold even mid-await."；否则异步 confirm 卡住时用户被困在对话框里。
  source: web/src/ui/ConfirmDialog/ConfirmDialog.tsx:29-37,66-73,114-129
  authoritative_test: web/src/ui/ConfirmDialog/ConfirmDialog.contract.test.tsx:182
  owner_slice: ui/confirm-dialog
  intentional_omission: false
  runtime_layer: ui
  verification_owner: unit
  test_tier: jsdom
  migration: pending

- id: CAP-UI-CONFIRM-068
  kind: capability
  family: confirm-patterns
  statement: >
    ConfirmDialog 必须同时支持 Pattern A（stay-open-while-pending：确认后保持
    挂载 + `confirmDisabled` 防重入）与 Pattern B（close-then-await：确认即关闭，
    父级 promise 带外 resolve）。
  why: >
    README §Adoption 记录了两种已迁移流程：DeleteButton（Cove/Wave 头部）走
    Pattern A；Cove 页内 per-row × 走 Pattern B，"wave row 从列表消失"本身就是
    成功信号。删掉任一模式都会让对应调用方无法表达。
  source: web/src/ui/README.md:192-215
  authoritative_test: web/src/ui/ConfirmDialog/ConfirmDialog.contract.test.tsx:182
  owner_slice: ui/confirm-dialog
  intentional_omission: false
  runtime_layer: ui
  verification_owner: unit
  test_tier: jsdom
  migration: pending

- id: CAP-UI-CONFIRM-069
  kind: capability
  family: confirm-visual
  statement: >
    `destructive` 默认为 true，Confirm 取 `go warn`；`destructive={false}` 时取
    `go`；Cancel 恒为 `go outline`，按钮顺序恒为 Cancel 左、Confirm 右。
  why: >
    README §Visual：右侧是约定的主操作位，配合 warn 配色让破坏性控件"响亮而
    明确"。默认 true 是因为这个 primitive 的存在意义就是破坏性确认。
  source: web/src/ui/ConfirmDialog/ConfirmDialog.tsx:17-20,84,101-129
  authoritative_test: web/src/ui/ConfirmDialog/ConfirmDialog.test.tsx:55,70
  owner_slice: ui/confirm-dialog
  intentional_omission: false
  runtime_layer: ui
  verification_owner: unit
  test_tier: jsdom
  migration: pending

- id: INV-UI-CONFIRM-070
  kind: invariant
  family: confirm-visual
  statement: >
    ConfirmDialog 故意【不】自带 focus trap、Esc 处理、新 CSS 类，也不内置
    spinner / pending 视觉。
  why: >
    源码 "What this primitive deliberately does NOT do" 一节逐条列出：前三项从
    Dialog 继承，pending 视觉留给调用方塞进 `description` 或在旁边组合。
    重复实现会与 Dialog 的契约打架。
  source: web/src/ui/ConfirmDialog/ConfirmDialog.tsx:22-28
  authoritative_test: NONE
  owner_slice: ui/confirm-dialog
  intentional_omission: true
  runtime_layer: ui
  verification_owner: e2e
  test_tier: browser
  migration: pending

- id: GATE-UI-CONFIRM-071
  kind: gate
  family: confirm-adoption
  statement: >
    此后新增的破坏性操作必须使用 ConfirmDialog，不得用 `window.confirm()` 或
    临时内联确认；`confirmDisabled` 是支持异步 confirm 的唯一正规方式。
  why: >
    README §Adoption 明文 MUST："The contract makes Enter-on-open a no-op, which
    window.confirm() does not." 绕过即失去 Cancel-safe 默认焦点保护。
  source: web/src/ui/README.md:185-215
  authoritative_test: NONE
  owner_slice: ui/confirm-dialog
  intentional_omission: false
  runtime_layer: ui
  verification_owner: review-waiver
  test_tier: none
  migration: pending

