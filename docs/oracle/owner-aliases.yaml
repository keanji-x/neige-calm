  # ── 无 owner 的原始值 ────────────────────────────────────
  "NONE": null    # 逐条裁决，见 per_entry

# 别名表无法表达的逐条覆盖（原始值同名但归属不同）
per_entry:
  INV-DEAD-001: "features/wave/page"           # WaveContext 死代码（Wave.tsx）
  INV-DEAD-002: "features/spec/current-run"    # useSpecCurrentRun.latestTool 死字段
  E2E-CAP-KEYBOARD-003: "app/shell/sidebar"    # 是产品能力（侧栏 Tab+Enter），不是 e2e 基建

# 一格填两个值 / 跨 slice：主 owner 进 owner_slice，另一个加注到 why 末尾
split_owners:
  GATE-APP-103:
    primary: "systems/events-transport/stream"
    also: "core/api/unauthorized"
  # owner_slice == "app/router → cards/create" 的 7 条
  GATE-APP-087: { primary: "app/router", also: "systems/cards/create" }
  INV-APP-088:  { primary: "app/router", also: "systems/cards/create" }
  GATE-APP-089: { primary: "app/router", also: "systems/cards/create" }
  INV-APP-090:  { primary: "app/router", also: "systems/cards/create" }
  INV-APP-091:  { primary: "app/router", also: "systems/cards/create" }
  INV-APP-092:  { primary: "app/router", also: "systems/cards/create" }
  INV-APP-093:  { primary: "app/router", also: "systems/cards/create" }

# ============================================================
# 需人工裁决
# ============================================================
# 下列条目已给出「可用的临时归属」（不会阻塞重标），但归属本身有实质性分歧，
# 请在实现阶段前确认。理由与候选层写在每条下面。
#
# 1. "kernel/overlay" (1 条，INV-A11Y-052)
#    临时归属: core/domain/overlay
#    这是 **Rust 内核** 的契约（validate_overlay_payload 的兜底分支），不属于任何 web 层。
#    候选: (a) core/domain/overlay —— 把内核契约视为前端依赖的域边界；
#          (b) 移出本 oracle，进 crates 侧的契约集。
#
# 2. "auth/actor" (1 条，E2E-INV-LIFECYCLE-012)
#    临时归属: features/auth/actor
#    同上：`X-Calm-Actor` 的接受规则由服务端 middleware 强制，前端只是遵守方。
#    候选: (a) features/auth/actor；(b) core/api/actor-header；(c) 移出。
#
# 3. "wave/report" (1) / "wave/backlinks" (1) / "ws/terminal" (2)
#    临时归属: features/report/write · features/report/backlinks · systems/terminal/protocol
#    这四条描述的是 **REST / WS 协议**本身而非前端实现。若后续把「协议契约」独立成
#    core/api 与 core/events-protocol 的子集，应整体搬过去。
#
# 4. "design/color-system" (5 条，color-anchor e2e)
#    临时归属: styles/color-system（runtime_layer=styles）
#    它同时是「设计系统契约」与「e2e 基础设施（color-anchor.html harness）」。
#    候选: (a) styles/color-system —— 契约归设计系统，harness 只是载体（当前选择）；
#          (b) none/e2e/color-anchor —— 按载体归为非运行时。
#
# 5. "web/components" (1 条，INV-A11Y-059「能用真实 button 就用真实 button」)
#    临时归属: ui/activation
#    它是跨切面 a11y 政策，实现散落在 features/wave/row 与 ui/editable-title。
#    候选: (a) ui/activation（新建横切 slice）；(b) none/policy/a11y-doc（当政策文档处理）。
#
# 6. "cards/report" (1 条，INV-CARD-226 excludeReportCards)
#    临时归属: features/report/exclude-cards
#    代码住在 web/src/cards/ 但语义完全是 report 的。
#    候选: (a) features/report/exclude-cards；(b) systems/cards/registry。
