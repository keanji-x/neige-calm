# owner_slice 归一化别名表
#
# 7 个提取 agent 各自命名，产生 148 个 distinct owner_slice 值。
# 本表把这 148 个值映射到规范值 `<layer>/<slice>[/<detail>]`。
#
# layer ∈ core | ui | systems | features | app | styles | none
#   core/     api · domain · schemas · keys · state · markdown · events-protocol
#   ui/       dialog · menu · focus · roving · directory-browser · atoms · …
#   systems/  cards · terminal · wheel · fs-viewers · editor · events-transport
#   features/ wave · cove · today · report · spec · settings · auth
#   app/      router · providers · theme · shell · events-glue · di
#   styles/   全局样式层（tokens / layer-rules / focus-visible / motion / 排版）
#   none/     非运行时层（lint 规则 · CI 闸门 · 构建配置 · e2e 基础设施 · 纯文档政策）
#
# 每条条目的 runtime_layer 直接由规范值的 layer 前缀派生 —— 单一事实来源。
# `shared/` 这个筐已废除，其下 104 条全部重新分配。
# `spec` 是新增 feature（原提取里 78 条 spec 家族无归处）。

aliases:
  # ── core/ ────────────────────────────────────────────────
  "api/onUnauthorized": "core/api/unauthorized"
  "api/wire-types": "core/schemas/wire-types"
  "app/storage-keys": "core/keys/storage"
  "state/persistent": "core/state/persistent"
  "hooks/overlay-state": "core/state/overlay-state"
  "shared/markdown-outline": "core/markdown/outline"
  "shared/markdown-pipeline": "core/markdown/pipeline"
  "shared/issue-url": "core/domain/issue-url"
  "kernel/overlay": "core/domain/overlay"            # 见「需人工裁决」

  # ── ui/ ──────────────────────────────────────────────────
  "ui/dialog": "ui/dialog"
  "web/ui/dialog": "ui/dialog"
  "ui/modal": "ui/dialog/modal"
  "ui/confirm-dialog": "ui/confirm-dialog"
  "shared/confirm-copy": "ui/confirm-dialog/copy"
  "ui/menu": "ui/menu"
  "ui/hooks": "ui/roving"
  "web/hooks/roving-tabindex": "ui/roving"
  "shared/directory-picker": "ui/directory-browser"
  "ui/directory-browser": "ui/directory-browser"
