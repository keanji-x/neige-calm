    合并前 dark 侧存在 72/74/78 三个亮度值散落各处。#137 slice 3b 把整族标准化到 L=74%、
    chroma 0.14、hue 145(success)/25(error)。正则把这个**设计决策**钉死，让两个月后
    "我就把绿色调一点点"必须回来改测试并在 PR 里附上设计讨论链接。
