- id: GATE-TOKENS-007
  kind: gate
  family: tokens-alias
  statement: >
    ALIAS_TOKENS 一律**不得**在 `[data-theme="dark"]` 里被重新声明
  why: >
    别名指向的 positional token 本身已经随主题切换；在 dark 里覆盖别名等于把它重新钉死到
    另一个（多半是过期的）目标上，直接抵消掉 cascade。注释判定这几乎总是复制粘贴 bug，
    要求"大声报错"。
  source: web/src/calm-tokens.test.ts:454-460
  authoritative_test: web/src/calm-tokens.test.ts:462-471
