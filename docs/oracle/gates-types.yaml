- id: GATE-TOKENS-019
  kind: gate
  family: tokens-zindex
  statement: >
    Z_INDEX_TOKENS（--z-base/raised/sticky/overlay/modal/toast）必须是 `:root` 里的裸整数
    字面量（不许 var() 链、不许 calc()），且无 dark 覆盖
  why: >
    z-index 是结构而非视觉，dark 覆盖没有意义。裸整数要求是为了让第 020 条的"严格递增"
    断言能直接 Number() 比较——一旦允许 var()/calc()，顺序不变式就无法机器验证。#165 slice 4。
