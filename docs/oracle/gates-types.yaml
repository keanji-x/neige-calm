- id: GATE-TOKENS-015
  kind: gate
  family: tokens-font
  statement: >
    FONT_ALIAS_TOKENS（--font-display / --font-numeric / --font-code）的值必须是
    `var(--font-sans)` / `var(--font-serif)` / `var(--font-mono)` 三选一，绝不能是硬编码字体栈
  why: >
    这条比通用 VAR_REF 更严：别名只能指向那三个 positional font token，不能指向别的别名。
    positional token 是"具体字体家族"的唯一真源，链式别名会让真源变模糊。#150 slice 2。
