  why: >
    应用代码必须组合 Neige 原语（<Dialog>/<Menu>/<ConfirmDialog>），它们持有 role、
    焦点陷阱、Escape、焦点还原等契约；手搓 role 会把这些契约丢掉。规则是
    web/src/ui/README.md 在 #60 slice 1 里承诺的（"应用代码不用裸 role= 查询原语"）。
    花括号形式必须拦，否则是一个平凡旁路。规则**不可自动修复**：正确修法是换成原语组件，
    props/children/焦点接线全都不同，不是安全的机械变换。
