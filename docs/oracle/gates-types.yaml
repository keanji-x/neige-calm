  family: wire-types
  statement: >
    workspace cargo config 必须设 `TS_RS_LARGE_INT = "number"` —— Rust 的
    i64/u64/i128/u128 映射到 TS `number` 而非 ts-rs 默认的 `bigint`
  why: >
    三方必须一致：(a) 现有 OpenAPI / generated.ts 已经把 Rust i64（created_at、updated_at、
    archived_at）表示成 number；(b) schemas.ts 的运行时 zod 用 `z.number()`；
    (c) 时间戳远小于 Number.MAX_SAFE_INTEGER。注释指明：如果未来某个 i64 字段超出这个假设，
    schemas.test.ts 的一致性测试会抓到，届时改回 bigint 并同步 zod 侧。
  source: .cargo/config.toml:19-25
  authoritative_test: web/src/api/schemas.test.ts:212-224
  owner_slice: none/build/ts-rs
  intentional_omission: false
  runtime_layer: none
  verification_owner: unit
  test_tier: jsdom
  migration: pending

- id: GATE-WIRE-004
  kind: gate
  family: wire-types
  statement: >
    `TS_RS_EXPORT_DIR` 必须是 `{ value = ".", relative = true, force = true }`
  why: >
    默认 `./bindings` 会逼得每个 `#[ts(export_to = ...)]` 写成
    `"../bindings/../../web/..."` 这种鬼样子。`relative = true` 让它相对 config.toml 所在
    目录（= workspace root）解析，与 cargo 的 cwd 无关——这很关键，因为
    `npm run gen:api` 是从 `web/` 目录用 `--manifest-path ../Cargo.toml` 调 cargo 的。
  source: .cargo/config.toml:1-18
  authoritative_test: NONE
  owner_slice: none/build/ts-rs
  intentional_omission: false
  runtime_layer: none
  verification_owner: build
  test_tier: static
  migration: pending

- id: GATE-WIRE-005
  kind: gate
  family: wire-runtime
  statement: >
    未知的 `ev` 字符串必须被 `wireEventSchema.safeParse` 拒绝（success === false）
  why: >
    判别式联合的兜底行为：schema 不能退化成宽松形状，否则新变体和坏 payload 就无从区分。
    测试刻意只断言 issues 非空、不断言具体 issue code（不同 zod 版本会变）。
  source: web/src/api/schemas.ts:1-13
  authoritative_test: web/src/api/schemas.test.ts:91-102
  owner_slice: core/schemas/wire-types
  intentional_omission: false
  runtime_layer: core
  verification_owner: unit
  test_tier: jsdom
  migration: pending

- id: GATE-WIRE-006
  kind: invariant
  family: wire-runtime
  statement: >
    parse 失败时调用方必须 log + skip dispatch，**绝不抛**；带未映射 `ev` 的事件
    进到 dispatch 也不得抛异常
  why: >
    服务端新增一个事件变体不应该让 UI 崩掉。运行时校验的职责是抓**意外**的 payload 形状
    （schema 漂移、灰度发布、坏代理），不是逐字段执法。eventBridge 测试专门守住
    "有值带着未映射的 ev 溜进来时 dispatch 不炸"。
  source: web/src/api/schemas.ts:5-9 ; web/src/app/eventBridge.test.tsx:15-18
  authoritative_test: web/src/app/eventBridge.test.tsx:754-771
  owner_slice: core/schemas/wire-types
  intentional_omission: false
  runtime_layer: core
  verification_owner: unit
  test_tier: jsdom
  migration: pending

- id: GATE-WIRE-007
  kind: gate
  family: wire-compat
  statement: >
    后加的 wire 字段必须在 zod 侧带 `.default(...)`，与 Rust 侧的 `#[serde(default)]`
    对齐，使旧 event-log / replay fixture 无需迁移即可解析
  why: >
    已知的成对默认值：cove.kind → 'user'（#175）、wave.lifecycle → 'draft'（#145，与
    migration 0012 的 DB DEFAULT 一致）、wave.cwd → ''（#250 PR2）、
    wave.workflow_id / purpose / terminal_at → null、wave.workflow_input → null（#891）、
    pinned_at → null。理由一致："不要为了加一个字段就逼所有录制会话重写 fixture"。
    每条默认值都有配对的测试断言旧 payload 解析后拿到那个默认值。
  source: web/src/api/schemas.ts:19-118
  authoritative_test: web/src/api/schemas.test.ts:45-64,146-149,697-713
  owner_slice: core/schemas/wire-types
  intentional_omission: false
  runtime_layer: core
  verification_owner: unit
  test_tier: jsdom
  migration: pending

- id: GATE-WIRE-008
  kind: gate
  family: wire-compat
  statement: >
    每个 wire 变体都要成对测试：一条 happy-path `parse`，一条缺必填字段的
    `safeParse` 必须失败
  why: >
    注释把这条写成了显式的测试约定（#136 PR4："两条一组，每个新变体一个 happy parse
    加一个缺字段 safeParse"）。缺了 reject 那一半，schema 退化成宽松形状时没人会发现。
    覆盖面包括 dispatcher/task 生命周期、proposal 通道（#955）、wave.report_edited（#247，
    含 author 判别式的四个取值 + #955 的 plugin 臂 author_plugin_id）、
    harness transcript 事件、plugin.tool.registered / workflow.registered / forge.issue.read。
