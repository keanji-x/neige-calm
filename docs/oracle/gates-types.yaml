  verification_owner: build
  test_tier: static
  migration: pending

- id: GATE-OVERLAY-002
  kind: gate
  family: overlay-state
  statement: >
    `useOverlayState` 的返回形状必须与 `useState` 元组同构：`[value, setter]`，
    setter 接受值或 `(prev) => next`；**故意不**返回 loading 布尔
  why: >
    调用点要与 useState 可互换，采用成本是一行替换。pending 期用 `default` 值顶上——
    注释原话："调用点看起来就是 useState，没有例外；代价是 query resolve 前多渲染一次
    default，Scope F 的 IndexedDB 回填在热重载时消除这一次。"这是刻意的能力取舍，
    新写的人只会看到"没有 loading 态"而误以为是漏做。
  source: web/src/hooks/useOverlayState.ts:35-45,80-85
  authoritative_test: web/src/hooks/useOverlayState.test-d.ts:35-38
  owner_slice: core/state/overlay-state
  intentional_omission: true
  runtime_layer: core
  verification_owner: build
  test_tier: static
  migration: pending

- id: INV-OVERLAY-001
  former_id: GATE-OVERLAY-003
  kind: invariant
  family: overlay-state
  statement: >
    setter 必须在**同步**路径里完成乐观写入（cancelQueries + setQueryData），
    不能依赖 React Query 的 onMutate
  why: >
    onMutate 跑在 `await cancelQueries` 之后，晚一个 microtask，达不到"调用 setLayout(x)
    后立刻重渲染就能看到 x"的 useState 平价。cancelQueries 先发是为了让迟到的 GET 响应
    不能踩掉乐观写入；两者的竞态顺序都不会产生错值（setQueryData 按时序取胜，
    cancelQueries 只丢在途请求、不丢数据）。
  source: web/src/hooks/useOverlayState.ts:174-201
  authoritative_test: web/src/hooks/useOverlayState.test.tsx:147
  owner_slice: core/state/overlay-state
  intentional_omission: false
  runtime_layer: core
  verification_owner: unit
  test_tier: jsdom
  migration: pending

- id: GATE-OVERLAY-004
  kind: gate
  family: overlay-state
  statement: >
    overlay 的 queryKey 形状必须固定为
    `['overlay', plugin_id, entity_kind, entity_id, kind]`（五元组，'overlay' 打头）
  why: >
    `persistConfig.isPersistableQueryKey` 靠 "'overlay' 前缀 + key.length >= 2" 匹配，
    形状一变，overlay 状态就不再进 IndexedDB、重载后不再存活（Scope F）。
