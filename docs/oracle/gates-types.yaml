- id: GATE-WIRE-004
  kind: gate
  family: wire-types
  statement: >
    `TS_RS_EXPORT_DIR` 必须是 `{ value = ".", relative = true, force = true }`
  why: >
    默认 `./bindings` 会逼得每个 `#[ts(export_to = ...)]` 写成
    `"../bindings/../../web/..."` 这种鬼样子。`relative = true` 让它相对 config.toml 所在
    目录（= workspace root）解析，与 cargo 的 cwd 无关——这很关键，因为
    `npm run gen:api` 是从 `web/` 目录用 `--manifest-path ../Cargo.toml` 调 cargo 的。
  source: .cargo/config.toml:1-18
  authoritative_test: NONE
  owner_slice: none/build/ts-rs
  intentional_omission: false
  runtime_layer: none
  verification_owner: build
  test_tier: static
  migration: pending

- id: GATE-WIRE-009
  kind: gate
  family: wire-compat
  statement: >
    被**改名**的 wire 字段必须留一条**只读、单向**的反序列化兼容读：Rust 侧在被改名的
    字段上加 serde alias 且**保留** serde default；新版 zod 读取器保留
    `normalizeLegacyTemplateKeys`，读入时把旧键搬到新键再交给 schema。
    写口（`CreateTrackRequest`）**不许**带别名——旧拼写在那里必须被 serde 层直接拒掉。
  why: >
    GATE-WIRE-007 只覆盖「后加字段」，改名是它没覆盖的一种情况，而改名的失败方向更隐蔽：
    旧 event-log 行里写的是旧键，新代码找不到新键 ⇒ serde default 静默给出 None，
    replay 出来的 track 丢掉模板归属且**一个错都不报**（#1209 §3.4）。反方向（为了防这个
    而删掉 default）更糟：反序列化直接失败，而 `events_since` 的 Err 分支会**跳过整行**。
    新版 zod 读取器也必须先归一化历史键，再按现行 schema 读取；旧 Web 的读取器已退役。
    写口那侧必须硬失败（deny_unknown_fields ⇒ axum 的 422 extractor rejection，
    #1209 §3.5 预测的是 400，实测是 422，判据不变）：请求是有活人在另一端的活契约，拒绝可观测可修；
    事件日志是不可变历史，拒绝它等于弄坏 replay（#1209 §3.5）。
  source: crates/calm-types/src/model.rs:293-307 ; fe/core/api/schemas.ts:47-65
  authoritative_test: crates/calm-server/tests/cases/event_serde_goldens.rs:184-207 ;
    fe/core/api/schemas.contract.test.ts:874-922
  owner_slice: core/schemas/wire-types
  intentional_omission: false
  runtime_layer: core
  verification_owner: unit
  test_tier: jsdom
  migration: pending

- id: GATE-OWNERSHIP-010
  kind: gate
  family: ownership-authorization
  statement: >
    关联 squash 的最终只读路径必须由实际修改该路径的 source commit trailer 逐路径授权
  why: >
    只验证 source commit 自身并不能证明它授权了最终提交触及的同一条只读路径；
    未绑定到 source changed path 的 trailer 不得被借给 final path。
  source: fe/tools/ownership/validator.ts:233-242
  authoritative_test: fe/tools/ownership/squash.test.ts:118-123
  owner_slice: none/ci
  intentional_omission: false
  runtime_layer: none
  verification_owner: unit
  test_tier: static
  migration: pending
