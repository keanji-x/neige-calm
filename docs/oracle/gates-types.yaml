- id: GATE-TOKENS-006
  kind: gate
  family: tokens-alias
  statement: >
    ALIAS_TOKENS（--surface-paper/-bg/-hover-overlay、--text-label/-meta/-decorative）
    必须在 `:root` 里声明为**裸** `var(--positional)` 引用，不带 fallback
  why: >
    语义别名的价值就是"不硬编码值"。VAR_REF 正则刻意不接受 `var(--x, fallback)` 形式——
    注释说 calm.css 里别名一律是裸形式，出现 fallback 就该有人来看一眼。#137。
  source: web/src/calm-tokens.test.ts:96-107,318-322
  authoritative_test: web/src/calm-tokens.test.ts:335-345
  owner_slice: styles/tokens
  intentional_omission: false
