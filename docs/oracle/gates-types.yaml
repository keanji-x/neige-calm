- id: GATE-TOKENS-001
  kind: gate
  family: tokens-inventory
  statement: >
    calm.css 的 token 清单必须以手写常量数组的形式钉死在 calm-tokens.test.ts 里；
    新增 / 重命名 / 删除任何 token 必须在同一个 commit 里改这些数组
  why: >
    文件头注释明确写了：数据驱动检测（"找出所有 --surface-* 再推断哪些是 alias"）
    被**刻意否决**。整份 spec 的目的就是让"我们现在有哪些 token"变成一个可 review
    的 diff——加 token 的人和 reviewer 同时看到两半。#142 slice 2。
  source: web/src/calm-tokens.test.ts:35-60
  authoritative_test: web/src/calm-tokens.test.ts:47-267
  owner_slice: styles/tokens
  intentional_omission: false
  runtime_layer: styles
  verification_owner: css
  test_tier: static
  migration: pending

- id: GATE-TOKENS-002
  kind: gate
  family: tokens-positional
  statement: >
    POSITIONAL_TOKENS（--bg/--paper/--hairline/--hairline-strong/--text{,-2,-3,-4}/
    --accent{,-soft}/--warn{,-soft}）必须同时声明在 `:root` 和 `[data-theme="dark"]`
  why: >
    positional token 是颜色词汇的底座，随主题切换。少了 dark 一侧不会报错，只会在
    暗色模式下静默继承亮色值。#137。
  source: web/src/calm-tokens.test.ts:45-60
  authoritative_test: web/src/calm-tokens.test.ts:363-375
  owner_slice: styles/tokens
  intentional_omission: false
  runtime_layer: styles
  verification_owner: css
  test_tier: static
  migration: pending

- id: GATE-TOKENS-003
  kind: gate
  family: tokens-surface
  statement: >
    CONCRETE_SURFACE_TOKENS（--surface-rail/-card/-chip/-toggle-overlay/-panel-head）
    在 `:root` 和 dark 两侧都必须是 `oklch(...)` 字面量，不得写成 var() 别名
  why: >
    具体 surface 与 alias surface 同处 `--surface-*` 命名空间，唯一区分就是值的形状。
    "在 dark 里把它 alias 成 var()" 是最典型的复制粘贴回归，形状断言是唯一能抓住它的东西。
  source: web/src/calm-tokens.test.ts:62-70
  authoritative_test: web/src/calm-tokens.test.ts:381-398
