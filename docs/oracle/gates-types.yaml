- id: GATE-TOKENS-021
  kind: gate
  family: tokens-font
  statement: >
    `font-stack.ts` 的 `MONO_STACK` 常量必须与 calm.css `:root` 里的 `--font-mono`
    **逐字节相同**（trim 后严格相等，不做任何模糊归一化）
  why: >
    xterm.js 读不到 CSS 自定义属性（容器进 DOM 之前就要字体串），fallback 卡片也用内联样式，
    所以 JS 侧必须有一份钉死的常量。两边不一致会让终端和 UI 其余部分静默落到不同的系统等宽
    字体上——review 里永远发现不了。断言刻意是严格字符串比较：`"SF Mono"` 带不带引号对浏览器
    字体解析器是真有区别的。#150 slice 3。
  source: web/src/font-stack.ts:1-20 ; web/src/calm.css:12
  authoritative_test: web/src/calm-tokens.test.ts:1160-1166
  owner_slice: styles/tokens
  intentional_omission: false
  runtime_layer: styles
  verification_owner: css
  test_tier: static
  migration: pending

