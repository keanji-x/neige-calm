# ===========================================================================
# 四、Persistent<T> —— 两层闸门（类型层是硬的，lint 层是可读的）
# ===========================================================================

- id: GATE-STATE-001
  kind: gate
  family: persistent-brand
  statement: >
    `@/shared/state` 的 useState / useReducer 在状态类型 extends `Persistent<unknown>`
    时，返回类型必须塌成 `never` —— 这是硬闸门，调用点直接 type-check 失败
  why: >
    这是三层防线里唯一**真正**拦得住的一层（另两层是 no-restricted-imports 和 eslint 规则）。
    Persistent<T> 标记的值必须经 useOverlayState 存到服务端；误落进 useState 会造成静默回归：
    值只活在组件内存里，remount/reload 就丢，把加 brand 的意义整个抹掉。
    典型报错形态是解构元组时的 "Property '0' does not exist on type 'never'"。
    文件头原话："Future readers: do not collapse this file."
  source: web/src/shared/state.ts:1-31,73-107
  authoritative_test: web/src/shared/state.test-d.ts:29-40
  owner_slice: core/state/persistent
  intentional_omission: false
  runtime_layer: core
  verification_owner: build
  test_tier: static
  migration: pending

- id: GATE-STATE-002
  kind: invariant
  family: persistent-brand
  statement: >
    条件类型必须写成单元素元组形式 `[T] extends [Persistent<unknown>]`，禁止裸
    `T extends Persistent<unknown>`
  why: >
    裸写法会在联合类型上**分发**：`useState<boolean | null>(null)` 会对每个成员各求一次
    条件，得到三个不同 Dispatch 的交集，setter 调用直接坏掉。元组包裹强制整体求值一次。
  source: web/src/shared/state.ts:66-78,99-107
  authoritative_test: web/src/shared/state.test-d.ts:22-27
  owner_slice: core/state/persistent
  intentional_omission: false
  runtime_layer: core
  verification_owner: build
  test_tier: static
  migration: pending

- id: GATE-STATE-003
  kind: invariant
  family: persistent-brand
  statement: >
    `Persistent<T>` 是纯编译期虚构（unique symbol 幻影属性），运行时与 T 结构完全相同；
    shadow 的 useState/useReducer 运行时必须是对 React 原函数的裸转发，零开销
  why: >
    brand 在运行时不存在，任何试图在运行时检查 brand 的代码都是错的。转发实现刻意
    `as unknown as` 而非 `as any`，避免未收窄的函数体把弱类型往外扩散。
  source: web/src/shared/state.ts:41-51,79-84,108-118
  authoritative_test: web/src/shared/state.test-d.ts:16-20
