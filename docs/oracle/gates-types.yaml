- id: INV-OVERLAY-002
  former_id: GATE-OVERLAY-005
  kind: invariant
  family: overlay-state
  statement: >
    POST 失败时必须把 query 数据回滚到调用 mutate 之前同步捕获的 previous 快照
  why: >
    乐观值是在 setter 里同步写下去的，失败不回滚 UI 就会一直显示一次从未落地的写入。
    快照通过 mutation variables 传递而不是闭包 ref，注释理由："能白拿 RQ 的
    onError/onSuccess 接线，且每次调用的回滚在结构上局部于调用点。"
    错误目前只 console.error，无 toast —— 后续 Scope 才接通知 UI。
