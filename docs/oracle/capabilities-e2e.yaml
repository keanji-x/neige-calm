- id: CAP-TRACKWORKSPACE-003
  kind: capability
  family: track-workspace
  statement: >
    The new-track page must open `DirectoryBrowser` inside a modal `Dialog` and must render no
    browser inline; every other surface that can show a directory picker is registered, with how
    it hosts one, in `directory-picker-hosts`.
  why: >
    The guarantee is the modal, not the component that opens it, and #1211 is why the difference
    matters. `DirectoryField` chooses its behaviour by asking `useDialogView()` whether a dialog
    is above it: inside one it pushes a child view, and outside one it silently falls back to
    rendering the browser *inline*. When the new-track form moved from a dialog onto a route that
    fallback fired, and the picker became a file list unrolled under a chip — no focus trap, no
    Escape, no click-outside. An invariant naming `DirectoryField` could not catch that, because
    the control was still `DirectoryField`; one naming the modal does.
    The earlier statement's "rather than opening a second dialog" was the *nesting* hazard from
    E2E-CAP-TRACKCREATE-014, and it is scoped to a form that is itself inside a dialog: there the
    second dialog would fight the outer one's focus trap. On a route there is no outer dialog, so
    the hazard is absent and the prohibition was over-wide. Nesting is still forbidden where it
    can occur, and that half is now stated on its own carrier: CAP-TRACKWORKSPACE-006.
    The first draft of this row replaced it with "no surface may render the browser inline",
    which is a universal negative carried by a test that renders one component — it would have
    said nothing about the next call site to take the fallback, i.e. exactly the failure it was
    written for. Dual-channel review rejected it. The quantified half is therefore carried by a
    fail-closed sweep instead (`tools/architecture/directory-picker-hosts.mjs`, wired into
    `lint:depcruise`): every file rendering `DirectoryField` or `DirectoryBrowser` must be
    registered with how it hosts the picker, so an unregistered call site is red before anyone
    reads a test. This row keeps only what its own test can falsify.
