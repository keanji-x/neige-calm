- id: E2E-INV-INFRA-019
  kind: invariant
  family: seed-helpers
  statement: >
    The shared seed helper `createTrackInArea` posts every track it mints through one body
    literal — `area_id`, `title`, `cwd`, `attach_folder`, and an inert dark theme sentinel —
    so every caller of this helper sends exactly that key set, and no caller can vary it.
  why: >
    #250 PR2 put cwd into this body (since #1131 the server takes it as optional); #177 made
    theme required end-to-end. Funnelling this helper's
    callers through one literal is what keeps the shared seed path from drifting away from the
    server's accepted body. Scope is exactly this helper: tests that inline their own
    `POST /api/tracks` body (terminal-clean-exit, wheel-mode-edge, new-terminal-card and others)
    do not go through it, and this entry does not claim anything about them. The server-side
    contract itself (a body missing theme is rejected 422) is
    a Rust-side fact proven by crates/calm-server/tests/cases/theme_required.rs and has no
    oracle entry of its own; this entry deliberately does not claim it, because nothing in
    the cited TypeScript can witness a rejection.
    #1148 第三轮:两处据实收口。(a) 原 `authoritative_test` 指的 reset.ts:105 是 helper 自己的
    `request.post`,既不是 `it` 也没有断言,按 SCHEMA.md:15「无测试写 NONE」改为 NONE。
    (b) statement 原来枚举 `area_id`/`cwd`/`attach_folder`/theme 四个键、并声称「no caller can
    seed a track that omits a field the kernel requires」,两头都不准:`title`(reset.ts:108 实际有传)
    是服务端必填却没被枚举,而 `cwd` 自 #1131 起在 `crates/calm-server/src/routes/tracks.rs:195-214`
    是 `Option<String>`(可选)。现在枚举补上 `title`,并把断言收回到本条真正的载体 —— helper body
    字面量的形状本身;kernel 的必填集是服务端契约,这段 TypeScript 见证不了,另开 issue 立条目。
  source: web/e2e/helpers/reset.ts:88-93,101-112
  authoritative_test: NONE
  owner_slice: features/track/create
  intentional_omission: false
  runtime_layer: features
  verification_owner: e2e
  test_tier: browser
  migration: pending

