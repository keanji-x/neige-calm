- id: INV-TRACKNAME-013
  kind: invariant
  family: track-rename
  statement: >
    On the rewrite's track page, committing an empty title is a request and not a cancel: the page
    passes `emptyCommit` "clear" and a PATCH carrying the empty title leaves. The area header
    keeps the primitive's "cancel" default, and an already-blank title stays a no-op on both.
  why: >
    A track has a second namer — the planner agent's `calm.track.rename`, which succeeds only while the
    title is empty (#1211 S3) — so clearing the name is how a reader hands naming back to it, and
    swallowing the keystroke leaves "I cleared it, pressed Enter, and nothing happened". An area has
    no such agent, so the same gesture there must stay write-free: this is why the semantics is an
    explicit per-caller prop and not the shared primitive's default. The already-blank case is
    arithmetic, not policy — there is no state change to request.
    The legacy front-end's opposite rule is E2E-INV-RENAME-009 above.
  source: fe/web/src/ui/editable-title/public.tsx:15,51-57; fe/web/src/features/track/page/public.tsx:238-240
  authoritative_test: fe/web/src/app/router/track-untitled.test.tsx:270
  owner_slice: ui/editable-title
  intentional_omission: false
  runtime_layer: ui
  verification_owner: unit
  test_tier: jsdom
  migration: migrated

- id: INV-TRACKNAME-014
  kind: invariant
  family: track-rename
  statement: >
    `EditableTitle` must keep the displayed stand-in and the edited value in separate carriers:
    `placeholder` is what read mode shows for a blank name, `value` is what the editor opens on.
    The track header therefore passes the raw title, never `trackDisplayTitle`'s fallback.
  why: >
    While one prop did both, the track page fed it the display fallback, so opening the rename box
    on an unnamed track put "Untitled track" in the box and the reader had to delete it before
    typing. It could not be *stored* — resubmitting it hit the unchanged-value arm and wrote
    nothing — so the defect is the text in the box, not a write, and a fix aimed at persistence
    would have been aimed at nothing.
  source: fe/web/src/ui/editable-title/public.tsx:9-13,85-87; fe/web/src/features/track/page/public.tsx:238-240
  authoritative_test: fe/web/src/features/track/page/public.contract.test.tsx:117
  owner_slice: ui/editable-title
  intentional_omission: false
  runtime_layer: ui
  verification_owner: unit
  test_tier: jsdom
  migration: migrated

- id: CAP-TRACKNAME-015
  kind: capability
  family: track-rename
  statement: >
    Creating a track must land the reader in its planner conversation with the caret in the composer:
    the create site marks the navigation it makes (`go({ openPlanner: true })`), the track route consumes
    that mark the first time its body mounts — striking it off unconditionally, and opening the
    planner card in the same pass when the detail in hand has one — and the composer takes focus
    through `focusOnMount`. The mark belongs to that one history entry and to nothing else: no
    other route may read or clear it, that first mount strikes it off whether or not anything was
    opened, and an entry whose body never mounted keeps it — so
    displaying that same entry again (a reload, the error box's Retry, or the Back button) arms it
    again, while any fresh navigation to the track is a new entry and carries no mark.
  why: >
    The track arrives with no name, and the sentence that created it was delivered into that
    conversation by the create itself (#1299), so a shut drawer hides both the thread the reader's
    intent is in and the place its answer arrives. It cannot be stated as a
    card id — `POST /api/tracks` answers with a Track and the planner card's id only exists once the
    detail has landed, and widening the create response to carry it would tie the create contract
    to what a planner card looks like, which #1189 is still moving. It is carried by the navigation
    rather than in a provider because a global slot has no owner: the create runs from the rail
    with another track still mounted, so that track's route body can read and clear a request
    addressed to a different one, while a body that clears only its own leaves the request
    standing when the landing never happens (a failed detail read is enough) and springs the
    drawer open on an unrelated visit later. Being per-entry is also what decides the returning
    reader: the entry, not a span of attention, is the owner, so a mark that was never redeemed is
    still on its entry when it is shown again — which is what makes a reload or a Retry after a
    failed landing complete the create the reader asked for, and what makes Back to that same
    entry do the same thing. The last is the price of the first, and both are pinned rather than
    left to be discovered.
  source: fe/web/src/app/router/navigation.ts:22,33-38,78-92,112-134;
    fe/web/src/app/router/new-track-route.tsx:63; fe/web/src/app/router/public.tsx:1390,1980-1986;
    fe/web/src/features/chat/thread/public.tsx:502-506,517,539,544-563,601-603
  # One line per clause of the statement, because no single case covers it: 205 the landing and the
  # caret, 261 that a fresh navigation carries no mark, 298 that returning by Back to the entry whose
  # landing failed arms it again, 327 that redeeming is one-shot, 355 that the mark is struck off even
  # when there was no card to open.
  authoritative_test: fe/web/src/app/router/track-untitled.test.tsx:166,191,210,233,252
  owner_slice: app/router
  intentional_omission: false
  runtime_layer: app
  verification_owner: unit
  test_tier: jsdom
  migration: migrated

- id: CAP-TRACKRECIPE-001
  kind: capability
  family: track-recipe
  statement: >
    After a recipe is saved, the view must render the body from the server's response, never the
    local draft, and on the create path as much as on the update path. An update reseeds the open
    editor and renders that: `setCurrent(outcome.recipe)`. A create hands the same row up through
    `onCreated`, and `RecipesPage` holds it as `created` and seeds the editor it opens from that
    row — so neither path is waiting on the list refetch to be right.
  why: >
    `PUT /api/track-recipes/{id}` does not store what it was sent. The write boundary
    (`normalize_recipe_body`) re-renders every fence through `render_fence`, drops tombstones and
    normalizes the task privilege fields, so the stored body and the submitted body routinely
    differ. Rendering the draft hides that rewrite until the author next opens the recipe, where it
    reads as their text having been changed behind their back; rendering the response makes it the
    thing they see at the moment it happens. This is the failure an implementation is likeliest to
    have, because it looks correct in every case where the server changed nothing.
  source: fe/web/src/features/report/recipe/public.tsx:56-72,169-173
  authoritative_test: fe/web/src/app/router/recipes-route.test.tsx:176,274,287
  owner_slice: features/report/recipe
  intentional_omission: false
  runtime_layer: features
  verification_owner: unit
  test_tier: jsdom
  migration: migrated

- id: CAP-TRACKRECIPE-002
  kind: capability
  family: track-recipe
  statement: >
    A 409 from the recipe write must keep the author's draft on screen and leave the editor in edit
    mode; the conflict is a `kind: 'conflict'` outcome, never a message the editor parses.
  why: >
    The write is a whole-document PUT gated on `if_revision`, and per-block CAS was rejected in
    design — a recipe has one writer and no partially synced state. What a conflict costs is
    therefore a re-read, and the draft is the only thing in the exchange that exists nowhere else;
    dropping it would turn the cheap failure into an expensive one. Modelled as its own outcome
    because "keep the draft" is a behaviour, and deciding a behaviour by matching an error string
    makes it depend on wording.
  source: fe/web/src/features/report/recipe/public.tsx:20-26,155-161
  authoritative_test: fe/web/src/app/router/recipes-route.test.tsx:192,212
  owner_slice: features/report/recipe
  intentional_omission: false
  runtime_layer: features
  verification_owner: unit
  test_tier: jsdom
  migration: migrated

- id: CAP-TRACKRECIPE-003
  kind: capability
  family: track-recipe
  statement: >
    The New track picker must keep recipe ids and template keys in separate spaces: the selection is
    a tagged `StartingPoint`, a create carries `recipe_id` or `template_id` and never both, and a
    transient recipe selection whose row disappeared falls back to no template rather than resolving
    against the other list. A persisted Area template stays in the template namespace and blocks
    Create until its roster resolves or the reader explicitly chooses another starting point.
  why: >
    The two ids come from two endpoints with no discriminator on either payload, and the kernel
    answers a request naming both with a 400. A bare selection string made both mistakes reachable:
    `templates.find` over it resolves a recipe id that happens to equal a template key, and the
    stale-selection fallback beside it silently promoted a deleted recipe to the identically-keyed
    template — creating a track from something the reader never picked. A same-id recipe likewise
    cannot satisfy an unresolved Area template preference. The tag makes exclusivity a property of
    the submit function's shape rather than a rule it has to remember.
