  kind: invariant
  family: terminal-at
  statement: >
    `terminal_at` must be stamped on entry to a terminal state (done | canceled | failed) and
    stay null on every non-terminal state.
  why: >
    a11y-wave-lifecycle.spec.ts:323-331 — the calendar window query and the UI's terminal-state
    badges read this field.
  source: web/e2e/a11y-wave-lifecycle.spec.ts:323-331
  authoritative_test: web/e2e/a11y-wave-lifecycle.spec.ts:326
