- id: E2E-INV-INFRA-017
  kind: invariant
  family: reset-hook
  statement: >
    `/dev/reset` and every other `/dev/*` hook must be mounted ONLY by the `replay --serve`
    binary, never by production calm-server.
  why: >
    Dev-only by design doc §6.3; these endpoints bypass the actor / lifecycle authorization
    surface. The carrier is Rust: `replay.rs` builds the `/dev/*` sub-router inline and merges it
    only into the `--serve` router, so production `calm-server` (`main.rs`) has no code path that
    can mount it. The former citation, helpers/reset.ts:31-33, only *calls* the endpoint — it
    cannot witness who mounts it, which is the whole claim. Rust carries no TS/CSS anchor, so the
    entry is registered in anchor-unsupported.yaml; authoritative_test is NONE because nothing
    asserts the negative today (it is an architectural fact of where the router is built).
    #1148 第二轮：原来只登记了 dev_routes 的构造，而 statement 的关键词是 ONLY。现在四段合起来
    才让这个词有证据 —— 130-159 是 `--assert` 提前 return、其余路径才进 `run_serve` 的门控，
    241-245 是 `/dev/*` 三条路由的构造，277-284 是它被 merge 进 `--serve` 的 router 的唯一一处，
    main.rs:185-192 是生产 router 的全部 merge 面（其中没有 dev_routes）。#1148 第三轮：再补
    112-115 —— `--serve`/`--assert` 二选一的前置门控（缺任一即 exit 2），是「只有 replay --serve
    这条路径能走到挂载点」的入口证据，此前未登记。
  source: crates/calm-server/src/bin/replay.rs:112-115,130-159,226-245,277-284
    crates/calm-server/src/main.rs:185-192
  authoritative_test: NONE
  owner_slice: none/e2e/infra
  intentional_omission: true
  runtime_layer: none
  verification_owner: e2e
  test_tier: browser
  migration: pending

