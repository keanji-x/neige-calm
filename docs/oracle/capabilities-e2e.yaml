# ── #1211 S2 — a track starts unnamed, and the first sentence is the intent ────
# The legacy rows in this file describe a front-end whose create form *required*
# a sentence and posted it as the title; they stay `pending` and are not
# restated here. What follows is the rewrite's opposite, stated positively.
# INV-TRACKNAME-013 is deliberately the inverse of E2E-INV-RENAME-009 above.

- id: CAP-TRACKNAME-011
  kind: capability
  family: track-rename
  statement: >
    The new-track page must collect no title text — what it does collect is the track's intent, and
    the template's own inputs, such as issue development's Issue URL, are untouched — and its
    `NewTrackDraft` must carry no title key — absence, not the empty string — so the create POST
    omits it and the kernel stores the empty title that `calm.track.rename` is allowed to fill in.
  why: >
    #1211 S1 made the title stop being the track's intent, so a title collected here reaches
    nothing; worse, any non-empty title makes every later planner-agent rename answer
    `already_named`, which would leave S3 dead code. Absence rather than the empty string because
    the two reach the same stored value but say different things about who decided the name, and
    the point of the slice is that this client did not.
    S2 said this of a dialog that collected no text at all; S3 replaced it with a composer, so
    the statement had to move from "collects nothing" to "collects the intent and not a name" —
    which is why the screen half is asserted on a control *named* a title rather than on the
    absence of the one field the page has.
  source: fe/web/src/features/area/new-track/public.tsx:44-52,213-235;
    fe/web/src/app/router/new-track-route.tsx:72-88
  authoritative_test: fe/web/src/features/area/new-track/public.test.tsx:149;
    fe/web/src/app/router/new-track-route.test.tsx:560-572
  owner_slice: features/track/create
