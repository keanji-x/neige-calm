- id: CAP-TRACKNAME-012
  kind: capability
  family: track-rename
  statement: >
    The new-track page must put the caret in its composer on mount, so the first thing typed on
    arrival reaches the field.
  why: >
    #1161 fixed a dialog that opened on its header Close button, where the first space bar threw
    the dialog away; the fix was an `initialFocusRef` aimed at the task input, and S2 re-aimed it
