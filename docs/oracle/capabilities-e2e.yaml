- id: E2E-INV-ENV-001
  kind: invariant
  family: docker-fs
  statement: >
    The kernel's `GET /api/fs/listdir` walks the CONTAINER filesystem; `$HOME` is bind-mounted at
    the same path but `/tmp` is NOT shared.
  why: >
    wave-create-browse-cwd.spec.ts:13-21 — a directory the test mkdirs under /tmp is invisible to
    the kernel, so the picker spec times out hunting an entry that does not exist from the
    kernel's POV. Directory-picker fixtures must live under $HOME.
