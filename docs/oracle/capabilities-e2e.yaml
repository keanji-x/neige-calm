# ── #1211 S2 — a track starts unnamed, and the first sentence is the intent ────
# The legacy rows in this file describe a front-end whose create form *required*
# a sentence and posted it as the title; they stay `pending` and are not
# restated here. What follows is the rewrite's opposite, stated positively.
# INV-TRACKNAME-013 is deliberately the inverse of E2E-INV-RENAME-009 above.

- id: CAP-TRACKNAME-011
  kind: capability
  family: track-rename
  statement: >
    The new-track page must collect no title text — what it does collect is the track's intent, and
    the template's own inputs, such as issue development's Issue URL, are untouched — and its
    `NewTrackDraft` must carry no title key — absence, not the empty string — so the create POST
    omits it and the kernel stores the empty title that `calm.track.rename` is allowed to fill in.
  why: >
    #1211 S1 made the title stop being the track's intent, so a title collected here reaches
    nothing; worse, any non-empty title makes every later planner-agent rename answer
    `already_named`, which would leave S3 dead code. Absence rather than the empty string because
    the two reach the same stored value but say different things about who decided the name, and
    the point of the slice is that this client did not.
    S2 said this of a dialog that collected no text at all; S3 replaced it with a composer, so
    the statement had to move from "collects nothing" to "collects the intent and not a name" —
    which is why the screen half is asserted on a control *named* a title rather than on the
    absence of the one field the page has.
  source: fe/web/src/features/area/new-track/public.tsx:253-275,490-524;
    fe/web/src/app/router/public.tsx:1674-1715
  authoritative_test: fe/web/src/features/area/new-track/public.test.tsx:209;
    fe/web/src/app/router/new-track-route.test.tsx:371
  owner_slice: features/track/create
  intentional_omission: false
  runtime_layer: features
  verification_owner: unit
  test_tier: jsdom
  migration: migrated

- id: CAP-TRACKNAME-012
  kind: capability
  family: track-rename
  statement: >
    The new-track page must put the caret in its composer on mount, so the first thing typed on
    arrival reaches the field.
  why: >
    #1161 fixed a dialog that opened on its header Close button, where the first space bar threw
    the dialog away; the fix was an `initialFocusRef` aimed at the task input, and S2 re-aimed it
    at the Start from trigger when that input was deleted. S3 replaced the dialog with a route, so
    there is no `initialFocusRef` and no Close button to fall onto — but the same defect is still
    reachable by omission, as focus on the document body, and the page exists to be typed into.
    Focus is taken by querying for the `contenteditable` rather than through a ref: astryx's
    `ChatComposerInput` forwards its DOM ref to the *wrapper*, which is not focusable, so a ref
    would silently focus nothing. Asserted as behaviour — type, then read the field back — because
    that is what the reader notices; an `activeElement` check alone passes on a focused wrapper.
  source: fe/web/src/features/area/new-track/public.tsx:398-415
  authoritative_test: fe/web/src/app/router/new-track-route.test.tsx:341
  owner_slice: features/track/create
  intentional_omission: false
  runtime_layer: features
  verification_owner: unit
  test_tier: jsdom
  migration: migrated

- id: INV-TRACKNAME-013
  kind: invariant
  family: track-rename
  statement: >
    On the rewrite's track page, committing an empty title is a request and not a cancel: the page
    passes `emptyCommit` "clear" and a PATCH carrying the empty title leaves. The area header
    keeps the primitive's "cancel" default, and an already-blank title stays a no-op on both.
  why: >
    A track has a second namer — the planner agent's `calm.track.rename`, which succeeds only while the
    title is empty (#1211 S3) — so clearing the name is how a reader hands naming back to it, and
    swallowing the keystroke leaves "I cleared it, pressed Enter, and nothing happened". An area has
    no such agent, so the same gesture there must stay write-free: this is why the semantics is an
    explicit per-caller prop and not the shared primitive's default. The already-blank case is
    arithmetic, not policy — there is no state change to request.
    The legacy front-end's opposite rule is E2E-INV-RENAME-009 above.
  source: fe/web/src/ui/editable-title/public.tsx:36-52,99-113; fe/web/src/features/track/page/public.tsx:293-300
  authoritative_test: fe/web/src/app/router/track-untitled.test.tsx:383
  owner_slice: ui/editable-title
  intentional_omission: false
  runtime_layer: ui
  verification_owner: unit
  test_tier: jsdom
  migration: migrated

- id: INV-TRACKNAME-014
  kind: invariant
  family: track-rename
  statement: >
    `EditableTitle` must keep the displayed stand-in and the edited value in separate carriers:
    `placeholder` is what read mode shows for a blank name, `value` is what the editor opens on.
    The track header therefore passes the raw title, never `trackDisplayTitle`'s fallback.
  why: >
    While one prop did both, the track page fed it the display fallback, so opening the rename box
    on an unnamed track put "Untitled track" in the box and the reader had to delete it before
    typing. It could not be *stored* — resubmitting it hit the unchanged-value arm and wrote
    nothing — so the defect is the text in the box, not a write, and a fix aimed at persistence
    would have been aimed at nothing.
  source: fe/web/src/ui/editable-title/public.tsx:16-46,141-143; fe/web/src/features/track/page/public.tsx:293-300
  authoritative_test: fe/web/src/features/track/page/public.contract.test.tsx:154
  owner_slice: ui/editable-title
  intentional_omission: false
  runtime_layer: ui
  verification_owner: unit
  test_tier: jsdom
  migration: migrated

- id: CAP-TRACKNAME-015
  kind: capability
  family: track-rename
  statement: >
    Creating a track must land the reader in its planner conversation with the caret in the composer:
    the create site marks the navigation it makes (`go({ openPlanner: true })`), the track route consumes
    that mark the first time its body mounts — striking it off unconditionally, and opening the
    planner card in the same pass when the detail in hand has one — and the composer takes focus
    through `focusOnMount`. The mark belongs to that one history entry and to nothing else: no
    other route may read or clear it, that first mount strikes it off whether or not anything was
    opened, and an entry whose body never mounted keeps it — so
    displaying that same entry again (a reload, the error box's Retry, or the Back button) arms it
    again, while any fresh navigation to the track is a new entry and carries no mark.
  why: >
    The track arrives with no name, and the sentence that created it was delivered into that
    conversation by the create itself (#1299), so a shut drawer hides both the thread the reader's
    intent is in and the place its answer arrives. It cannot be stated as a
    card id — `POST /api/tracks` answers with a Track and the planner card's id only exists once the
    detail has landed, and widening the create response to carry it would tie the create contract
    to what a planner card looks like, which #1189 is still moving. It is carried by the navigation
    rather than in a provider because a global slot has no owner: the create runs from the rail
    with another track still mounted, so that track's route body can read and clear a request
    addressed to a different one, while a body that clears only its own leaves the request
    standing when the landing never happens (a failed detail read is enough) and springs the
    drawer open on an unrelated visit later. Being per-entry is also what decides the returning
    reader: the entry, not a span of attention, is the owner, so a mark that was never redeemed is
    still on its entry when it is shown again — which is what makes a reload or a Retry after a
    failed landing complete the create the reader asked for, and what makes Back to that same
    entry do the same thing. The last is the price of the first, and both are pinned rather than
    left to be discovered.
  source: fe/web/src/app/router/navigation.ts:35,63-74,159-170,241-266;
    fe/web/src/app/router/public.tsx:1330-1340,1911,2138-2165;
    fe/web/src/features/chat/thread/public.tsx:1798-1800,1890,1951-1970
  # One line per clause of the statement, because no single case covers it: 205 the landing and the
  # caret, 261 that a fresh navigation carries no mark, 298 that returning by Back to the entry whose
  # landing failed arms it again, 327 that redeeming is one-shot, 355 that the mark is struck off even
  # when there was no card to open.
  authoritative_test: fe/web/src/app/router/track-untitled.test.tsx:205,261,298,327,355
