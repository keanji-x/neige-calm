- id: CAP-TRACKRECIPE-001
  kind: capability
  family: track-recipe
  statement: >
    After a recipe is saved, the view must render the body from the server's response, never the
    local draft, and on the create path as much as on the update path. An update reseeds the open
    editor and renders that: `setCurrent(outcome.recipe)`. A create hands the same row up through
    `onCreated`, and `RecipesPage` holds it as `created` and seeds the editor it opens from that
    row — so neither path is waiting on the list refetch to be right.
  why: >
    `PUT /api/track-recipes/{id}` does not store what it was sent. The write boundary
    (`normalize_recipe_body`) re-renders every fence through `render_fence`, drops tombstones and
    normalizes the task privilege fields, so the stored body and the submitted body routinely
    differ. Rendering the draft hides that rewrite until the author next opens the recipe, where it
    reads as their text having been changed behind their back; rendering the response makes it the
    thing they see at the moment it happens. This is the failure an implementation is likeliest to
    have, because it looks correct in every case where the server changed nothing.
  source: fe/web/src/features/report/recipe/public.tsx:147-180,298-308
  authoritative_test: fe/web/src/app/router/recipes-route.test.tsx:210,343,361
  owner_slice: features/report/recipe
  intentional_omission: false
  runtime_layer: features
  verification_owner: unit
  test_tier: jsdom
  migration: migrated

- id: CAP-TRACKRECIPE-002
  kind: capability
  family: track-recipe
  statement: >
    A 409 from the recipe write must keep the author's draft on screen and leave the editor in edit
    mode; the conflict is a `kind: 'conflict'` outcome, never a message the editor parses.
  why: >
    The write is a whole-document PUT gated on `if_revision`, and per-block CAS was rejected in
    design — a recipe has one writer and no partially synced state. What a conflict costs is
    therefore a re-read, and the draft is the only thing in the exchange that exists nowhere else;
    dropping it would turn the cheap failure into an expensive one. Modelled as its own outcome
    because "keep the draft" is a behaviour, and deciding a behaviour by matching an error string
    makes it depend on wording.
  source: fe/web/src/features/report/recipe/public.tsx:93-99,284-291
  authoritative_test: fe/web/src/app/router/recipes-route.test.tsx:230,258
  owner_slice: features/report/recipe
  intentional_omission: false
  runtime_layer: features
  verification_owner: unit
  test_tier: jsdom
  migration: migrated

- id: CAP-TRACKRECIPE-003
  kind: capability
  family: track-recipe
  statement: >
    The New track picker must keep recipe ids and template keys in separate spaces: the selection is
    a tagged `StartingPoint`, a create carries `recipe_id` or `template_id` and never both, and a
    transient recipe selection whose row disappeared falls back to no template rather than resolving
    against the other list. A persisted Area template stays in the template namespace and blocks
    Create until its roster resolves or the reader explicitly chooses another starting point.
  why: >
    The two ids come from two endpoints with no discriminator on either payload, and the kernel
    answers a request naming both with a 400. A bare selection string made both mistakes reachable:
    `templates.find` over it resolves a recipe id that happens to equal a template key, and the
    stale-selection fallback beside it silently promoted a deleted recipe to the identically-keyed
    template — creating a track from something the reader never picked. A same-id recipe likewise
    cannot satisfy an unresolved Area template preference. The tag makes exclusivity a property of
    the submit function's shape rather than a rule it has to remember.
  source: fe/web/src/features/area/default-pills/public.tsx:23-29,92-105,145-163;
    fe/web/src/features/area/new-track/public.tsx:376-389,417-448,490-524
