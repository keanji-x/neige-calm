#   helper/infra files read: helpers/{lifecycle,reset,spec-chat,trace}.ts,
#                            _setup/{replay-server.setup,replay-server.shared,replay-server.teardown}.ts,
#                            playwright.config.ts, e2e/README.md
#   entries: 258 total — 129 capability, 118 invariant, 11 gate
#     (the invariant share is high because e2e specs are overwhelmingly written as regression
#      pins against named issues: #56 #133 #135 #142 #175 #177 #182 #250 #269 #288 #290 #304
#      #305 #306 #409 #423 #510 #594 #630 #632 #657 #668 #676 #682 #690 #891)
#   source convention: `source` cites the e2e spec/helper line range that DEFINES and
#     verifies the behaviour (that is the artifact this agent actually read end-to-end).
#     When a spec comment names the production module that implements it, that module is
#     named in `why` so the new frontend knows which file owns the contract.
#   not extracted (pure test-runner plumbing, no user-facing capability):
#     - e2e/__snapshots__/color-anchor-baseline.md (regenerated artifact, not diffed)
#     - e2e/fixtures/test-tui-theme.py (python PTY fixture; its CONTRACT is captured as
#       E2E-CAP-TERMTHEME-* instead)
#     - e2e/_scroll-probe.spec.ts test BODY: explicitly "investigation only, NOT a CI gate"
#       (underscored + excluded from the chromium project). Its scroll-surface INVENTORY is
#       captured as E2E-CAP-SCROLL-001/002 + E2E-INV-SCROLL-003 (authoritative_test: NONE)
#       because the new fe must still own those surfaces even though nothing gates them today.
#   authoritative_test: NONE appears on 7 entries — behaviours the specs DOCUMENT as
#     deliberately ungated (wave archive UI, cove-folder management UI, the resolve
#     longest-prefix tiebreak, the folder-overlap 409, the dormant-spec-input 409, and the
#     scroll-probe inventory). Each is an intentional scope decision, not an oversight.
#   ONLY-E2E signal: entries whose `why` contains "ONLY e2e" have no unit/vitest counterpart
#     per the spec's own header comment — losing the spec loses the entire safety net.
#     Structurally e2e-only classes (no jsdom equivalent is possible): xterm buffer contents,
#     PTY/OSC theme protocol, wheel routing, CSS geometry/overflow, axe colour contrast,
#     computed color-scheme, focus traps across real Tab, and WS cursor-resync.

