- id: CAP-TRACKWORKSPACE-005
  kind: capability
  family: track-workspace
  statement: >
    A track-create folder clash must be rendered from the structured `FolderConflict` body — the
    path, the owning area's name, and a remedy that differs per conflict kind — never as the bare
    status word, and never as a raw area id.
  why: >
    The 409 body carries no error key, so the generic normaliser in core/api/client.ts leaves
