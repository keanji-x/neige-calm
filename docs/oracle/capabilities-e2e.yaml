- id: CAP-PLANNERQUEUE-001
  kind: capability
  family: input-path
  statement: >
    A message typed during a healthy running or stopping turn must still be posted. After its
    POST is acknowledged, `kernelQueuesInput` classifies its queued echo without letting
    `hasUnreconciledSend` lock the composer. Pending, rejected, or uncertain submissions must not
    claim to be queued. A known wedged harness blocks new submissions and offers recovery while
    retaining existing words; queued entries must no longer promise delivery from that harness.
  why: >
    `POST /planner/input` never reads the phase: it folds the text into the harness pending queue
    and `can_issue_turn()` (`harness/state.rs`) starts a turn only from `Idle`/`TurnCompleted`.
    Two client-side beliefs about that fact can each kill the conversation. Refusing to send while
    a turn runs discarded the message in silence (#1505's original symptom: the composer's guard
    returned before `onSend` and before the draft was cleared). Sending it but recording it as
    issued is worse, because a queued message writes no persisted transcript row until the queue drains
    (`should_persist_item_method` persists `item/started` / `item/completed` only), so the echo
    waits for a row that cannot arrive and the composer is dead for the rest of the turn.
    The criterion therefore has to be the kernel's own two-name whitelist and not a front-end
    notion of "busy": `working` (`issuing_turn || turn_running`) omits four queueing phases, and
    the composer sends in one of them (`issuing_interrupt`) because `stopShown` is
    `working || stopping`.
    A phase of `wedged` is the explicit #1500 recovery exception: its queue never drains,
    so accepting more words there would create an unrecoverable wait. A failed request's text
    remains recovery evidence rather than an acknowledged queue entry.
    The new front end's counterpart to the legacy `E2E-CAP-SPECCHAT-012` (`You · queued`), which
    stays `migration: pending` against `web/e2e`.
  source: fe/web/src/app/router/public.tsx:405-418,480-487,498-501,609-616
  # A table over the whole phase enum: for each of the eight, whether the marker appears, whether
  # the composer stays open, and whether a second message can be sent. The predicate itself is
  # tabulated a second time at the platform-independent tier
  # (`fe/core/domain/conversation.test.ts`, `describe('kernelQueuesInput')`), which is not cited
  # here because a row declares one `test_tier` and that suite is not jsdom.
  authoritative_test: fe/web/src/app/router/planner-conversation.test.tsx:1004-1055;
    fe/web/src/app/router/track-conversation.test.tsx:749-829,1015-1057
  owner_slice: app/router
  intentional_omission: false
  runtime_layer: app
  verification_owner: unit
  test_tier: jsdom
  migration: migrated

- id: CAP-TRACKWORKSPACE-002
  kind: capability
  family: track-workspace
  statement: >
    Choosing a folder must post its absolute cwd together with `attach_folder` true; the flag may
    not be omitted, and no `areas/resolve` pre-flight may decide it.
  why: >
    With the flag omitted the kernel refuses any path no area has claimed ("is not claimed by any
    area", `routes/tracks.rs`), i.e. exactly the folders a user is likeliest to pick; true is a
    no-op when this area already covers the path (same-area arm), so a second track in one
