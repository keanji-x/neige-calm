- id: E2E-CAP-LIFECYCLE-001
  kind: capability
  family: lifecycle-happy
  statement: >
    A freshly created wave must start in `draft` with `terminal_at: null`, and the full path
    draft → planning → dispatching → working → reviewing → done must be drivable end-to-end.
  why: >
    a11y-wave-lifecycle.spec.ts:74-116 — browser-level counterpart to the Rust unit matrix:
    real REST writes, real event bus, real browser trace, so the assertions prove the WIRE
    contract, not just the in-process state machine.
  source: web/e2e/a11y-wave-lifecycle.spec.ts:74-116
  authoritative_test: web/e2e/a11y-wave-lifecycle.spec.ts:74
  owner_slice: features/wave/lifecycle
  intentional_omission: false
  runtime_layer: features
  verification_owner: e2e
  test_tier: browser
  migration: pending

- id: E2E-INV-LIFECYCLE-002
  kind: invariant
  family: lifecycle-actors
  statement: >
    `draft → planning` (kickoff) is the only edge allowed for BOTH User and SpecAgent; every
    edge from planning through done is spec-only.
  why: >
    a11y-wave-lifecycle.spec.ts:82-101 and a11y-wave-lifecycle-rejections.spec.ts:171-175 — the
    validator's edge table is `(allow_user, allow_spec)` per edge; kickoff is the one
    both-allowed row.
  source: web/e2e/a11y-wave-lifecycle.spec.ts:85-102
  authoritative_test: web/e2e/a11y-wave-lifecycle.spec.ts:87
  owner_slice: features/wave/lifecycle
  intentional_omission: false
  runtime_layer: features
  verification_owner: e2e
  test_tier: browser
  migration: pending

- id: E2E-INV-LIFECYCLE-003
  kind: invariant
  family: lifecycle-events
  statement: >
    Every accepted lifecycle edge must emit EXACTLY TWO events — a `wave.lifecycle_changed`
    with payload `{id, cove_id, from, to}` AND a paired `wave.updated` carrying the full row.
  why: >
    a11y-wave-lifecycle.spec.ts:310-318,333-342 — `emitted_events` is asserted to be 2 on every
    forced edge; frontend cache invalidation hangs off `wave.updated` while the badge state
    reads `wave.lifecycle_changed`. Missing either leaves the UI stale.
  source: web/e2e/a11y-wave-lifecycle.spec.ts:290-345
  authoritative_test: web/e2e/a11y-wave-lifecycle.spec.ts:316
  owner_slice: features/wave/lifecycle
  intentional_omission: false
  runtime_layer: features
  verification_owner: e2e
  test_tier: browser
  migration: pending

