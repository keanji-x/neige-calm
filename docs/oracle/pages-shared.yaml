- id: INV-REPORT-BLOCKS-004
  kind: invariant
  family: report-blocks
  statement: >
    ReportBlockView 必须是 memo 化的;prose 块内的 H1/H2 id 由 mdast 的 `position.start.offset` 在
    sectionOffsets 数组里的下标决定(reportHeadingId(blockId, index)),不得改用文本 slug。
  why: >
    id 必须与 report-outline.ts 的 deriveOutline 产出的 blockId 逐字节一致,否则大纲链接指向不存在的锚点;
