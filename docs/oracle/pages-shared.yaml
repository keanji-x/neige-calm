# ============================================================
# §1 report 页外壳 —— 三栏 grid / rail / 抽屉 / 活动面板
# ============================================================

- id: INV-REPORT-SHELL-001
  kind: invariant
  family: report-shell
  statement: >
    report 页必须是单一 grid 容器的三栏布局(rail | center | drawer),折叠态用
    grid-template-columns 归零而不是卸载节点;抽屉关闭时第三栏宽度为 0 但 SpecConversation 仍挂载。
  why: >
    calm.css 注释与 WaveReportPage 的 `report-page--conversation-open` class 组合表明布局靠列宽过渡
    (transition: grid-template-columns);测试 "opens the drawer without unmounting the report document"
    与 "keeps the draft alive when the drawer closes and reopens" 锁定"持久挂载"语义 —— 卸载会丢草稿。
  source: web/src/calm.css:1704-1726 + web/src/pages/WaveReportPage.tsx:898-905,1055-1070
  authoritative_test: web/src/pages/WaveReportPage.test.tsx:2123
  owner_slice: features/report/shell
  intentional_omission: false
  runtime_layer: features
  verification_owner: unit
  test_tier: browser
  migration: pending

- id: INV-REPORT-SHELL-002
