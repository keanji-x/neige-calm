  statement: >
    tail 抓取必须在返回整页(rows.length === PAGE_LIMIT === 300)时继续抓下一页,直到不满一页为止;
    抓取期间到达的新事件用 tailRefetchQueued 标记,外层 do-while 再跑一轮而不是并发第二次抓取。
  why: >
    "continues fetching the tail after a full asc page of command items" —— 一次工具密集的 turn 能一口气
