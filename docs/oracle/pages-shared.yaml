    播种请求失败必须静默(best-effort),所有闸门保持关闭直到下一次 phase 事件到达。
  why: >
    源码注释:"on failure the gates simply stay closed until the next phase transition arrives."
    fail-open 会让停止按钮对着一个并不在跑的 turn 亮起。
