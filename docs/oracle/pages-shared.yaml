- id: INV-REPORTSOURCE-001
  kind: invariant
  family: report-source
  statement: |
    Track 报告里的 neige://source 引用在桌面和窄视口都可以打开来源详情；正文和表格里的单条引用
    共用 ReportSourceCitation 和 app/router 注入的处理函数。手机来源详情使用全屏页面及返回按钮，
    桌面使用右侧抽屉。Today、Markdown 文件等没有 Track 来源处理函数的宿主仍显示「来源」徽标和标题，
    不渲染没有操作的按钮。
  why: >
    #1706 将手机来源阅读纳入统一页面导航；响应式布局由共享 Drawer 决定，报告正文与表格不重复判断视口。
    #1687 的共用引用渲染保留，缺少来源、读取错误及锚点定位继续由同一个来源详情组件处理。
  source: fe/web/src/app/router/public.tsx:2248,2357,2453; fe/web/src/features/report/source/public.tsx:18-42; fe/web/src/features/report/document/public.tsx:400-407; fe/web/src/features/report/table/public.tsx:20-32
  authoritative_test: fe/web/src/features/report/document/public.test.tsx:214-223; fe/web/src/features/report/table/public.test.tsx:126-135; fe/web/src/app/router/report-source.test.tsx:111-125
  owner_slice: features/report/source
  intentional_omission: false
  runtime_layer: features
  verification_owner: unit
  test_tier: jsdom
  migration: migrated
