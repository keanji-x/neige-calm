- id: INV-DUP-004
  kind: invariant
  family: duplication
  statement: >
    【重复对 4/5】react-markdown 渲染管线存在四处独立配置,必须视为一组:
    (a) WaveReportPage 的扁平正文 —— remarkGfm + reportUrlTransform + ReportLink;
