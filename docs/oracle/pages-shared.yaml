- id: INV-REPORT-LAYOUT-001
  kind: invariant
  family: report-layout
  statement: >
    报告文档容器固定 max-width 748px;标题、署名、重复横幅、空态、以及普通 `.report-block` 一律收窄到 616px
    并 flush-left(共享同一条左边线),只有 `.report-block--breakout` 放宽回 748px。
  why: >
    calm.css 原注释:"One left edge runs the whole page (#960 PR3)… Breakout — not a card border — is what
    marks the figure as a layout event." 这是"用突破而非卡片边框标记 figure"的排版契约。
  source: web/src/calm.css:1896-1906,2151-2166
  authoritative_test: NONE
  owner_slice: features/report/layout
  intentional_omission: false
  runtime_layer: features
  verification_owner: css
  test_tier: static
  migration: pending

