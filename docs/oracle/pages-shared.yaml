  kind: invariant
  family: report-layout
  statement: >
    chart.candles / table / app / task 四种块必须挂 `report-block--breakout`,prose 块不得挂。
  why: >
    dispatcher 里逐 case 手写该 class;prose 走 616px 正文测量,图表类走 748px —— 这是"图/表是版面事件"的实现面。
  source: web/src/pages/report-blocks/index.tsx:113-180
  authoritative_test: web/src/pages/WaveReportPage.test.tsx:752
