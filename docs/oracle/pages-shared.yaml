# Active oracle entries; retired source references are archived in docs/archive/legacy-web-oracle/.
- id: INV-LOGIN-001
  kind: invariant
  family: login
  statement: |
    登录成功后必须整页 reload,而不是就地重发 whoami。
  why: >
    源码注释(#189):"the reload is the simplest path that guarantees every persisted / in-memory cache also gets a
    fresh start under the new identity — matches what the ServerCompatGate's bust path does."
  source: fe/web/src/features/auth/login-page/public.tsx:1-56
  authoritative_test: fe/web/src/features/auth/login-page/public.contract.test.tsx:9-18
  owner_slice: features/auth/login-page
  intentional_omission: true
  runtime_layer: features
  verification_owner: unit
  test_tier: jsdom
  migration: migrated
- id: CAP-LOGIN-002
  kind: capability
  family: login
  statement: >
    login() 返回假值时显示 "Wrong username or password." 并解除提交态;抛异常时显示异常 message (或 "Sign-in failed.");提交中按钮文案变
    "Signing in…" 且禁用。
  why: |
    凭据错(200 + 空结果)与网络/服务器错是两类不同的失败,文案必须区分。
  source: fe/web/src/features/auth/login-page/public.tsx:1-56
  authoritative_test: fe/web/src/features/auth/login-page/public.contract.test.tsx:20-38
  owner_slice: features/auth/login-page
  intentional_omission: false
  runtime_layer: features
  verification_owner: unit
  test_tier: jsdom
  migration: migrated
