    `setPhase(current => current ?? run.phase)`,且组件卸载后不写。
  why: >
    源码注释:"`harness.phase.changed` only reports transitions, so a page opened mid-turn would otherwise
    sit on null"; "An event that lands first wins — it is strictly newer than the snapshot read."
