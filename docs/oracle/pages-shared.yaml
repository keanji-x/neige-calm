  statement: >
    展开态第三栏宽度必须是 396px,rail 必须是 250px,中栏 minmax(0, 1fr) —— 中栏的 min-width 必须为 0。
  why: >
    calm.css 显式写死这三个值;`minmax(0, 1fr)` 而非 `1fr` 是防 grid item 被内容撑破(图表/表格 breakout
    到 748px 时会溢出)。
  source: web/src/calm.css:1710,1721-1725
  authoritative_test: NONE
  owner_slice: features/report/shell
  intentional_omission: false
  runtime_layer: features
  verification_owner: css
  test_tier: static
  migration: pending

