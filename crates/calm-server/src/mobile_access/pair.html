<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>连接 Neige Calm</title>
  <link rel="stylesheet" href="/mobile/pair.css">
  <script type="module" src="/mobile/pair.js"></script>
</head>
<body><main>
  <p class="brand">NEIGE CALM</p>
  <h1>连接你的工作空间</h1>
  <p id="server"></p>
  <p id="status" role="status">正在准备配对…</p>
  <p id="code" aria-label="配对确认码"></p>
  <p id="error" role="alert"></p>
  <button id="connect" type="button" hidden>连接并请求授权</button>
  <p class="hint">请在电脑网页中核对相同的确认码，然后批准这台手机。</p>
</main></body>
</html>
