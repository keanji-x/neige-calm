<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>window-stream dev</title>
<style>
  html, body { margin: 0; height: 100%; background: #202124; color: #ddd; font: 13px system-ui, sans-serif; }
  #bar { height: 24px; line-height: 24px; padding: 0 8px; white-space: nowrap; overflow: hidden; }
  #screen { display: block; max-width: 100vw; max-height: calc(100vh - 24px); outline: none; }
  #screen:focus { box-shadow: 0 0 0 2px #8ab4f8; }
</style>
</head>
<body>
<div id="bar"><span id="status">connecting</span> · <span id="title"></span></div>
<canvas id="screen" tabindex="0" width="1280" height="800"></canvas>
<script>
// Dev harness only (#2530 E1); the Report `window` block replaces it (E3b).
// Protocol: crates/window-stream/PROTOCOL.md.
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const titleEl = document.getElementById('title');
const stats = (window.__stream = { frames: 0, bytes: 0, drawn: 0, hello: null, title: '', closed: false, open: false });
window.__canvas = canvas;

const ws = new WebSocket(`ws://${location.host}/stream`);
ws.binaryType = 'arraybuffer';
ws.onopen = () => { stats.open = true; statusEl.textContent = 'connected'; };
ws.onclose = () => { stats.open = false; statusEl.textContent = stats.closed ? 'window closed' : 'disconnected'; };

let pending = null;
let drawing = false;
function draw() {
  if (drawing || !pending) return;
  const frame = pending;
  pending = null;
  drawing = true;
  createImageBitmap(frame.blob)
    .then((bitmap) => {
      if (canvas.width !== frame.width || canvas.height !== frame.height) {
        canvas.width = frame.width;
        canvas.height = frame.height;
      }
      ctx.drawImage(bitmap, 0, 0);
      bitmap.close();
      stats.drawn++;
    })
    .catch((e) => console.warn('frame decode failed', e))
    .finally(() => { drawing = false; draw(); });
}

ws.onmessage = (event) => {
  if (typeof event.data === 'string') {
    const message = JSON.parse(event.data);
    if (message.type === 'hello') {
      stats.hello = message;
      canvas.width = message.width;
      canvas.height = message.height;
      setTitle(message.title);
    } else if (message.type === 'title') {
      setTitle(message.title);
    } else if (message.type === 'closed') {
      stats.closed = true;
    }
    return;
  }
  const view = new DataView(event.data);
  if (view.getUint8(0) !== 1 || view.getUint8(1) !== 1) return; // version 1, JPEG only
  stats.frames++;
  stats.bytes += event.data.byteLength;
  // Latest wins: a frame that arrives while one is decoding replaces the waiting one.
  pending = {
    width: view.getUint32(4, true),
    height: view.getUint32(8, true),
    blob: new Blob([new Uint8Array(event.data, 12)], { type: 'image/jpeg' }),
  };
  draw();
};

function setTitle(title) {
  stats.title = title;
  titleEl.textContent = title;
}

function send(message) {
  if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(message));
}

// CSS pixels on the scaled canvas -> window pixels.
function windowPoint(event) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (event.clientX - rect.left) * canvas.width / rect.width,
    y: (event.clientY - rect.top) * canvas.height / rect.height,
  };
}

canvas.addEventListener('pointermove', (e) => send({ type: 'pointer', ...windowPoint(e) }));
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  canvas.focus();
  canvas.setPointerCapture(e.pointerId);
  send({ type: 'pointer', ...windowPoint(e) });
  send({ type: 'button', button: e.button, pressed: true });
});
canvas.addEventListener('pointerup', (e) => {
  send({ type: 'pointer', ...windowPoint(e) });
  send({ type: 'button', button: e.button, pressed: false });
});
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const unit = e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? canvas.height : 1;
  send({ type: 'wheel', dx: e.deltaX * unit, dy: e.deltaY * unit });
}, { passive: false });

const down = new Set();
canvas.addEventListener('keydown', (e) => {
  e.preventDefault();
  if (e.repeat) return; // the client repeats held keys itself
  down.add(e.code);
  send({ type: 'key', code: e.code, pressed: true });
});
canvas.addEventListener('keyup', (e) => {
  e.preventDefault();
  down.delete(e.code);
  send({ type: 'key', code: e.code, pressed: false });
});
canvas.addEventListener('blur', () => {
  for (const code of down) send({ type: 'key', code, pressed: false });
  down.clear();
});
</script>
</body>
</html>
