[package]
name = "workspace-runtime"
version = "0.1.0"
edition = "2024"

[features]
default = []
session-executor = []
test-support = []

[dependencies]
calm-types = { path = "../calm-types" }
tracing = "0.1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
workspace = { path = "../workspace" }
calm-session = { path = "../calm-session" }
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
