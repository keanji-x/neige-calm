[package]
name = "sandbox"
version = "0.1.0"
edition = "2024"

# A typed bubblewrap (`bwrap`) policy: what a sandboxed program sees of the
# host. Linux only; it knows nothing about the program it wraps.

[target.'cfg(target_os = "linux")'.dependencies]
thiserror = "2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3"
