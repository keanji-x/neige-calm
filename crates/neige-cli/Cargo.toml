[package]
name = "neige-cli"
version = "0.1.0"
edition = "2024"

# Forwarder over the kernel's per-card MCP UDS (#1801): argv goes to the kernel's
# `neige/cli`, which parses, runs and renders; this binary parses nothing. One
# tokio current-thread runtime and serde_json for the frozen JSON-RPC frames.

[[bin]]
name = "neige"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "io-util", "net"] }
serde_json = "1"

[dev-dependencies]
calm-test-sockets = { path = "../calm-test-sockets" }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    "net",
    "process",
    "time",
    "sync",
] }
serde_json = "1"
