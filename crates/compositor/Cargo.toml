[package]
name = "compositor"
version = "0.1.0"
edition = "2024"

[target.'cfg(target_os = "linux")'.dependencies]
smithay = { version = "0.7.0", default-features = false, features = ["wayland_frontend", "desktop", "renderer_pixman"] }
thiserror = "2"
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Test client: pure-Rust Wayland backend (no libwayland-client), xdg-shell client side.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
tempfile = "3"
# probe example: PNG dumps.
png = "0.18"
