# calm-truth — truth/substrate IO layer for issue #679 PR2.
#
# This crate owns SQLite repositories, migrations, the persistent event log
# entrance, runtime/session storage, and the in-process event bus. It must not
# depend on transport or CLI crates: forbidden direct dependencies are axum,
# ts-rs, and clap. `utoipa` core is schema metadata only; keep it feature-plain.
[package]
name = "calm-truth"
version = "0.1.0"
edition = "2024"
autotests = false

[[test]]
name = "integration_suite"
path = "tests/integration_suite.rs"

[features]
default = []
test-helpers = []

# #1252 S3′ PR-B — the append-seam escape probe.
#
# Enabling this feature compiles `mod append_seam_escape_probe` in
# `src/db/sqlite/events.rs`, whose four functions are deliberate bypasses of the
# `gated::Authorized` capability. Each one MUST fail to compile, with the exact
# diagnostic the CI step asserts.
#
# Consequence, stated plainly: **this crate can never be built with
# `--all-features`**, because that turns these on. The workspace gate commands
# name features explicitly for exactly this reason; `calm-proc-supervisor`'s
# `pgid-escape-probe` has the same shape and the same cost.
#
# **One feature per shape, and that is not tidiness.** The first draft put all
# four behind one feature and only two diagnostics came out: `rustc` aborts
# after type checking, and the struct-expression privacy check (E0451) lives in
# a *later* pass, so the two forging samples compiled silently and a
# single-feature gate would have asserted two codes while believing it asserted
# four. Each shape therefore gets its own feature and its own `cargo check`.
append-seam-escape-probe-retarget = []
append-seam-escape-probe-forge = []
append-seam-escape-probe-functional-update = []
append-seam-escape-probe-ungated-append = []

[dependencies]
calm-types = { path = "../calm-types" }
calm-exec = { path = "../calm-exec" }

async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
utoipa = "5"
tokio = { version = "1", features = ["sync", "time", "fs", "rt"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "macros", "migrate", "chrono", "json"] }

# Existing truth-coupled helpers moved with the SQLite repo. These are not
# transport/API crates and do not pierce the server boundary.
blake3 = "1.8"
dashmap = "6"
futures = "0.3"
hex = "0.4"
rand = "0.8"
sha2 = "0.10"
similar = "2"
subtle = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
proc-macro2 = "1"
syn = { version = "2", features = ["full"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
