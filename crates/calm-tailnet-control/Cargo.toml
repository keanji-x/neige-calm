[package]
name = "calm-tailnet-control"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
calm-types = { path = "../calm-types" }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
