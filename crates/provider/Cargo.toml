[package]
name = "provider"
version = "0.1.0"
edition = "2024"

[features]
default = []
fixtures = []

[dependencies]
calm-types = { path = "../calm-types" }
calm-exec = { path = "../calm-exec" }
calm-session = { path = "../calm-session" }

async-trait = "0.1"
tokio = { version = "1", features = ["sync", "fs", "rt", "io-util", "net", "time"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
futures-util = "0.3"
tokio-tungstenite = "0.24"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
tempfile = "3"
