[package]
name = "plugin-runtime"
version = "0.1.0"
edition = "2024"

[features]
default = []
test-support = []

[dependencies]
calm-types = { path = "../calm-types" }
chrono = "0.4"
hex = "0.4"
rand = "0.8"
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
utoipa = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["signal"] }

[dev-dependencies]
futures-util = "0.3"
calm-test-sockets = { path = "../calm-test-sockets" }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
