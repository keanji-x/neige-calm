# calm-exec — execution contracts (issue #679, PR1).
#
# IO-free contracts: WorkerProvider, the observation sink (kernel→agent
# delivery), and passive worker-flow capture into the read model.
#
# HARD RULE: depends only on calm-types (+ async-trait for runtime-agnostic
# async traits). NO sqlx, NO axum, NO tokio — this is the compile firewall
# between the kernel and the providers.
[package]
name = "calm-exec"
version = "0.1.0"
edition = "2024"
autotests = false

[[test]]
name = "integration_suite"
path = "tests/integration_suite.rs"

[dependencies]
calm-types = { path = "../calm-types" }

# Runtime-agnostic async trait methods. async-trait boxes the futures and
# carries no executor — the issue's "no tokio" rule explicitly allows it.
async-trait = "0.1"

[dev-dependencies]
calm-truth-test-harness = { path = "../calm-truth-test-harness" }

tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
