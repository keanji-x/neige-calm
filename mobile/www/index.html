<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Neige · 连接工作区</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
  <script type="module" src="./scanner.js"></script>
</head>
<body>
<main>
  <header class="topbar"><img src="./neige-mark.svg" alt="Neige" width="26" height="26"></header>
  <section class="hero" aria-labelledby="welcome-title">
    <div class="connection-art" aria-hidden="true">
      <div class="orbit orbit-one"></div><div class="orbit orbit-two"></div>
      <div class="device desktop"><svg viewBox="0 0 48 48"><rect x="8" y="9" width="32" height="23" rx="4"/><path d="M18 39h12M24 33v6"/><path class="accent-stroke" d="m19 20 4 4 7-8"/></svg></div>
      <div class="connection-line"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="device phone"><svg viewBox="0 0 40 48"><rect x="9" y="5" width="22" height="38" rx="5"/><path d="M17 10h6M18 37h4"/></svg></div>
      <span class="art-star star-one">✦</span><span class="art-star star-two">✧</span>
    </div>
    <h1 id="welcome-title">回到你的<br><span>专注空间。</span></h1>
  </section>
  <div id="connection-status" class="connection-status sr-only" role="status"><span class="status-dot"></span><span id="status-text">正在恢复连接…</span></div>
  <section class="actions" aria-label="连接工作区">
    <button id="login" class="action action-login" type="button">
      <span class="action-icon tailscale-icon" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
      <span class="action-copy"><strong id="login-label">登录 Tailscale</strong></span>
      <span class="action-arrow" aria-hidden="true">↗</span>
    </button>
    <button id="scan" class="action action-scan" type="button" disabled>
      <span class="action-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/><path d="M7 7h3v3H7zM14 7h3v3h-3zM7 14h3v3H7zM14 14h3v3h-3z"/></svg></span>
      <span class="action-copy"><strong>扫码授权</strong></span>
      <span class="action-arrow" aria-hidden="true">→</span>
    </button>
  </section>
  <p id="error" role="alert"></p>
  <p id="scan-error" role="alert"></p>
  <section id="pair-confirm" hidden aria-label="确认配对服务器" class="pair-confirm">
    <p>授权连接到 <strong id="pair-host"></strong></p>
    <button id="pair-connect" type="button" class="confirm-button">继续配对</button>
    <button id="pair-cancel" type="button" class="text-button">取消</button>
  </section>
  <button id="cancel-scan" type="button" class="confirm-button" hidden>取消扫码</button>
</main>
</body>
</html>
