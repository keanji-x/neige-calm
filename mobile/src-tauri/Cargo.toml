[package]
name = "neige-calm-mobile"
version = "0.1.0"
description = "Android client for the Neige Calm Next workspace"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }

# The Android shell does not build the Linux server workspace.
[workspace]

[profile.dev]
debug = 1
incremental = false
