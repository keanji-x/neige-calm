# Runtime-only docker stack: binaries + frontend bundles are built on the host; the containers just run them.
# Quick start: scripts/docker-up.sh (builds binary + web, then `up -d`), then open http://localhost:8080/
# Override ports / mounts via .env (see .env.example).

services:
  server:
    # Host is Debian bookworm + glibc 2.36; this slim-based image matches so the native binary just runs.
    build:
      context: .
      dockerfile: docker/Dockerfile.server
      args:
        http_proxy: ${CALM_BUILD_HTTP_PROXY:-}
        https_proxy: ${CALM_BUILD_HTTPS_PROXY:-}
        no_proxy: ${CALM_BUILD_NO_PROXY:-}
    image: neige-calm-server:local
    init: true
    # Codex wraps every local_shell tool call in bubblewrap; this near-privileged relaxation lets bwrap
    # build its user namespace + chroot inside the container. Dev-only, NOT for production.
    cap_add:
      - SYS_ADMIN
      - SYS_CHROOT
      - SETUID
      - SETGID
      - SYS_PTRACE
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    # Let the container and child processes reach host services such as the
    # developer's HTTP proxy via host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Run as the host user so files written under $HOME keep correct
    # ownership when you read them back from the host.
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: ${HOME}
    environment:
      HOME: ${HOME}
      USER: ${USER:-calm}
      # Internal-only API port; only nginx publishes CALM_PORT.
      CALM_LISTEN: ${CALM_LISTEN:-0.0.0.0:4041}
      # Dev state is isolated on a tmpfs so docker dev does not share DBs, sockets or codex homes with other dev runs.
      CALM_DB_URL: ${CALM_DB_URL:-sqlite:///var/lib/neige-calm/calm.db?mode=rwc}
      CALM_DATA_DIR: ${CALM_DATA_DIR:-/var/lib/neige-calm/data}
      CALM_PLUGINS_DATA_DIR: ${CALM_PLUGINS_DATA_DIR:-/var/lib/neige-calm/plugins-data}
      CALM_ALLOWED_ORIGIN: http://localhost:${CALM_PORT:-4041}
      # `CALM_DEV_AUTOLOGIN` defaults to `false` so this stack on an exposed origin does NOT silently
      # disable the login gate; dev default credentials are `owner` / `dev`.
      CALM_DEV_AUTOLOGIN: ${CALM_DEV_AUTOLOGIN:-false}
      CALM_AUTH_USERNAME: ${CALM_AUTH_USERNAME:-owner}
      CALM_AUTH_PASSWORD: ${CALM_AUTH_PASSWORD:-dev}
      RUST_LOG: ${RUST_LOG:-info,calm_server=debug}
      # Codex CLI binary, bind-mounted as /usr/local/bin/codex (see volumes below).
      CALM_CODEX_BIN: ${CALM_CODEX_BIN:-codex}
      # In bridge networking, 127.0.0.1 is the server container, so the default proxy points at the host
      # gateway alias (served by the `calm-proxy-forwarder` container). NO_PROXY keeps loopback traffic off the proxy.
      HTTP_PROXY: ${CALM_CONTAINER_HTTP_PROXY:-http://host.docker.internal:${CALM_FORWARDER_PORT:-2081}}
      HTTPS_PROXY: ${CALM_CONTAINER_HTTPS_PROXY:-http://host.docker.internal:${CALM_FORWARDER_PORT:-2081}}
      NO_PROXY: ${CALM_CONTAINER_NO_PROXY:-localhost,127.0.0.1,::1}
      http_proxy: ${CALM_CONTAINER_HTTP_PROXY:-http://host.docker.internal:${CALM_FORWARDER_PORT:-2081}}
      https_proxy: ${CALM_CONTAINER_HTTPS_PROXY:-http://host.docker.internal:${CALM_FORWARDER_PORT:-2081}}
      no_proxy: ${CALM_CONTAINER_NO_PROXY:-localhost,127.0.0.1,::1}
      # Slim image has no CA bundle; codex's rustls TLS client otherwise errors and retries forever.
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_DIR: /etc/ssl/certs
    volumes:
      # Host CA bundle; debian:bookworm-slim ships without ca-certificates.
      - /etc/ssl/certs:/etc/ssl/certs:ro
      # Codex "managed" hooks policy — auto-trusted so we never see the /hooks trust prompt.
      - ./docker/codex-requirements.toml:/etc/codex/requirements.toml:ro
      # The release binaries. Built on the host by `make build`.
      - ${CALM_BIN:-./target/release/calm-server}:/usr/local/bin/calm-server:ro
      # Codex hook bridge; calm-server looks for it next to its own binary.
      - ${CALM_CODEX_BRIDGE_BIN:-./target/release/neige-codex-bridge}:/usr/local/bin/neige-codex-bridge:ro
      # The kernel-as-MCP-server bridge; without this mount the codex MCP client exits with "os error 2" on every card spawn.
      - ${CALM_MCP_SHIM_BIN:-./target/release/neige-mcp-stdio-shim}:/usr/local/bin/neige-mcp-stdio-shim:ro
      # The proc-supervisor calm-server talks to over a control UDS for every terminal spawn.
      - ${CALM_PROC_SUPERVISOR_BIN:-./target/release/calm-proc-supervisor}:/usr/local/bin/calm-proc-supervisor:ro
      # The `neige` CLI, invoked by planner/worker agents from their terminals; must be on PATH.
      - ${CALM_NEIGE_CLI_BIN:-./target/release/neige}:/usr/local/bin/neige:ro
      # Codex CLI package. Both executables are required: current releases defer MCP tools through
      # `codex-code-mode-host`, so mounting `codex` alone makes tool discovery fail inside a conversation.
      - ${CALM_CODEX_HOST_BIN:-/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin/codex}:/usr/local/bin/codex:ro
      - ${CALM_CODEX_CODE_MODE_HOST_BIN:-/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin/codex-code-mode-host}:/usr/local/bin/codex-code-mode-host:ro
      # Host home, same path inside the container; calm-server's data/plugin dirs default under here.
      - ${HOME}:${HOME}
      # The repo lives outside $HOME on this machine with a symlink in $HOME; mount the real path too so
      # the symlink resolves. Safe no-op if you don't have /mnt/data2; change via .env.
      - ${CALM_EXTRA_MOUNT:-/mnt/data2}:${CALM_EXTRA_MOUNT:-/mnt/data2}
    tmpfs:
      # Container-local dev state. The uid/gid options keep it writable while
      # the process still runs as the host user for mounted HOME/repo paths.
      - ${CALM_CONTAINER_STATE_DIR:-/var/lib/neige-calm}:uid=${UID:-1000},gid=${GID:-1000},mode=700
    # No host port mapping: nginx is the only published entrypoint.
    # The supervisor is backgrounded before exec'ing calm-server so the first terminal spawn has someone listening; `init: true` reaps it.
    command:
      - sh
      - -c
      - 'set -e; DATA="$${CALM_DATA_DIR:-/var/lib/neige-calm/data}"; mkdir -p "$$DATA"; SOCK="$${CALM_PROC_SUPERVISOR_SOCK:-$$DATA/proc-supervisor.sock}"; rm -f "$$SOCK"; calm-proc-supervisor --control-sock "$$SOCK" & i=0; until [ -S "$$SOCK" ]; do i=$$((i+1)); if [ "$$i" -gt 100 ]; then echo "proc-supervisor sock $$SOCK never appeared" >&2; exit 1; fi; sleep 0.1; done; exec calm-server'
    restart: unless-stopped

  web:
    # nginx serves the pre-built bundles and reverse-proxies /api → server; 4040 is reserved for host prod, so docker dev defaults to 4041.
    image: nginx:1.27-alpine
    # `depends_on` without a condition just orders startup; nginx will retry
    # upstream connections while the server finishes booting.
    depends_on:
      - server
    volumes:
      - ${CALM_FE_DIST:-./fe/web/dist}:/usr/share/nginx/html/next:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/calm.conf:ro
    # CALM_PUBLISH_ADDR=127.0.0.1 keeps the stack on loopback; `make dev|dev-fresh|up` require it
    # whenever CALM_DEV_AUTOLOGIN is on, since autologin makes every request the owner.
    ports:
      - "${CALM_PUBLISH_ADDR:-0.0.0.0}:${CALM_PORT:-4041}:8080"
    restart: unless-stopped
