static-import-plain: "import './static.css';"
static-import-query: "import './static.css?inline';"
static-import-fragment: "import './static.css#theme';"
static-import-query-fragment: "import './static.css?inline#theme';"
static-import-raw: "import './static.css?raw';"
re-export-plain: "export { default as styles } from './exported.css';"
re-export-query: "export { default as styles } from './exported.css?url';"
re-export-fragment: "export { default as styles } from './exported.css#theme';"
re-export-query-fragment: "export { default as styles } from './exported.css?url#theme';"
re-export-raw: "export { default as styles } from './exported.css?raw';"
dynamic-import-plain: "async function load() { await import('./dynamic.css'); }"
dynamic-import-query: "async function load() { await import('./dynamic.css?inline'); }"
dynamic-import-fragment: "async function load() { await import('./dynamic.css#theme'); }"
dynamic-import-query-fragment: "async function load() { await import('./dynamic.css?inline#theme'); }"
dynamic-import-raw: "async function load() { await import('./dynamic.css?raw'); }"
commonjs-require-plain: "function load() { return require('./legacy.css'); }"
commonjs-require-query: "function load() { return require('./legacy.css?url'); }"
commonjs-require-fragment: "function load() { return require('./legacy.css#theme'); }"
commonjs-require-query-fragment: "function load() { return require('./legacy.css?url#theme'); }"
commonjs-require-raw: "function load() { return require('./legacy.css?raw'); }"
