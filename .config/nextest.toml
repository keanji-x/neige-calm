# #903 — nextest profiles. CI runs with --profile ci; the local default
# profile keeps nextest defaults (test-threads = logical cores — on the shared
# production box pass an explicit --test-threads to cap concurrency, see the
# #903 design doc's local-verification section).

# Version floor: older nextest would silently ignore `default-filter` below,
# and the export_bindings_* tests would then run in parallel and corrupt the
# checked-in generated bindings — make that a hard error instead.
nextest-version = { required = "0.9.100" }

[profile.default]
# Exclude the ts-rs `export_bindings_*` generator tests (calm-types /
# calm-session / calm-editor). ts-rs 12's export-file merge lock is a
# process-local static; under nextest's process-per-test model the tests race
# and concurrently truncate/merge the shared checked-in outputs
# (web/src/api/generated*.ts), producing nondeterministic panics and a dirty
# working tree. Coverage is not lost: the openapi-drift CI job runs
# `npm run gen:api` (which invokes `cargo test … export_bindings_` in a single
# process) and verifies with `git diff --exit-code` on every PR — a strictly
# stronger check than running the tests here. Excluded in the default profile
# too so a plain local `cargo nextest run` cannot corrupt the working tree.
default-filter = 'not test(/export_bindings_/)'
# #1453 — warn at 60s, then TERMINATE at 60s x 10 = 600s.
#
# The warn-only setting this replaces gave a wedged test binary no ceiling at
# all: three `shared_codex_appserver` tests deadlocked on an unbounded
# WebSocket upgrade and sat at 0% CPU until a human killed them by PID, taking
# a self-hosted CI runner (and every PR queued behind it) with them. A killed
# test is a red verdict you can read; a wedged one is no verdict at all.
#
# Why 600s is not a flake source: the slowest test in a full local run is
# `append_seam_trybuild` at 72s (it compiles a crate), and the slowest known
# CI test is `migration_replay_harness::synthetic_fixture_replays_from_every_version`
# at up to 250s when it shares a contended four-core hosted runner. 600s is
# 2.4x that worst case, so nothing legitimately slow is inside the ceiling.
# The warn period stays at 60s so the SLOW lines that feed the timing analysis
# keep appearing.
slow-timeout = { period = "60s", terminate-after = 10 }

[profile.ci]
# Same ts-rs export-race exclusion as profile.default (see comment above).
default-filter = 'not test(/export_bindings_/)'
fail-fast = false                    # surface every failure in one round
retries = 0                          # don't mask flakes; revisit in Slice C if needed
failure-output = "immediate-final"   # print on failure + summarize at the end
status-level = "slow"
# #1453 — warn at 120s, then TERMINATE at 120s x 5 = 600s. Same ceiling and
# same rationale as profile.default above (nothing legitimate is near 600s;
# the worst known CI test peaks at ~250s). Demonstrated with a deliberately
# wedged test: nextest logged SLOW at 120/240/360/480s, then
# `TERMINATING [>600.000s]` and `Summary [600.009s] 1 test run: 0 passed,
# 1 timed out` — a named failure in this run instead of a runner held
# indefinitely. Its `osc-probe-child` daemon died with it (the fixture arms
# `PR_SET_PDEATHSIG`), leaving no orphan.
slow-timeout = { period = "120s", terminate-after = 5 }

[profile.ci.junit]
# Per-test timing on disk (target/nextest/ci/junit.xml), Slice C's timing input.
path = "junit.xml"

[test-groups]
# Real PTY/process tests observe kernel scheduling, fd and acknowledgement
# behavior. Run only one of them at once, and reserve half of the self-hosted
# eight-thread budget so ordinary SQLite-heavy tests cannot starve it. On the
# four-core hosted shards this intentionally makes each supervisor test
# exclusive; the package is small and reliability matters more than those few
# seconds.
proc-supervisor = { max-threads = 1 }

[[profile.ci.overrides]]
filter = 'package(calm-proc-supervisor) | test(/^(in_process_renderer_e2e|reconcile_supervisor_on_boot)::/)'
test-group = 'proc-supervisor'
threads-required = 4

[[profile.ci.overrides]]
# This O(N²) file-backed SQLite replay went from 44s to 250s when it shared a
# four-core hosted runner with three other database-heavy tests. Reserve the
# runner while it executes: coverage remains exhaustive, and the remaining
# partition resumes normal four-way parallelism as soon as it finishes.
filter = 'test(/^migration_replay_harness::synthetic_fixture_replays_from_every_version$/)'
threads-required = 4
